<body>
    <div id="root"></div>

    <script>
        // ===== STORAGE BRIDGE V11 CLEAN BACKUP =====
        const SafeStorage = (() => {
            const DB_NAME = 'alcantara_pro_storage_v8';
            const STORE = 'kv';
            const VERSION = 1;
            const MIGRATION_FLAG = '__alcantara_idb_migrated_v8__';
            const memory = {};
            let dbPromise = null;
            let readyResolve;
            const ready = new Promise(resolve => { readyResolve = resolve; });

            const cloneValue = (v) => v === undefined ? null : String(v);
            const keysToMirror = [
                'alcantara_os','alcantara_catalog','alcantara_products','alcantara_bank_transactions','alcantara_bank_fixed',
                'alcantara_bank_budgets','alcantara_bank_cards','alcantara_bank_card_entries','gf_fornecedores','gf_pecas',
                'gf_margem','alcantara_assistencias_registros','alcantara_customer_notes','alcantara_last_bench_os',
                'alcantara_auth','alcantara_equipment_history'
            ];

            function openDb() {
                if (dbPromise) return dbPromise;
                dbPromise = new Promise((resolve, reject) => {
                    const request = indexedDB.open(DB_NAME, VERSION);
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 'key' });
                    };
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error || new Error('Falha ao abrir IndexedDB'));
                });
                return dbPromise;
            }

            async function idbSetItem(key, value) {
                const db = await openDb();
                return new Promise((resolve, reject) => {
                    const tr = db.transaction(STORE, 'readwrite');
                    const st = tr.objectStore(STORE);
                    const req = st.put({ key, value: cloneValue(value), updatedAt: Date.now() });
                    req.onsuccess = () => resolve(true);
                    req.onerror = () => reject(req.error);
                });
            }

            async function idbRemoveItem(key) {
                const db = await openDb();
                return new Promise((resolve, reject) => {
                    const tr = db.transaction(STORE, 'readwrite');
                    const st = tr.objectStore(STORE);
                    const req = st.delete(key);
                    req.onsuccess = () => resolve(true);
                    req.onerror = () => reject(req.error);
                });
            }

            async function bootstrap() {
                if (!('indexedDB' in window)) {
                    console.warn('IndexedDB indisponível; usando localStorage padrão.');
                    readyResolve();
                    return;
                }
                try {
                    const db = await openDb();
                    const rows = await new Promise((resolve, reject) => {
                        const tr = db.transaction(STORE, 'readonly');
                        const st = tr.objectStore(STORE);
                        const req = st.getAll();
                        req.onsuccess = () => resolve(req.result || []);
                        req.onerror = () => reject(req.error);
                    });

                    rows.forEach(row => {
                        if (!row || !row.key) return;
                        memory[row.key] = cloneValue(row.value);
                        if (row.value !== null && row.value !== undefined) {
                            try { localStorage.setItem(row.key, cloneValue(row.value)); } catch (_) {}
                        }
                    });

                    const alreadyMigrated = localStorage.getItem(MIGRATION_FLAG) === 'true' || memory[MIGRATION_FLAG] === 'true';
                    if (!alreadyMigrated) {
                        const pending = [];
                        for (let i = 0; i < localStorage.length; i++) {
                            const key = localStorage.key(i);
                            if (!key) continue;
                            if (!keysToMirror.includes(key) && !key.startsWith('alcantara_') && !key.startsWith('gf_')) continue;
                            const value = localStorage.getItem(key);
                            memory[key] = cloneValue(value);
                            pending.push(idbSetItem(key, value));
                        }
                        pending.push(idbSetItem(MIGRATION_FLAG, 'true'));
                        memory[MIGRATION_FLAG] = 'true';
                        await Promise.allSettled(pending);
                        try { localStorage.setItem(MIGRATION_FLAG, 'true'); } catch (_) {}
                    }
                } catch (error) {
                    console.warn('Falha no bootstrap do IndexedDB:', error);
                } finally {
                    readyResolve();
                    window.dispatchEvent(new CustomEvent('alcantara-storage-ready'));
                }
            }

            bootstrap();

            return {
                ready,
                getItem(key) {
                    if (Object.prototype.hasOwnProperty.call(memory, key)) return memory[key];
                    const raw = localStorage.getItem(key);
                    if (raw !== null && raw !== undefined) memory[key] = cloneValue(raw);
                    return raw;
                },
                setItem(key, value) {
                    const normalized = cloneValue(value);
                    memory[key] = normalized;
                    localStorage.setItem(key, normalized);
                    if ('indexedDB' in window) idbSetItem(key, normalized).catch(err => console.warn('Falha ao persistir no IndexedDB:', err));
                },
                removeItem(key) {
                    delete memory[key];
                    localStorage.removeItem(key);
                    if ('indexedDB' in window) idbRemoveItem(key).catch(err => console.warn('Falha ao remover do IndexedDB:', err));
                },
                async exportAll() {
                    const db = await openDb();
                    return new Promise((resolve, reject) => {
                        const tr = db.transaction(STORE, 'readonly');
                        const st = tr.objectStore(STORE);
                        const req = st.getAll();
                        req.onsuccess = () => resolve(req.result || []);
                        req.onerror = () => reject(req.error);
                    });
                },
                async estimateUsage() {
                    let localBytes = 0;
                    try {
                        for (let i = 0; i < localStorage.length; i++) {
                            const key = localStorage.key(i);
                            const val = localStorage.getItem(key) || '';
                            localBytes += (String(key).length + String(val).length) * 2;
                        }
                    } catch (_) {}
                    let idbBytes = 0;
                    let rows = [];
                    try {
                        rows = await this.exportAll();
                        rows.forEach(row => {
                            const key = String(row?.key || '');
                            const val = String(row?.value || '');
                            idbBytes += (key.length + val.length) * 2;
                        });
                    } catch (_) {}
                    let quota = 0, usage = 0;
                    try {
                        if (navigator.storage && navigator.storage.estimate) {
                            const est = await navigator.storage.estimate();
                            quota = Number(est?.quota || 0);
                            usage = Number(est?.usage || 0);
                        }
                    } catch (_) {}
                    return { localBytes, idbBytes, quota, usage, rows: rows.length };
                },
                async compactData() {
                    const keys = [
                        'alcantara_bank_transactions','alcantara_bank_fixed','alcantara_bank_cards','alcantara_bank_card_entries',
                        'alcantara_bank_budgets','alcantara_os','alcantara_catalog','alcantara_products',
                        'gf_fornecedores','gf_pecas','alcantara_assistencias_registros','alcantara_customer_notes',
                        'alcantara_equipment_history'
                    ];
                    let cleaned = 0;
                    for (const key of keys) {
                        const raw = this.getItem(key);
                        if (raw === null || raw === undefined || raw === '') continue;
                        try {
                            const parsed = JSON.parse(raw);
                            if (Array.isArray(parsed)) {
                                const compacted = parsed.filter(Boolean);
                                this.setItem(key, JSON.stringify(compacted));
                                cleaned += Math.max(0, parsed.length - compacted.length);
                            } else if (parsed && typeof parsed === 'object') {
                                this.setItem(key, JSON.stringify(parsed));
                            }
                        } catch (_) {}
                    }
                    return { cleaned };
                },
                async restoreRows(rows) {
                    if (!Array.isArray(rows)) throw new Error('Backup inválido');
                    for (const row of rows) {
                        if (!row || !row.key) continue;
                        this.setItem(String(row.key), cloneValue(row.value));
                    }
                    return true;
                }
            };
        })();
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useMemo } = React;

        const safeJsonParse = (rawValue, fallbackValue) => {
            if (rawValue === null || rawValue === undefined || rawValue === '') return fallbackValue;
            try {
                return JSON.parse(rawValue);
            } catch (error) {
                console.warn('Falha ao ler JSON do localStorage:', error);
                return fallbackValue;
            }
        };
        const formatBytes = (bytes = 0) => {
            const value = Number(bytes || 0);
            if (!value) return '0 B';
            const units = ['B','KB','MB','GB'];
            let i = 0;
            let out = value;
            while (out >= 1024 && i < units.length - 1) { out /= 1024; i += 1; }
            return `${out.toFixed(out >= 10 || i === 0 ? 0 : 1)} ${units[i]}`;
        };

        const downloadJsonFile = (filename, payload) => {
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1200);
        };

        const APP_BACKUP_KEYS = [
            'alcantara_os','alcantara_catalog','alcantara_products','alcantara_bank_transactions','alcantara_bank_fixed',
            'alcantara_bank_budgets','alcantara_bank_cards','alcantara_bank_card_entries','gf_fornecedores','gf_pecas',
            'gf_margem','alcantara_assistencias_registros','alcantara_customer_notes','alcantara_last_bench_os',
            'alcantara_auth','alcantara_equipment_history'
        ];

        const buildFullAppBackup = async () => {
            const indexedRows = await SafeStorage.exportAll().catch(() => []);
            const localSnapshot = {};
            try {
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (!key) continue;
                    if (APP_BACKUP_KEYS.includes(key) || key.startsWith('alcantara_') || key.startsWith('gf_') || key.startsWith('__alcantara_')) {
                        localSnapshot[key] = localStorage.getItem(key);
                    }
                }
            } catch (_) {}
            return {
                version: 'V12 UNIFICADO',
                exportedAt: new Date().toISOString(),
                app: 'Alcantara Armeiro',
                mode: 'full_system_backup',
                localSnapshot,
                indexedRows,
                meta: {
                    totalLocalKeys: Object.keys(localSnapshot).length,
                    totalIndexedRows: Array.isArray(indexedRows) ? indexedRows.length : 0
                }
            };
        };

        const shareJsonFile = async (filename, payload, shareText = 'Backup do app') => {
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const file = new File([blob], filename, { type: 'application/json' });
            if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({
                    files: [file],
                    title: 'Backup Alcantara Armeiro',
                    text: shareText
                });
                return true;
            }
            downloadJsonFile(filename, payload);
            return false;
        };


        const isoToday = () => new Date().toISOString().slice(0,10);
        const isIsoDate = (value) => /^\d{4}-\d{2}-\d{2}$/.test(String(value || ''));
        const asArray = (value) => Array.isArray(value) ? value : [];
        const normalizeBudgets = (value) => ({
            personal: Number(value?.personal) > 0 ? Number(value.personal) : 2500,
            workshop: Number(value?.workshop) > 0 ? Number(value.workshop) : 1200
        });
        const normalizeFixedBill = (bill, fallbackIndex = 0) => {
            if (!bill || typeof bill !== 'object') return null;
            const rawDate = isIsoDate(bill.date) ? bill.date : isoToday();
            const parsedDay = parseInt(bill.day ?? rawDate.slice(8,10), 10);
            const safeDay = Number.isInteger(parsedDay) && parsedDay >= 1 && parsedDay <= 31
                ? parsedDay
                : parseInt(rawDate.slice(8,10), 10);
            const name = String(bill.name || '').trim();
            const value = Number(bill.value || 0);
            if (!name || value <= 0) return null;
            return {
                ...bill,
                id: String(bill.id || `fixed_${Date.now()}_${fallbackIndex}`),
                name,
                value,
                date: isIsoDate(bill.date) ? bill.date : `${rawDate.slice(0,7)}-${String(safeDay).padStart(2,'0')}`,
                day: safeDay,
                area: bill.area === 'pessoal' ? 'pessoal' : 'oficina',
                active: bill.active !== false,
                paidMonths: Array.isArray(bill.paidMonths)
                    ? [...new Set(bill.paidMonths.filter(m => /^\d{4}-\d{2}$/.test(String(m))))]
                    : []
            };
        };
        const normalizeFixedBills = (value) => asArray(value)
            .map((bill, index) => normalizeFixedBill(bill, index))
            .filter(Boolean);

        // ========== DB CONTEXT (estado global reativo) ==========
        const DbContext = React.createContext(null);

        const dbReducer = (state, action) => {
            let orders, products, catalog;
            switch (action.type) {
                case 'LOAD':
                    return {
                        orders:   asArray(safeJsonParse(SafeStorage.getItem('alcantara_os'), [])),
                        catalog:  asArray(safeJsonParse(SafeStorage.getItem('alcantara_catalog'), [])),
                        products: asArray(safeJsonParse(SafeStorage.getItem('alcantara_products'), [])),
                    };
                case 'SAVE_ORDER':
                    orders = [...state.orders];
                    const idx = orders.findIndex(o => o.id === action.order.id);
                    if (idx !== -1) orders[idx] = action.order; else orders.unshift(action.order);
                    SafeStorage.setItem('alcantara_os', JSON.stringify(orders));
                    return { ...state, orders };
                case 'DELETE_ORDER':
                    orders = state.orders.filter(o => o.id !== action.id);
                    SafeStorage.setItem('alcantara_os', JSON.stringify(orders));
                    return { ...state, orders };
                case 'SAVE_CATALOG_ITEM':
                    catalog = [...state.catalog];
                    const exists = catalog.find(c =>
                        c.name.toLowerCase() === action.item.name.toLowerCase() && c.type === action.item.type);
                    if (!exists) {
                        catalog.push({ ...action.item, id: Date.now().toString() });
                        SafeStorage.setItem('alcantara_catalog', JSON.stringify(catalog));
                        return { ...state, catalog };
                    }
                    return state;
                case 'DELETE_CATALOG_ITEM':
                    catalog = state.catalog.filter(i => i.id !== action.id);
                    SafeStorage.setItem('alcantara_catalog', JSON.stringify(catalog));
                    return { ...state, catalog };
                case 'UPDATE_CATALOG_ITEM':
                    catalog = state.catalog.map(i => i.id === action.item.id ? action.item : i);
                    SafeStorage.setItem('alcantara_catalog', JSON.stringify(catalog));
                    return { ...state, catalog };
                case 'SAVE_PRODUCT':
                    products = [...state.products];
                    const pExists = products.find(p => p.name.toLowerCase() === action.product.name.toLowerCase());
                    if (!pExists) {
                        products.push({ ...action.product, id: Date.now().toString(),
                            stock: parseInt(action.product.stock) || 0,
                            price: parseFloat(action.product.price) || 0 });
                        SafeStorage.setItem('alcantara_products', JSON.stringify(products));
                        return { ...state, products };
                    }
                    return state;
                case 'UPDATE_PRODUCT':
                    products = state.products.map(p => p.id === action.product.id
                        ? { ...action.product, stock: parseInt(action.product.stock)||0, price: parseFloat(action.product.price)||0 }
                        : p);
                    SafeStorage.setItem('alcantara_products', JSON.stringify(products));
                    return { ...state, products };
                case 'DELETE_PRODUCT':
                    products = state.products.filter(p => p.id !== action.id);
                    SafeStorage.setItem('alcantara_products', JSON.stringify(products));
                    return { ...state, products };
                case 'RESERVE_STOCK': {
                    products = [...state.products];
                    const pi = products.findIndex(p => p.id === action.productId);
                    if (pi === -1) return state;
                    const cur = parseInt(products[pi].stock) || 0;
                    if (cur < action.qty) return state;
                    products[pi] = { ...products[pi], stock: cur - action.qty };
                    SafeStorage.setItem('alcantara_products', JSON.stringify(products));
                    return { ...state, products };
                }
                case 'RELEASE_STOCK': {
                    products = [...state.products];
                    const ri = products.findIndex(p => p.id === action.productId);
                    if (ri === -1) return state;
                    products[ri] = { ...products[ri], stock: (parseInt(products[ri].stock)||0) + action.qty };
                    SafeStorage.setItem('alcantara_products', JSON.stringify(products));
                    return { ...state, products };
                }
                default:
                    return state;
            }
        };

        const DbProvider = ({ children }) => {
            const [state, dispatch] = React.useReducer(dbReducer, null, () => ({
                orders:   asArray(safeJsonParse(SafeStorage.getItem('alcantara_os'), [])),
                catalog:  asArray(safeJsonParse(SafeStorage.getItem('alcantara_catalog'), [])),
                products: asArray(safeJsonParse(SafeStorage.getItem('alcantara_products'), [])),
            }));
            return (
                <DbContext.Provider value={{ state, dispatch }}>
                    {children}
                </DbContext.Provider>
            );
        };

        const useDb = () => React.useContext(DbContext);


        // ========== MÁSCARA DE TELEFONE ==========
        const formatPhone = (v) => {
            const d = v.replace(/\D/g, '').slice(0, 11);
            if (d.length <= 2) return d;
            if (d.length <= 6) return `(${d.slice(0,2)}) ${d.slice(2)}`;
            if (d.length <= 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
            return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
        };

        // ========== MODAL DE CONFIRMAÇÃO (substitui confirm() nativo) ==========
        const ConfirmModal = ({ message, subMessage, onConfirm, onCancel, confirmLabel = "CONFIRMAR", confirmClass = "gold-gradient", icon = "alert-triangle" }) => (
            <div className="modal-overlay" onClick={onCancel} role="dialog" aria-modal="true" aria-label="Confirmação">

                            {confirmLabel}

                    </div>
                </div>
            </div>
        );

        const useConfirm = () => {
            const [cfg, setCfg] = useState(null);
            const confirm = useCallback((opts) => new Promise(resolve => {
                setCfg({ ...opts, resolve });
            }), []);
            const modal = cfg ? (
                <ConfirmModal
                    {...cfg}
                    onConfirm={() => { cfg.resolve(true);  setCfg(null); }}
                    onCancel={() =>  { cfg.resolve(false); setCfg(null); }}
                />
            ) : null;
            return { confirm, modal };
        };


        // ========== LISTA VIRTUALIZADA (paginação incremental) ==========
        const PAGE_SIZE = 20;
        const VirtualOrderList = ({ items, onSelect }) => {
            const [page, setPage] = useState(1);
            const visible = useMemo(() => items.slice(0, page * PAGE_SIZE), [items, page]);
            const hasMore = visible.length < items.length;

            const loaderRef = useRef(null);
            useEffect(() => {
                if (!loaderRef.current || !hasMore) return;
                const obs = new IntersectionObserver(entries => {
                    if (entries[0].isIntersecting) setPage(p => p + 1);
                }, { threshold: 0.1 });
                obs.observe(loaderRef.current);
                return () => obs.disconnect();
            }, [hasMore]);

            // reset page when items change (filter/search)
            useEffect(() => setPage(1), [items]);

            return (
                <>
                    {visible.map(o => {
                        const statusConfig = STATUS_CONFIG[o.status] || STATUS_CONFIG.ABERTA;
                        return (
                            <div
                                key={o.id}
                                onClick={() => onSelect(o)}
                                className="os-card p-4 rounded-xl cursor-pointer transition-all hover:scale-[1.01] active:scale-[0.99]"
                                role="button"
                                tabIndex={0}
                                onKeyDown={e => e.key === 'Enter' && onSelect(o)}
                                aria-label={`OS #${o.osNumber} - ${o.customerName}`}
                            >
                                <div className="flex justify-between items-start mb-2">
                                    <div className="flex-1 min-w-0 mr-3">
                                        <p className="text-[8px] text-gray-600 font-mono mb-1">OS #{o.osNumber}</p>
                                        <p className="font-bold text-white text-sm truncate">{o.customerName}</p>
                                        <p className="text-xs text-gray-500 truncate mt-1">{o.equipment}</p>
                                    </div>
                                    <div className="text-right flex-shrink-0">
                                        <p className="font-usarmy text-[#d4af37] text-base">R$ {calculateTotal(o).toFixed(2)}</p>
                                        <p className="text-[9px] text-gray-600 mt-1">{o.date}</p>

                                </div>
                                <div className="flex items-center justify-between mt-3 pt-2 border-t border-white/5">

                                        {statusConfig.label}

                                    <span className={`payment-badge ${o.paymentStatus === 'PAGO' ? 'paid' : 'pending'}`}>
                                        <i data-lucide={o.paymentStatus === 'PAGO' ? 'check-circle' : 'clock'} className="w-3 h-3"></i>
                                        {o.paymentStatus === 'PAGO' ? 'PAGO' : 'PENDENTE'}
                                    </span>
                                </div>
                            </div>
                        );
                    })}
                    {hasMore && (

                    {items.length === 0 && (
                        <div className="text-center py-20">
                            <i data-lucide="inbox" className="w-16 h-16 text-gray-700 mx-auto mb-4"></i>
                            <p className="text-gray-600 font-usarmy text-xs">NENHUMA ORDEM ENCONTRADA</p>
                        </div>
                    )}
                </>
            );
        };


        // ========== CONFIGURAÇÕES ==========
        // Auth: comparação em tempo constante para evitar timing attacks
        const verifyPassword = (input) => {
            const encoded = btoa(input).split('').reverse().join('');
            const expected = '==ANzITM';
            if (encoded.length !== expected.length) return false;
            let diff = 0;
            for (let i = 0; i < expected.length; i++) {
                diff |= encoded.charCodeAt(i) ^ expected.charCodeAt(i);
            }
            return diff === 0;
        };

        const LOGO_URL = "https://i.ibb.co/LFtsfFp/logo.jpg";
        const DADOS_EMPRESA = {
            nome: "ALCANTARA ARMEIRO",

            cidade: "São Paulo - SP, 02479000",
            contato: "(11) 96735-1384 | alcantara.armeiro@gmail.com"
        };

        const STATUS_CONFIG = {
            ABERTA: { color: 'bg-yellow-500', text: 'text-yellow-500', bg: 'bg-yellow-500/20', border: 'border-yellow-500/30', label: 'ABERTA' },
            EM_CURSO: { color: 'bg-blue-500', text: 'text-blue-500', bg: 'bg-blue-500/20', border: 'border-blue-500/30', label: 'EM CURSO' },
            AGUARDANDO_PECA: { color: 'bg-orange-500', text: 'text-orange-500', bg: 'bg-orange-500/20', border: 'border-orange-500/30', label: 'AGUARDANDO PEÇA' },
            CONCLUIDA: { color: 'bg-green-500', text: 'text-green-500', bg: 'bg-green-500/20', border: 'border-green-500/30', label: 'CONCLUÍDA' },
            CANCELADA: { color: 'bg-red-500', text: 'text-red-500', bg: 'bg-red-500/20', border: 'border-red-500/30', label: 'CANCELADA' }
        };

        const OPERATIONAL_STAGES = [
            { key: 'ENTRADA', label: 'ENTRADA', cardClass: 'card-missoes', textClass: 'text-blue-400', icon: 'inbox' },
            { key: 'TRIAGEM', label: 'TRIAGEM', cardClass: 'card-faturamento', textClass: 'text-orange-400', icon: 'clipboard' },
            { key: 'DIAGNOSTICO', label: 'DIAGNÓSTICO', cardClass: 'card-pendentes', textClass: 'text-yellow-400', icon: 'search' },
            { key: 'AGUARDANDO_APROVACAO', label: 'AGUARDANDO APROVAÇÃO', cardClass: 'card-custos', textClass: 'text-red-400', icon: 'alert-circle' },
            { key: 'AGUARDANDO_PECA', label: 'AGUARDANDO PEÇA', cardClass: 'card-faturamento', textClass: 'text-orange-400', icon: 'package' },
            { key: 'EM_SERVICO', label: 'EM SERVIÇO', cardClass: 'card-missoes', textClass: 'text-blue-400', icon: 'wrench' },
            { key: 'EM_TESTE', label: 'EM TESTE', cardClass: 'card-pendentes', textClass: 'text-yellow-400', icon: 'flask-conical' },
            { key: 'PRONTO', label: 'PRONTO', cardClass: 'card-pagas', textClass: 'text-green-400', icon: 'check-circle-2' },
            { key: 'ENTREGUE', label: 'ENTREGUE', cardClass: 'card-lucro', textClass: 'text-green-400', icon: 'truck' }
        ];

        const OPERATIONAL_STAGE_LABELS = OPERATIONAL_STAGES.reduce((acc, stage) => {
            acc[stage.key] = stage.label;
            return acc;
        }, {});

        const normalizeOperationalStatus = (value) => {
            const raw = String(value || 'ENTRADA')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .trim()
                .toUpperCase()
                .replace(/\s+/g, '_');

            const exact = OPERATIONAL_STAGES.find(stage => stage.key === raw);
            if (exact) return exact.key;

            const byLabel = OPERATIONAL_STAGES.find(stage =>
                stage.label
                    .normalize('NFD')
                    .replace(/[\u0300-\u036f]/g, '')
                    .trim()
                    .toUpperCase()
                    .replace(/\s+/g, '_') === raw
            );

            return byLabel ? byLabel.key : 'ENTRADA';
        };

        // ========== BANCO DE DADOS ==========
        const db = {
            getOrders: () => asArray(safeJsonParse(SafeStorage.getItem('alcantara_os'), [])),
            saveOrder: (order) => {
                const orders = db.getOrders();
                const idx = orders.findIndex(o => o.id === order.id);
                if (idx !== -1) orders[idx] = order; 
                else orders.unshift(order);
                SafeStorage.setItem('alcantara_os', JSON.stringify(orders));
            },
            deleteOrder: (id) => {
                const orders = db.getOrders().filter(o => o.id !== id);
                SafeStorage.setItem('alcantara_os', JSON.stringify(orders));
            },
            getCatalog: () => asArray(safeJsonParse(SafeStorage.getItem('alcantara_catalog'), [])),
            saveCatalogItem: (item) => {
                const catalog = db.getCatalog();
                const exists = catalog.find(c => 
                    c.name.toLowerCase() === item.name.toLowerCase() && 
                    c.type === item.type
                );
                if (!exists) {
                    catalog.push({ ...item, id: Date.now().toString() });
                    SafeStorage.setItem('alcantara_catalog', JSON.stringify(catalog));
                }
            },
            deleteCatalogItem: (id) => {
                const catalog = db.getCatalog().filter(i => i.id !== id);
                SafeStorage.setItem('alcantara_catalog', JSON.stringify(catalog));
            },
            getProducts: () => asArray(safeJsonParse(SafeStorage.getItem('alcantara_products'), [])),
            saveProduct: (product) => {
                const products = db.getProducts();
                const exists = products.find(p => 
                    p.name.toLowerCase() === product.name.toLowerCase()
                );
                if (!exists) {
                    products.push({ 
                        ...product, 
                        id: Date.now().toString(),
                        stock: parseInt(product.stock) || 0,
                        price: parseFloat(product.price) || 0
                    });
                    SafeStorage.setItem('alcantara_products', JSON.stringify(products));
                }
            },
            updateProduct: (updatedProduct) => {
                const products = db.getProducts();
                const idx = products.findIndex(p => p.id === updatedProduct.id);
                if (idx !== -1) {
                    products[idx] = {
                        ...updatedProduct,
                        stock: parseInt(updatedProduct.stock) || 0,
                        price: parseFloat(updatedProduct.price) || 0
                    };
                    SafeStorage.setItem('alcantara_products', JSON.stringify(products));
                }
            },
            checkAndReserveStock: (productId, requestedQuantity) => {
                const products = db.getProducts();
                const idx = products.findIndex(p => p.id === productId);
                if (idx === -1) return { success: false, error: 'Produto não encontrado' };

                const currentStock = parseInt(products[idx].stock) || 0;
                if (currentStock < requestedQuantity) {
                    return { 
                        success: false, 
                        error: `Estoque insuficiente. Disponível: ${currentStock}, Solicitado: ${requestedQuantity}`,
                        available: currentStock
                    };
                }

                products[idx].stock = currentStock - requestedQuantity;
                SafeStorage.setItem('alcantara_products', JSON.stringify(products));
                return { success: true, newStock: products[idx].stock };
            },
            releaseStock: (productId, quantity) => {
                const products = db.getProducts();
                const idx = products.findIndex(p => p.id === productId);
                if (idx !== -1) {
                    products[idx].stock = (parseInt(products[idx].stock) || 0) + quantity;
                    SafeStorage.setItem('alcantara_products', JSON.stringify(products));
                    return products[idx].stock;
                }
                return null;
            },
            updateStock: (productId, quantity) => {
                const products = db.getProducts();
                const idx = products.findIndex(p => p.id === productId);
                if (idx !== -1) {
                    products[idx].stock = parseInt(products[idx].stock || 0) + quantity;
                    if (products[idx].stock < 0) products[idx].stock = 0;
                    SafeStorage.setItem('alcantara_products', JSON.stringify(products));
                    return products[idx].stock;
                }
                return null;
            },
            deleteProduct: (id) => {
                const products = db.getProducts().filter(p => p.id !== id);
                SafeStorage.setItem('alcantara_products', JSON.stringify(products));
            },
            exportBackup: () => {
                const data = { 
                    orders: db.getOrders(), 
                    catalog: db.getCatalog(),
                    products: db.getProducts(),
                    bankTransactions: asArray(safeJsonParse(SafeStorage.getItem('alcantara_bank_transactions'), [])),
                    bankFixedBills: normalizeFixedBills(safeJsonParse(SafeStorage.getItem('alcantara_bank_fixed'), [])),
                    bankBudgets: normalizeBudgets(safeJsonParse(SafeStorage.getItem('alcantara_bank_budgets'), { personal: 2500, workshop: 1200 })),
                    suppliers: asArray(safeJsonParse(SafeStorage.getItem('gf_fornecedores'), [])),
                    assistencias: asArray(safeJsonParse(SafeStorage.getItem('alcantara_assistencias_registros'), [])),
                    parts: asArray(safeJsonParse(SafeStorage.getItem('gf_pecas'), [])),
                    equipmentHistory: getEquipmentHistoryRecords(),
                    defaultMargin: SafeStorage.getItem('gf_margem') || '200',
                    exportDate: new Date().toISOString(),
                    version: '7.0'
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `backup_alcantara_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(a.href);
            },
            importBackup: (file) => {
                if (!file) return Promise.reject('Nenhum arquivo selecionado');
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const data = JSON.parse(e.target.result);
                            if (!data.orders || !Array.isArray(data.orders)) {
                                reject('Arquivo de backup inválido: orders não encontrado');
                                return;
                            }
                            if (data.catalog) SafeStorage.setItem('alcantara_catalog', JSON.stringify(asArray(data.catalog)));
                            if (data.products) SafeStorage.setItem('alcantara_products', JSON.stringify(asArray(data.products)));
                            if (data.bankTransactions) SafeStorage.setItem('alcantara_bank_transactions', JSON.stringify(asArray(data.bankTransactions)));
                            if (data.bankFixedBills) SafeStorage.setItem('alcantara_bank_fixed', JSON.stringify(normalizeFixedBills(data.bankFixedBills)));
                            if (data.bankBudgets) SafeStorage.setItem('alcantara_bank_budgets', JSON.stringify(normalizeBudgets(data.bankBudgets)));
                            if (data.suppliers) SafeStorage.setItem('gf_fornecedores', JSON.stringify(asArray(data.suppliers)));
                            if (data.assistencias) SafeStorage.setItem('alcantara_assistencias_registros', JSON.stringify(asArray(data.assistencias)));
                            if (data.parts) SafeStorage.setItem('gf_pecas', JSON.stringify(asArray(data.parts)));
                            if (data.equipmentHistory) saveEquipmentHistoryRecords(asArray(data.equipmentHistory));
                            if (data.defaultMargin !== undefined) SafeStorage.setItem('gf_margem', String(data.defaultMargin));
                            SafeStorage.setItem('alcantara_os', JSON.stringify(asArray(data.orders)));
                            resolve(data);
                        } catch (err) { 
                            reject('Erro ao importar arquivo: ' + err.message);
                        }
                    };
                    reader.onerror = () => reject('Erro ao ler arquivo');
                    reader.readAsText(file);
                });
            }
        };

        // ========== TOAST NOTIFICATIONS ==========
        const showToast = (message, type = 'info') => {

        // ========== FUNÇÕES DE CÁLCULO ==========
        const calculateSubtotal = (order) => {
            const servicesTotal = order.services?.reduce((acc, s) => acc + (parseFloat(s.price) || 0), 0) || 0;
            const partsTotal = order.parts?.reduce((acc, p) => acc + (parseFloat(p.price) || 0), 0) || 0;
            const productsTotal = order.products?.reduce((acc, p) => acc + (parseFloat(p.price) || 0), 0) || 0;
            return servicesTotal + partsTotal + productsTotal;
        };

        const calculateDiscount = (order) => {
            const subtotal = calculateSubtotal(order);
            const discountType = order.discountType || 'none';
            const discountValue = parseFloat(order.discountValue) || 0;

            if (discountType === 'percentage') {
                return Math.min((subtotal * discountValue) / 100, subtotal);
            } else if (discountType === 'fixed') {
                return Math.min(discountValue, subtotal);
            }
            return 0;
        };

        const calculateTotal = (order) => {
            const subtotal = calculateSubtotal(order);
            const discount = calculateDiscount(order);
            return Math.max(0, subtotal - discount);
        };

        const CUSTOMER_NOTES_KEY = 'alcantara_customer_notes';

        const normalizeCustomerKey = (value) => String(value || '')
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .trim()
            .toUpperCase();

        const parsePtBrDate = (value) => {
            const raw = String(value || '').trim();
            const match = raw.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
            if (!match) return 0;
            const [, day, month, year] = match;
            return new Date(`${year}-${month}-${day}T12:00:00`).getTime() || 0;
        };

        const getCustomerNotesMap = () => {
            const raw = safeJsonParse(SafeStorage.getItem(CUSTOMER_NOTES_KEY), {});
            return raw && typeof raw === 'object' && !Array.isArray(raw) ? raw : {};
        };

        const saveCustomerNote = (customerName, note) => {
            const key = normalizeCustomerKey(customerName);
            if (!key) return;
            const notesMap = getCustomerNotesMap();
            const cleaned = String(note || '').trim();
            if (cleaned) notesMap[key] = cleaned;
            else delete notesMap[key];
            SafeStorage.setItem(CUSTOMER_NOTES_KEY, JSON.stringify(notesMap));
        };

        const getCustomerHistorySnapshot = (orders, customerName, currentOrderId = null) => {
            const key = normalizeCustomerKey(customerName);
            const notesMap = getCustomerNotesMap();
            const emptyState = {
                hasHistory: false,
                totalOrders: 0,
                pendingOrders: 0,
                averageTicket: 0,
                totalPaid: 0,
                lastEquipment: '',
                lastDefect: '',
                lastOrderLabel: '',
                internalNote: notesMap[key] || '',
                lastOrders: []
            };

            if (!key) return emptyState;

            const relatedOrders = asArray(orders)
                .filter(order => order && order.id !== currentOrderId && normalizeCustomerKey(order.customerName) === key)
                .sort((a, b) => {
                    const diff = parsePtBrDate(b.date) - parsePtBrDate(a.date);
                    if (diff !== 0) return diff;
                    const osA = parseInt(String(a.osNumber || '0').replace(/\D/g, ''), 10) || 0;
                    const osB = parseInt(String(b.osNumber || '0').replace(/\D/g, ''), 10) || 0;
                    return osB - osA;
                });

            if (!relatedOrders.length) return emptyState;

            const totalPaid = relatedOrders.reduce((sum, order) => (
                order.paymentStatus === 'PAGO' ? sum + calculateTotal(order) : sum
            ), 0);

            const averageTicket = relatedOrders.reduce((sum, order) => sum + calculateTotal(order), 0) / relatedOrders.length;
            const pendingOrders = relatedOrders.filter(order => {
                const stage = normalizeOperationalStatus(order.operationalStatus || 'ENTRADA');
                return order.status !== 'CANCELADA' && stage !== 'ENTREGUE';
            }).length;

            const latest = relatedOrders[0];

            return {
                hasHistory: true,
                totalOrders: relatedOrders.length,
                pendingOrders,
                averageTicket,
                totalPaid,
                lastEquipment: latest?.equipment || '',
                lastDefect: latest?.defects || '',
                lastOrderLabel: latest ? `OS #${latest.osNumber || '-'} • ${latest.date || '-'}` : '',
                internalNote: notesMap[key] || '',
                lastOrders: relatedOrders.slice(0, 3)
            };
        };

        const getLatestCustomerOrder = (orders, customerName, currentOrderId = null) => {
            const key = normalizeCustomerKey(customerName);
            if (!key) return null;

            const relatedOrders = asArray(orders)
                .filter(order => order && order.id !== currentOrderId && normalizeCustomerKey(order.customerName) === key)
                .sort((a, b) => {
                    const diff = parsePtBrDate(b.date) - parsePtBrDate(a.date);
                    if (diff !== 0) return diff;
                    const osA = parseInt(String(a.osNumber || '0').replace(/\D/g, ''), 10) || 0;
                    const osB = parseInt(String(b.osNumber || '0').replace(/\D/g, ''), 10) || 0;
                    return osB - osA;
                });

            return relatedOrders[0] || null;
        };

        const getCustomerOperationalProfile = (orders, customerName, currentOrderId = null) => {
            const key = normalizeCustomerKey(customerName);
            if (!key) return null;

            const relatedOrders = asArray(orders)
                .filter(order => order && order.id !== currentOrderId && normalizeCustomerKey(order.customerName) === key)
                .sort((a, b) => {
                    const diff = parsePtBrDate(b.date) - parsePtBrDate(a.date);
                    if (diff !== 0) return diff;
                    const osA = parseInt(String(a.osNumber || '0').replace(/\D/g, ''), 10) || 0;
                    const osB = parseInt(String(b.osNumber || '0').replace(/\D/g, ''), 10) || 0;
                    return osB - osA;
                });

            if (!relatedOrders.length) return null;

            const platformCounts = { AEG: 0, GBB: 0, HPA: 0, SPRING: 0, OUTROS: 0 };
            const serviceCounts = {};
            const equipmentCounts = {};

            relatedOrders.forEach(order => {
                const eqUpper = String(order.equipment || '').toUpperCase();

                if (eqUpper.includes('AEG')) platformCounts.AEG += 1;
                else if (eqUpper.includes('GBB') || eqUpper.includes('GBBR') || eqUpper.includes('PISTOLA')) platformCounts.GBB += 1;
                else if (eqUpper.includes('HPA')) platformCounts.HPA += 1;
                else if (eqUpper.includes('SPRING') || eqUpper.includes('MOLA')) platformCounts.SPRING += 1;
                else platformCounts.OUTROS += 1;

                const normalizedEquipment = String(order.equipment || '').trim();
                if (normalizedEquipment) equipmentCounts[normalizedEquipment] = (equipmentCounts[normalizedEquipment] || 0) + 1;

                asArray(order.services).forEach(service => {
                    const serviceName = String(service?.name || '').trim();
                    if (serviceName) serviceCounts[serviceName] = (serviceCounts[serviceName] || 0) + 1;
                });
            });

            const favoritePlatform = Object.entries(platformCounts).sort((a, b) => b[1] - a[1])[0]?.[0] || 'OUTROS';
            const favoriteService = Object.entries(serviceCounts).sort((a, b) => b[1] - a[1])[0]?.[0] || '—';
            const recurringEquipment = Object.entries(equipmentCounts)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 3)
                .map(([name, count]) => ({ name, count }));

            const latest = relatedOrders[0];
            const lastSolution = asArray(latest?.services).map(service => service?.name).filter(Boolean).join(', ') || '—';
            const recurrenceLabel = relatedOrders.length >= 5
                ? 'CLIENTE ELITE'
                : relatedOrders.length >= 3
                    ? 'CLIENTE RECORRENTE'
                    : relatedOrders.length >= 2
                        ? 'CLIENTE OCASIONAL'
                        : 'CLIENTE NOVO';

            const daysSinceLastOrder = latest?.date
                ? Math.max(0, Math.floor((Date.now() - parsePtBrDate(latest.date)) / 86400000))
                : null;

            const attentionTags = [];
            const pendingOrders = relatedOrders.filter(order => {
                const stage = normalizeOperationalStatus(order.operationalStatus || 'ENTRADA');
                return order.status !== 'CANCELADA' && stage !== 'ENTREGUE';
            }).length;

            if (pendingOrders > 0) attentionTags.push('TEM OS PENDENTE');
            if (favoritePlatform !== 'OUTROS') attentionTags.push(`FOCO ${favoritePlatform}`);
            if (relatedOrders.length >= 3) attentionTags.push('CLIENTE RECORRENTE');
            if (relatedOrders.some(order => order.paymentStatus === 'PENDENTE')) attentionTags.push('ATENÇÃO EM PAGAMENTO');

            return {
                totalOrders: relatedOrders.length,
                recurrenceLabel,
                favoritePlatform,
                favoriteService,
                lastEquipment: latest?.equipment || '—',
                lastSolution,
                daysSinceLastOrder,
                recurringEquipment,
                attentionTags: attentionTags.slice(0, 4)
            };
        };


        const EQUIPMENT_HISTORY_KEY = 'alcantara_equipment_history';

        const getEquipmentHistoryRecords = () => asArray(safeJsonParse(SafeStorage.getItem(EQUIPMENT_HISTORY_KEY), []))
            .filter(item => item && typeof item === 'object')
            .map((item, index) => ({
                id: String(item.id || `eq_${Date.now()}_${index}`),
                brand: String(item.brand || '').trim(),
                model: String(item.model || '').trim(),
                ammoType: String(item.ammoType || '').trim(),
                defect: String(item.defect || '').trim(),
                diagnosis: String(item.diagnosis || '').trim(),
                classification: String(item.classification || 'EM_ANALISE').trim(),
                notes: String(item.notes || '').trim(),
                date: String(item.date || new Date().toLocaleDateString('pt-BR')).trim()
            }));

        const saveEquipmentHistoryRecords = (records) => {
            SafeStorage.setItem(EQUIPMENT_HISTORY_KEY, JSON.stringify(asArray(records)));
        };

        const getEquipmentHistorySummary = (records) => {
            const valid = asArray(records).filter(record => record && (record.brand || record.model || record.defect));
            const bySignature = {};
            const byDefect = {};

            valid.forEach(record => {
                const signature = `${String(record.brand || '').trim().toUpperCase()}|${String(record.model || '').trim().toUpperCase()}`;
                const defectKey = `${String(record.model || '').trim().toUpperCase()}|${String(record.defect || '').trim().toUpperCase()}`;

                if (signature !== '|') bySignature[signature] = (bySignature[signature] || 0) + 1;
                if (defectKey !== '|') byDefect[defectKey] = (byDefect[defectKey] || 0) + 1;
            });

            const recurringModels = Object.entries(bySignature)
                .filter(([, count]) => count > 1)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5)
                .map(([signature, count]) => {
                    const [brand, model] = signature.split('|');
                    return { label: `${brand || 'SEM MARCA'} ${model || ''}`.trim(), count };
                });

            const recurringDefects = Object.entries(byDefect)
                .filter(([, count]) => count > 1)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5)
                .map(([signature, count]) => {
                    const [model, defect] = signature.split('|');
                    return { label: `${model || 'MODELO'} • ${defect || 'DEFEITO'}`.trim(), count };
                });

            return { recurringModels, recurringDefects };
        };

                const paid = isBillPaidForMonth(bill, ym);
                if (!dueDate) {
                    return {
                        paid,
                        dueDate: null,
                        started: false,
                        daysUntil: null,
                        urgent: false,
                        overdue: false,
                        waiting: true,
                        label: 'AGUARDANDO',
                    };

                const waiting = !paid && (!isCurrentMonthView || diffDays > 5);
                const urgent = !paid && isCurrentMonthView && diffDays >= 0 && diffDays <= 5;
                const overdue = !paid && isCurrentMonthView && diffDays < 0;

                    dueDate,
                    started: true,

                const entryDay = parseInt(String(entry.date).slice(8,10), 10);

        const Fornecedores = ({ onBack }) => {
            const STORAGE_KEY = 'alcantara_assistencia_tecnica';
            const emptyForm = { name: '', site: '', whatsapp: '' };

            const normalizeSite = (value) => {
                const raw = String(value || '').trim();
                if (!raw) return '';
                if (/^https?:\/\//i.test(raw)) return raw;
                return `https://${raw}`;
            };

            const normalizeWhatsapp = (value) => {
                const digits = String(value || '').replace(/\D/g, '');
                if (!digits) return '';
                if (digits.length === 10 || digits.length === 11) return `55${digits}`;
                return digits;
            };

            const getPartnerLink = (partner) => {
                const site = normalizeSite(partner?.site || '');
                if (site) return site;
                const whatsapp = normalizeWhatsapp(partner?.whatsapp || '');
                if (whatsapp) return `https://wa.me/${whatsapp}`;
                return '';
            };

            const getPartnerLabel = (partner) => {
                const site = normalizeSite(partner?.site || '');
                if (site) return site;
                const whatsapp = normalizeWhatsapp(partner?.whatsapp || '');
                if (!whatsapp) return 'Contato não informado';
                const phone = whatsapp.startsWith('55') && whatsapp.length >= 12 ? whatsapp.slice(2) : whatsapp;
                return `WhatsApp: ${phone}`;
            };

            const getPartnerType = (partner) => normalizeSite(partner?.site || '') ? 'site' : 'whatsapp';

            const normalizePartner = (partner, index = 0) => {
                if (!partner || typeof partner !== 'object') return null;
                const name = String(partner.name || '').trim();
                const site = normalizeSite(partner.site || '');
                const whatsapp = normalizeWhatsapp(partner.whatsapp || '');
                if (!name || (!site && !whatsapp)) return null;
                return {
                    id: String(partner.id || `partner_${Date.now()}_${index}`),
                    name,
                    site,
                    whatsapp,
                    createdAt: partner.createdAt || new Date().toISOString()
                };
            };

            const loadPartners = () => {
                try {
                    const raw = SafeStorage.getItem(STORAGE_KEY);
                    return asArray(safeJsonParse(raw, []))
                        .map((partner, index) => normalizePartner(partner, index))
                        .filter(Boolean);
                } catch (error) {
                    console.error('Erro ao carregar parceiros:', error);
                    return [];
                }
            };

            const persistPartners = (list) => {
                try {
                    SafeStorage.setItem(STORAGE_KEY, JSON.stringify(asArray(list)));
                    return true;
                } catch (error) {
                    console.error('Erro ao salvar parceiros:', error);
                    showToast('⚠️ Erro ao salvar parceiros', 'error');
                    return false;
                }
            };

            const [partners, setPartners] = useState(loadPartners);
            const [editingId, setEditingId] = useState(null);
            const [form, setForm] = useState({ ...emptyForm });
            const [confirmDelete, setConfirmDelete] = useState(null);

            const handleSubmit = (e) => {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }

                try {
                    const name = String(form.name || '').trim();
                    const site = normalizeSite(form.site);
                    const whatsapp = normalizeWhatsapp(form.whatsapp);
                    const wasEditing = !!editingId;

                    if (!name || (!site && !whatsapp)) {
                        showToast('⚠️ Preencha nome e informe site ou WhatsApp', 'warning');
                        return false;
                    }

                    const partner = {
                        id: editingId || `partner_${Date.now()}`,
                        name,
                        site,
                        whatsapp,
                        createdAt: editingId
                            ? (partners.find(p => p.id === editingId)?.createdAt || new Date().toISOString())
                            : new Date().toISOString()
                    };

                    const safePrev = asArray(partners)
                        .map((item, index) => normalizePartner(item, index))
                        .filter(Boolean);
                    const list = [...safePrev];
                    const index = list.findIndex(item => item.id === partner.id);

                    if (index >= 0) list[index] = partner;
                    else list.unshift(partner);

                    persistPartners(list);
                    setPartners(list);
                    setForm({ ...emptyForm });
                    setEditingId(null);
                    showToast(wasEditing ? '✅ Fornecedor atualizado' : '✅ Fornecedor cadastrado', 'success');

                    try {
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    } catch (scrollError) {
                        window.scrollTo(0, 0);
                    }

                    return false;
                } catch (error) {
                    console.error('Erro ao cadastrar fornecedor:', error);
                    showToast('⚠️ Erro ao salvar cadastro', 'error');
                    return false;
                }
            };

            const handleEdit = (partner) => {
                setForm({
                    name: String(partner?.name || ''),
                    site: String(partner?.site || ''),
                    whatsapp: String(partner?.whatsapp || '')
                });
                setEditingId(partner?.id || null);
                try {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } catch (scrollError) {
                    window.scrollTo(0, 0);
                }
            };

            const handleDelete = (id) => {
                const nextPartners = asArray(partners).filter(item => item?.id !== id);
                persistPartners(nextPartners);
                setPartners(nextPartners);
                if (editingId === id) {
                    setEditingId(null);
                    setForm({ ...emptyForm });
                }
                setConfirmDelete(null);
                showToast('🗑️ Fornecedor removido', 'success');
            };

            const openPartner = (partner) => {
                const url = getPartnerLink(partner);
                if (!url) {
                    showToast('⚠️ Contato inválido', 'warning');
                    return;
                }
                window.open(url, '_blank', 'noopener,noreferrer');
            };

            return (
                <div className="animate-fadeIn space-y-4 pb-8">
                    <div className="flex items-center justify-between mb-2">
                        <button onClick={onBack} className="btn-icon text-[#6f8f42]" aria-label="Voltar" type="button">
                            <i data-lucide="arrow-left" className="w-5 h-5"></i>
                        </button>
                        <div className="text-center flex-1">
                            <h2 className="font-usarmy text-[#6f8f42] text-lg">FORNECEDORES</h2>
                            <p className="text-[9px] text-gray-500 tracking-[0.25em]">PARCEIROS E CONTATOS</p>
                        </div>
                        <div className="w-11"></div>
                    </div>

                    <div className="os-card rounded-xl p-4 border border-[#6f8f42]/25">
                        <div className="flex items-center gap-3 mb-4">
                            <div className="w-12 h-12 rounded-full bg-[#6f8f42]/10 border border-[#6f8f42]/30 flex items-center justify-center">
                                <i data-lucide="truck" className="w-6 h-6 text-[#8fb85a]"></i>
                            </div>
                            <div>
                                <p className="font-usarmy text-[#8fb85a] text-sm">CADASTRO DE FORNECEDORES</p>
                                <p className="text-[10px] text-gray-500">Nome + site ou WhatsApp para abrir direto no card</p>
                            </div>
                        </div>

                        <form onSubmit={handleSubmit} action="javascript:void(0)" className="space-y-3">
                            <input type="text" value={form.name} onChange={(e) => setForm(prev => ({ ...prev, name: e.target.value }))} placeholder="Nome do fornecedor" className="w-full p-3 rounded-xl" />
                            <input type="text" value={form.site} onChange={(e) => setForm(prev => ({ ...prev, site: e.target.value }))} placeholder="Site ou link" className="w-full p-3 rounded-xl" />
                            <input type="text" value={form.whatsapp} onChange={(e) => setForm(prev => ({ ...prev, whatsapp: e.target.value }))} placeholder="WhatsApp com DDD" className="w-full p-3 rounded-xl" />
                            <p className="text-[10px] text-gray-500 -mt-1">Se preencher site, o card abre o site. Se preencher só o celular, o card abre no WhatsApp.</p>
                            <div className="grid grid-cols-2 gap-3">
                                <button type="button" onClick={() => { setForm({ ...emptyForm }); setEditingId(null); }} className="p-3 rounded-xl border border-white/10 text-gray-400 font-usarmy text-xs">LIMPAR</button>
                                <button type="submit" className="p-3 rounded-xl text-white font-usarmy text-xs border border-[#8fb85a]/40" style={{ background: 'linear-gradient(135deg, #4e6b2f 0%, #5d7a37 50%, #6f8f42 100%)' }}>{editingId ? 'SALVAR' : 'CADASTRAR'}</button>
                            </div>
                        </form>
                    </div>

                    <div className="os-card rounded-xl p-4 border border-white/5">
                        <div className="flex items-center justify-between mb-3">
                            <p className="font-usarmy text-[#d4af37] text-xs">FORNECEDORES CADASTRADOS</p>
                            <span className="results-count">{partners.length} REGISTROS</span>
                        </div>

                        {partners.length === 0 ? (
                            <div className="text-center py-10">
                                <i data-lucide="clipboard-list" className="w-12 h-12 text-gray-700 mx-auto mb-3"></i>
                                <p className="font-usarmy text-[10px] text-gray-500">NENHUM FORNECEDOR CADASTRADO</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 gap-3">
                                {partners.map(partner => (
                                    <div key={partner.id} className="rounded-xl border border-[#6f8f42]/20 bg-gradient-to-br from-[#17210d] to-slate-950 p-3">
                                        <button type="button" onClick={() => openPartner(partner)} className="w-full text-left">
                                            <div className="flex items-center justify-between gap-3">
                                                <div className="min-w-0">
                                                    <div className="flex items-center gap-2 min-w-0">
                                                        <p className="font-usarmy text-[#8fb85a] text-xs truncate">{partner.name}</p>
                                                        <span className="text-[9px] uppercase tracking-[0.2em] text-[#6f8f42] shrink-0">{getPartnerType(partner)}</span>
                                                    </div>
                                                    <p className="text-[10px] text-gray-400 truncate mt-1">{getPartnerLabel(partner)}</p>
                                                </div>
                                                <div className="w-10 h-10 rounded-full bg-[#6f8f42]/10 border border-[#6f8f42]/30 flex items-center justify-center shrink-0">
                                                    <i data-lucide={getPartnerType(partner) === 'site' ? 'external-link' : 'message-circle'} className="w-4 h-4 text-[#8fb85a]"></i>
                                                </div>
                                            </div>
                                        </button>
                                        <div className="grid grid-cols-2 gap-2 mt-3">
                                            <button type="button" onClick={() => handleEdit(partner)} className="p-2 rounded-lg border border-white/10 text-gray-300 font-usarmy text-[10px]">EDITAR</button>
                                            <button type="button" onClick={() => setConfirmDelete(partner.id)} className="p-2 rounded-lg border border-red-500/20 text-red-400 font-usarmy text-[10px] bg-red-500/5">EXCLUIR</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {confirmDelete && (
                        <div className="modal-overlay" onClick={() => setConfirmDelete(null)}>
                            <div className="modal-content p-6" onClick={e => e.stopPropagation()}>
                                <p className="font-usarmy text-[#d4af37] text-sm mb-2">EXCLUIR FORNECEDOR</p>
                                <p className="text-gray-400 text-sm mb-6">Tem certeza? Esta ação não pode ser desfeita.</p>
                                <div className="grid grid-cols-2 gap-3">
                                    <button type="button" onClick={() => setConfirmDelete(null)} className="p-3 rounded-xl border border-white/10 text-gray-400 font-usarmy text-xs">CANCELAR</button>
                                    <button type="button" onClick={() => handleDelete(confirmDelete)} className="p-3 rounded-xl bg-red-500/20 border border-red-500/30 text-red-400 font-usarmy text-xs">EXCLUIR</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };


        
        const AssistenciaTecnica = ({ onBack }) => {
            const STORAGE_KEY = 'alcantara_assistencias_registros';
            const todayBr = new Date().toLocaleDateString('pt-BR');

            const generateWorkshopProtocol = () => `AA-${new Date().getFullYear()}-${String(Date.now()).slice(-6)}`;

            const formatPhone = (value) => {
                const digits = String(value || '').replace(/\D/g, '').slice(0, 13);
                if (!digits) return '';
                if (digits.length <= 2) return `(${digits}`;
                if (digits.length <= 7) return `(${digits.slice(0,2)}) ${digits.slice(2)}`;
                if (digits.length <= 11) return `(${digits.slice(0,2)}) ${digits.slice(2,7)}-${digits.slice(7)}`;
                return `+${digits.slice(0,2)} (${digits.slice(2,4)}) ${digits.slice(4,9)}-${digits.slice(9)}`;
            };

            const normalizeCnpj = (value) => {
                const digits = String(value || '').replace(/\D/g, '').slice(0, 14);
                if (!digits) return '';
                if (digits.length <= 2) return digits;
                if (digits.length <= 5) return `${digits.slice(0,2)}.${digits.slice(2)}`;
                if (digits.length <= 8) return `${digits.slice(0,2)}.${digits.slice(2,5)}.${digits.slice(5)}`;
                if (digits.length <= 12) return `${digits.slice(0,2)}.${digits.slice(2,5)}.${digits.slice(5,8)}/${digits.slice(8)}`;
                return `${digits.slice(0,2)}.${digits.slice(2,5)}.${digits.slice(5,8)}/${digits.slice(8,12)}-${digits.slice(12)}`;
            };

            const buildEmpty = () => ({
                id: `assist_${Date.now()}`,
                date: todayBr,
                personType: 'PF',
                assistance: '',
                serialNumber: '',
                defectReport: '',
                customerName: '',
                customerEmail: '',
                customerWhatsapp: '',
                deliveredBy: 'CLIENTE',
                workshopProtocol: generateWorkshopProtocol(),
                partnerProtocol: '',
                storeCnpj: '',
                storeName: '',
                isWholesale: false
            });

            const normalizeRecord = (record, index = 0) => {
                if (!record || typeof record !== 'object') return null;
                const personType = record.personType === 'PJ' ? 'PJ' : 'PF';
                const assistance = String(record.assistance || '').trim();
                const serialNumber = String(record.serialNumber || '').trim();
                if (!assistance || !serialNumber) return null;

                return {
                    id: String(record.id || `assist_${Date.now()}_${index}`),
                    date: String(record.date || todayBr),
                    personType,
                    assistance,
                    serialNumber,
                    defectReport: String(record.defectReport || '').trim(),
                    customerName: String(record.customerName || '').trim(),
                    customerEmail: String(record.customerEmail || '').trim(),
                    customerWhatsapp: formatPhone(String(record.customerWhatsapp || '')),
                    deliveredBy: String(record.deliveredBy || 'CLIENTE').toUpperCase(),
                    workshopProtocol: String(record.workshopProtocol || generateWorkshopProtocol()).trim(),
                    partnerProtocol: String(record.partnerProtocol || '').trim(),
                    storeCnpj: normalizeCnpj(record.storeCnpj || ''),
                    storeName: String(record.storeName || '').trim(),
                    isWholesale: !!record.isWholesale,
                    createdAt: record.createdAt || new Date().toISOString()
                };
            };

            const loadRecords = () => {
                try {
                    return asArray(safeJsonParse(SafeStorage.getItem(STORAGE_KEY), []))
                        .map((item, index) => normalizeRecord(item, index))
                        .filter(Boolean)
                        .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
                } catch (error) {
                    console.error('Erro ao carregar assistências:', error);
                    return [];
                }
            };

            const persistRecords = (list) => {
                try {
                    SafeStorage.setItem(STORAGE_KEY, JSON.stringify(asArray(list)));
                    return true;
                } catch (error) {
                    console.error('Erro ao salvar assistências:', error);
                    showToast('⚠️ Erro ao salvar assistência técnica', 'error');
                    return false;
                }
            };

            const [records, setRecords] = useState(loadRecords);
            const [form, setForm] = useState(buildEmpty);
            const [editingId, setEditingId] = useState(null);
            const [confirmDelete, setConfirmDelete] = useState(null);
            const [screen, setScreen] = useState('list');
            const [searchTerm, setSearchTerm] = useState('');

            const resetForm = () => {
                setForm(buildEmpty());
                setEditingId(null);
            };

            const updateForm = (updates) => setForm(prev => ({ ...prev, ...updates }));

            const orderedRecords = useMemo(() => {
                return [...records].sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
            }, [records]);

            const filteredRecords = useMemo(() => {
                const term = String(searchTerm || '').trim().toLowerCase();
                if (!term) return orderedRecords;
                return orderedRecords.filter(record => {
                    const activeProtocol = String(record.partnerProtocol || record.workshopProtocol || '').toLowerCase();
                    return [
                        record.assistance,
                        record.serialNumber,
                        record.defectReport,
                        record.customerName,
                        record.customerEmail,
                        record.customerWhatsapp,
                        record.deliveredBy,
                        record.storeCnpj,
                        record.storeName,
                        activeProtocol,
                        record.personType
                    ].some(value => String(value || '').toLowerCase().includes(term));
                });
            }, [orderedRecords, searchTerm]);

            const openCreate = () => {
                resetForm();
                setScreen('form');
                try {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } catch (error) {
                    window.scrollTo(0, 0);
                }
            };

            const handleSubmit = (e) => {
                e?.preventDefault?.();
                e?.stopPropagation?.();

                try {
                    const personType = form.personType === 'PJ' ? 'PJ' : 'PF';
                    const assistance = String(form.assistance || '').trim();
                    const serialNumber = String(form.serialNumber || '').trim();
                    const workshopProtocol = String(form.workshopProtocol || '').trim() || generateWorkshopProtocol();
                    const partnerProtocol = String(form.partnerProtocol || '').trim();
                    const customerName = String(form.customerName || '').trim();
                    const storeName = String(form.storeName || '').trim();

                    if (!assistance || !serialNumber) {
                        showToast('⚠️ Preencha assistência e número de série', 'warning');
                        return false;
                    }
                    if (personType === 'PF' && !String(form.defectReport || '').trim()) {
                        showToast('⚠️ Informe o defeito relatado', 'warning');
                        return false;
                    }
                    if (personType === 'PJ' && !String(form.storeCnpj || '').trim()) {
                        showToast('⚠️ Informe o CNPJ da loja', 'warning');
                        return false;
                    }

                    const normalized = normalizeRecord({
                        ...form,
                        id: editingId || form.id || `assist_${Date.now()}`,
                        personType,
                        assistance,
                        serialNumber,
                        workshopProtocol,
                        partnerProtocol,
                        customerName,
                        storeName,
                        storeCnpj: normalizeCnpj(form.storeCnpj || ''),
                        createdAt: editingId
                            ? (records.find(item => item.id === editingId)?.createdAt || new Date().toISOString())
                            : new Date().toISOString()
                    });

                    if (!normalized) {
                        showToast('⚠️ Não foi possível salvar a assistência', 'error');
                        return false;
                    }

                    const next = [...records];
                    const index = next.findIndex(item => item.id === normalized.id);
                    if (index >= 0) next[index] = normalized;
                    else next.unshift(normalized);

                    const orderedNext = [...next].sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

                    if (!persistRecords(orderedNext)) return false;

                    setRecords(orderedNext);
                    showToast(editingId ? '✅ Assistência atualizada' : '✅ Assistência cadastrada', 'success');
                    resetForm();
                    setScreen('list');
                    try {
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    } catch (error) {
                        window.scrollTo(0, 0);
                    }
                    return false;
                } catch (error) {
                    console.error('Erro ao cadastrar assistência:', error);
                    showToast('⚠️ Erro ao salvar assistência técnica', 'error');
                    return false;
                }
            };

            const handleEdit = (record) => {
                try {
                    setForm({ ...buildEmpty(), ...record });
                    setEditingId(record.id);
                    setScreen('form');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } catch (error) {
                    console.error('Erro ao editar assistência:', error);
                    showToast('⚠️ Erro ao abrir cadastro para edição', 'error');
                    try { window.scrollTo(0, 0); } catch (_) {}
                }
            };

            const handleDelete = (id) => {
                try {
                    const next = records.filter(item => item.id !== id);
                    if (!persistRecords(next)) return;
                    setRecords(next);
                    if (editingId === id) resetForm();
                    setConfirmDelete(null);
                    showToast('🗑️ Assistência removida', 'success');
                } catch (error) {
                    console.error('Erro ao excluir assistência:', error);
                    showToast('⚠️ Erro ao excluir assistência', 'error');
                }
            };

            return (
                <div className="animate-fadeIn space-y-4 pb-8">
                    <div className="flex items-center justify-between mb-2">
                        <button type="button" onClick={screen === 'form' ? () => { setScreen('list'); resetForm(); } : onBack} className="btn-icon text-[#6f8f42]" aria-label="Voltar">
                            <i data-lucide="arrow-left" className="w-5 h-5"></i>
                        </button>
                        <div className="text-center flex-1">
                            <h2 className="font-usarmy text-[#6f8f42] text-lg">ASSISTÊNCIA TÉCNICA</h2>
                            <p className="text-[9px] text-gray-500 tracking-[0.25em]">{screen === 'form' ? 'CADASTRO DE PROTOCOLO' : 'LISTA DE ASSISTÊNCIAS'}</p>
                        </div>
