    <script>
        // ===== STORAGE BRIDGE V11 CLEAN BACKUP =====
        const SafeStorage = (() => {
            const DB_NAME = 'alcantara_pro_storage_v8';
            const STORE = 'kv';
            const VERSION = 1;
            const MIGRATION_FLAG = '__alcantara_idb_migrated_v8__';
            const memory = {};
            let dbPromise = null;
            let readyResolve;
            const ready = new Promise(resolve => { readyResolve = resolve; });

            const cloneValue = (v) => v === undefined ? null : String(v);
            const keysToMirror = [
                'alcantara_os','alcantara_catalog','alcantara_products','alcantara_bank_transactions','alcantara_bank_fixed',
                'alcantara_bank_budgets','alcantara_bank_cards','alcantara_bank_card_entries','gf_fornecedores','gf_pecas',
                'gf_margem','alcantara_assistencias_registros','alcantara_customer_notes','alcantara_last_bench_os',
                'alcantara_auth','alcantara_equipment_history','alcantara_tech_maintenances'
            ];

            function openDb() {
                if (dbPromise) return dbPromise;
                dbPromise = new Promise((resolve, reject) => {
                    const request = indexedDB.open(DB_NAME, VERSION);
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 'key' });
                    };
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error || new Error('Falha ao abrir IndexedDB'));
                });
                return dbPromise;
            }

            async function idbSetItem(key, value) {
                const db = await openDb();
                return new Promise((resolve, reject) => {
                    const tr = db.transaction(STORE, 'readwrite');
                    const st = tr.objectStore(STORE);
                    const req = st.put({ key, value: cloneValue(value), updatedAt: Date.now() });
                    req.onsuccess = () => resolve(true);
                    req.onerror = () => reject(req.error);
                });
            }

            async function idbRemoveItem(key) {
                const db = await openDb();
                return new Promise((resolve, reject) => {
                    const tr = db.transaction(STORE, 'readwrite');
                    const st = tr.objectStore(STORE);
                    const req = st.delete(key);
                    req.onsuccess = () => resolve(true);
                    req.onerror = () => reject(req.error);
                });
            }

            async function bootstrap() {
                if (!('indexedDB' in window)) {
                    console.warn('IndexedDB indisponível; usando localStorage padrão.');
                    readyResolve();
                    return;
                }
                try {
                    const db = await openDb();
                    const rows = await new Promise((resolve, reject) => {
                        const tr = db.transaction(STORE, 'readonly');
                        const st = tr.objectStore(STORE);
                        const req = st.getAll();
                        req.onsuccess = () => resolve(req.result || []);
                        req.onerror = () => reject(req.error);
                    });

                    rows.forEach(row => {
                        if (!row || !row.key) return;
                        memory[row.key] = cloneValue(row.value);
                        if (row.value !== null && row.value !== undefined) {
                            try { localStorage.setItem(row.key, cloneValue(row.value)); } catch (_) {}
                        }
                    });

                    const alreadyMigrated = localStorage.getItem(MIGRATION_FLAG) === 'true' || memory[MIGRATION_FLAG] === 'true';
                    if (!alreadyMigrated) {
                        const pending = [];
                        for (let i = 0; i < localStorage.length; i++) {
                            const key = localStorage.key(i);
                            if (!key) continue;
                            if (!keysToMirror.includes(key) && !key.startsWith('alcantara_') && !key.startsWith('gf_')) continue;
                            const value = localStorage.getItem(key);
                            memory[key] = cloneValue(value);
                            pending.push(idbSetItem(key, value));
                        }
                        pending.push(idbSetItem(MIGRATION_FLAG, 'true'));
                        memory[MIGRATION_FLAG] = 'true';
                        await Promise.allSettled(pending);
                        try { localStorage.setItem(MIGRATION_FLAG, 'true'); } catch (_) {}
                    }
                } catch (error) {
                    console.warn('Falha no bootstrap do IndexedDB:', error);
                } finally {
                    readyResolve();
                    window.dispatchEvent(new CustomEvent('alcantara-storage-ready'));
                }
            }

            bootstrap();

            return {
                ready,
                getItem(key) {
                    if (Object.prototype.hasOwnProperty.call(memory, key)) return memory[key];
                    const raw = localStorage.getItem(key);
                    if (raw !== null && raw !== undefined) memory[key] = cloneValue(raw);
                    return raw;
                },
                setItem(key, value) {
                    const normalized = cloneValue(value);
                    memory[key] = normalized;
                    localStorage.setItem(key, normalized);
                    if ('indexedDB' in window) idbSetItem(key, normalized).catch(err => console.warn('Falha ao persistir no IndexedDB:', err));
                },
                removeItem(key) {
                    delete memory[key];
                    localStorage.removeItem(key);
                    if ('indexedDB' in window) idbRemoveItem(key).catch(err => console.warn('Falha ao remover do IndexedDB:', err));
                },
                async exportAll() {
                    const db = await openDb();
                    return new Promise((resolve, reject) => {
                        const tr = db.transaction(STORE, 'readonly');
                        const st = tr.objectStore(STORE);
                        const req = st.getAll();
                        req.onsuccess = () => resolve(req.result || []);
                        req.onerror = () => reject(req.error);
                    });
                },
                async estimateUsage() {
                    let localBytes = 0;
                    try {
                        for (let i = 0; i < localStorage.length; i++) {
                            const key = localStorage.key(i);
                            const val = localStorage.getItem(key) || '';
                            localBytes += (String(key).length + String(val).length) * 2;
                        }
                    } catch (_) {}
                    let idbBytes = 0;
                    let rows = [];
                    try {
                        rows = await this.exportAll();
                        rows.forEach(row => {
                            const key = String(row?.key || '');
                            const val = String(row?.value || '');
                            idbBytes += (key.length + val.length) * 2;
                        });
                    } catch (_) {}
                    let quota = 0, usage = 0;
                    try {
                        if (navigator.storage && navigator.storage.estimate) {
                            const est = await navigator.storage.estimate();
                            quota = Number(est?.quota || 0);
                            usage = Number(est?.usage || 0);
                        }
                    } catch (_) {}
                    return { localBytes, idbBytes, quota, usage, rows: rows.length };
                },
                async compactData() {
                    const keys = [
                        'alcantara_bank_transactions','alcantara_bank_fixed','alcantara_bank_cards','alcantara_bank_card_entries',
                        'alcantara_bank_budgets','alcantara_os','alcantara_catalog','alcantara_products',
                        'gf_fornecedores','gf_pecas','alcantara_assistencias_registros','alcantara_customer_notes',
                        'alcantara_equipment_history','alcantara_tech_maintenances'
                    ];
                    let cleaned = 0;
                    for (const key of keys) {
                        const raw = this.getItem(key);
                        if (raw === null || raw === undefined || raw === '') continue;
                        try {
                            const parsed = JSON.parse(raw);
                            if (Array.isArray(parsed)) {
                                const compacted = parsed.filter(Boolean);
                                this.setItem(key, JSON.stringify(compacted));
                                cleaned += Math.max(0, parsed.length - compacted.length);
                            } else if (parsed && typeof parsed === 'object') {
                                this.setItem(key, JSON.stringify(parsed));
                            }
                        } catch (_) {}
                    }
                    return { cleaned };
                },
                async restoreRows(rows) {
                    if (!Array.isArray(rows)) throw new Error('Backup inválido');
                    for (const row of rows) {
                        if (!row || !row.key) continue;
                        this.setItem(String(row.key), cloneValue(row.value));
                    }
                    return true;
                }
            };
        })();
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useMemo } = React;

        const safeJsonParse = (rawValue, fallbackValue) => {
            if (rawValue === null || rawValue === undefined || rawValue === '') return fallbackValue;
            try {
                return JSON.parse(rawValue);
            } catch (error) {
                console.warn('Falha ao ler JSON do localStorage:', error);
                return fallbackValue;
            }
        };
        const formatBytes = (bytes = 0) => {
            const value = Number(bytes || 0);
            if (!value) return '0 B';
            const units = ['B','KB','MB','GB'];
            let i = 0;
            let out = value;
            while (out >= 1024 && i < units.length - 1) { out /= 1024; i += 1; }
            return `${out.toFixed(out >= 10 || i === 0 ? 0 : 1)} ${units[i]}`;
        };

        const downloadJsonFile = (filename, payload) => {
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1200);
        };

        const APP_BACKUP_KEYS = [
            'alcantara_os','alcantara_catalog','alcantara_products','alcantara_bank_transactions','alcantara_bank_fixed',
            'alcantara_bank_budgets','alcantara_bank_cards','alcantara_bank_card_entries','gf_fornecedores','gf_pecas',
            'gf_margem','alcantara_assistencias_registros','alcantara_customer_notes','alcantara_last_bench_os',
            'alcantara_auth','alcantara_equipment_history','alcantara_tech_maintenances'
        ];

        const buildFullAppBackup = async () => {
            const indexedRows = await SafeStorage.exportAll().catch(() => []);
            const localSnapshot = {};
            try {
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (!key) continue;
                    if (APP_BACKUP_KEYS.includes(key) || key.startsWith('alcantara_') || key.startsWith('gf_') || key.startsWith('__alcantara_')) {
                        localSnapshot[key] = localStorage.getItem(key);
                    }
                }
            } catch (_) {}
            return {
                version: 'V12 UNIFICADO',
                exportedAt: new Date().toISOString(),
                app: 'Alcantara Armeiro',
                mode: 'full_system_backup',
                localSnapshot,
                indexedRows,
                meta: {
                    totalLocalKeys: Object.keys(localSnapshot).length,
                    totalIndexedRows: Array.isArray(indexedRows) ? indexedRows.length : 0
                }
            };
        };

        const shareJsonFile = async (filename, payload, shareText = 'Backup do app') => {
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const file = new File([blob], filename, { type: 'application/json' });
            if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({
                    files: [file],
                    title: 'Backup Alcantara Armeiro',
                    text: shareText
                });
                return true;
            }
            downloadJsonFile(filename, payload);
            return false;
        };


        const isoToday = () => new Date().toISOString().slice(0,10);
        const isIsoDate = (value) => /^\d{4}-\d{2}-\d{2}$/.test(String(value || ''));
        const asArray = (value) => Array.isArray(value) ? value : [];
        const normalizeBankDate = (value, fallback = isoToday()) => {
            const raw = String(value || '').trim();
            if (!raw) return fallback;
            if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) {
                const probe = new Date(`${raw}T12:00:00`);
                return Number.isNaN(probe.getTime()) ? fallback : raw;
            }
            const br = raw.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
            if (br) {
                const iso = `${br[3]}-${br[2]}-${br[1]}`;
                const probe = new Date(`${iso}T12:00:00`);
                return Number.isNaN(probe.getTime()) ? fallback : iso;
            }
            const probe = new Date(raw);
            if (!Number.isNaN(probe.getTime())) return probe.toISOString().slice(0,10);
            return fallback;
        };
        const normalizeBankTransaction = (item, fallbackIndex = 0) => {
            if (!item || typeof item !== 'object') return null;
            return {
                ...item,
                id: String(item.id || `bank_tx_${Date.now()}_${fallbackIndex}`),
                area: item.area === 'pessoal' ? 'pessoal' : 'oficina',
                type: item.type === 'saida' ? 'saida' : 'entrada',
                category: String(item.category || (item.type === 'saida' ? 'Outros' : 'Serviço')).trim() || (item.type === 'saida' ? 'Outros' : 'Serviço'),
                description: String(item.description || '').trim(),
                value: Number(item.value || 0),
                date: normalizeBankDate(item.date),
                paymentDate: item.paymentDate ? normalizeBankDate(item.paymentDate, normalizeBankDate(item.date)) : item.paymentDate,
                sourceOrderDate: item.sourceOrderDate ? normalizeBankDate(item.sourceOrderDate, normalizeBankDate(item.date)) : item.sourceOrderDate,
                obs: String(item.obs || '').trim()
            };
        };
        const normalizeBankTransactions = (value) => asArray(value)
            .map((item, index) => normalizeBankTransaction(item, index))
            .filter(item => item && item.description && Number(item.value || 0) > 0);
        const normalizeDayValue = (value) => {
            const raw = parseInt(value, 10);
            return Number.isInteger(raw) && raw >= 1 && raw <= 31 ? raw : '';
        };
        const normalizeCardEntry = (item, fallbackIndex = 0) => {
            if (!item || typeof item !== 'object') return null;
            const installmentCount = Math.max(parseInt(item.installmentCount || 1, 10) || 1, 1);
            const installmentIndex = Math.min(Math.max(parseInt(item.installmentIndex || 1, 10) || 1, 1), installmentCount);
            const date = normalizeBankDate(item.date);
            const purchaseDate = item.purchaseDate ? normalizeBankDate(item.purchaseDate, date) : date;
            return {
                ...item,
                id: String(item.id || `card_entry_${Date.now()}_${fallbackIndex}`),
                cardId: String(item.cardId || '').trim(),
                area: item.area === 'oficina' ? 'oficina' : 'pessoal',
                category: String(item.category || 'Outros').trim() || 'Outros',
                description: String(item.description || '').trim(),
                value: Number(item.value || 0),
                totalPurchaseValue: Number(item.totalPurchaseValue || item.value || 0),
                date,
                purchaseDate,
                invoiceMonth: /^\d{4}-\d{2}$/.test(String(item.invoiceMonth || '')) ? String(item.invoiceMonth) : '',
                isInstallment: installmentCount > 1 || item.isInstallment === true,
                installmentCount,
                installmentIndex,
                installmentValue: Number(item.installmentValue || item.value || 0),
                installmentGroupId: String(item.installmentGroupId || '').trim(),
                isRecurring: item.isRecurring === true,
                recurringGroupId: String(item.recurringGroupId || '').trim(),
                recurringIndex: Math.max(parseInt(item.recurringIndex || 1, 10) || 1, 1),
                recurringActive: item.recurringActive !== false,
                recurrenceMonths: Math.max(parseInt(item.recurrenceMonths || 72, 10) || 72, 1),
                obs: String(item.obs || '').trim()
            };
        };
        const normalizeCardEntries = (value) => asArray(value)
            .map((item, index) => normalizeCardEntry(item, index))
            .filter(item => item && item.cardId && item.description && Number(item.value || 0) > 0);
        const normalizeCard = (item, fallbackIndex = 0) => {
            if (!item || typeof item !== 'object') return null;
            const name = String(item.name || '').trim();
            const dueDay = normalizeDayValue(item.dueDay);
            const closingDay = normalizeDayValue(item.closingDay || dueDay);
            const bestPurchaseDay = normalizeDayValue(item.bestPurchaseDay || (closingDay ? (Number(closingDay) === 31 ? 1 : Number(closingDay) + 1) : ''));
            return name ? {
                ...item,
                id: String(item.id || `card_${Date.now()}_${fallbackIndex}`),
                name,
                brand: String(item.brand || '').trim(),
                final: String(item.final || '').replace(/\D/g, '').slice(-4),
                limit: Number(item.limit || 0) > 0 ? Number(item.limit) : '',
                dueDay,
                closingDay,
                bestPurchaseDay,
                createdAt: item.createdAt || new Date().toISOString()
            } : null;
        };
        const normalizeCards = (value) => asArray(value)
            .map((item, index) => normalizeCard(item, index))
            .filter(Boolean);
        const normalizeBudgets = (value) => ({
            personal: Number(value?.personal) > 0 ? Number(value.personal) : 2500,
            workshop: Number(value?.workshop) > 0 ? Number(value.workshop) : 1200
        });
        const normalizeFixedBill = (bill, fallbackIndex = 0) => {
            if (!bill || typeof bill !== 'object') return null;
            const rawDate = isIsoDate(bill.date) ? bill.date : isoToday();
            const parsedDay = parseInt(bill.day ?? rawDate.slice(8,10), 10);
            const safeDay = Number.isInteger(parsedDay) && parsedDay >= 1 && parsedDay <= 31
                ? parsedDay
                : parseInt(rawDate.slice(8,10), 10);
            const name = String(bill.name || '').trim();
            const value = Number(bill.value || 0);
            if (!name || value <= 0) return null;
            return {
                ...bill,
                id: String(bill.id || `fixed_${Date.now()}_${fallbackIndex}`),
                name,
                value,
                date: isIsoDate(bill.date) ? bill.date : `${rawDate.slice(0,7)}-${String(safeDay).padStart(2,'0')}`,
                day: safeDay,
                area: bill.area === 'pessoal' ? 'pessoal' : 'oficina',
                active: bill.active !== false,
                paidMonths: Array.isArray(bill.paidMonths)
                    ? [...new Set(bill.paidMonths.filter(m => /^\d{4}-\d{2}$/.test(String(m))))]
                    : []
            };
        };
        const normalizeFixedBills = (value) => asArray(value)
            .map((bill, index) => normalizeFixedBill(bill, index))
            .filter(Boolean);

        // ========== DB CONTEXT (estado global reativo) ==========
        const DbContext = React.createContext(null);

        const dbReducer = (state, action) => {
            let orders, products, catalog;
            switch (action.type) {
                case 'LOAD':
                    return {
                        orders:   asArray(safeJsonParse(SafeStorage.getItem('alcantara_os'), [])),
                        catalog:  asArray(safeJsonParse(SafeStorage.getItem('alcantara_catalog'), [])),
                        products: asArray(safeJsonParse(SafeStorage.getItem('alcantara_products'), [])),
                    };
                case 'SAVE_ORDER':
                    orders = [...state.orders];
                    const idx = orders.findIndex(o => o.id === action.order.id);
                    if (idx !== -1) orders[idx] = action.order; else orders.unshift(action.order);
                    SafeStorage.setItem('alcantara_os', JSON.stringify(orders));
                    return { ...state, orders };
                case 'DELETE_ORDER':
                    orders = state.orders.filter(o => o.id !== action.id);
                    SafeStorage.setItem('alcantara_os', JSON.stringify(orders));
                    return { ...state, orders };
                case 'SAVE_CATALOG_ITEM':
                    catalog = [...state.catalog];
                    const exists = catalog.find(c =>
                        c.name.toLowerCase() === action.item.name.toLowerCase() && c.type === action.item.type);
                    if (!exists) {
                        catalog.push({ ...action.item, id: Date.now().toString() });
                        SafeStorage.setItem('alcantara_catalog', JSON.stringify(catalog));
                        return { ...state, catalog };
                    }
                    return state;
                case 'DELETE_CATALOG_ITEM':
                    catalog = state.catalog.filter(i => i.id !== action.id);
                    SafeStorage.setItem('alcantara_catalog', JSON.stringify(catalog));
                    return { ...state, catalog };
                case 'UPDATE_CATALOG_ITEM': {
                    const previousItem = state.catalog.find(i => i.id === action.item.id) || null;
                    catalog = state.catalog.map(i => i.id === action.item.id ? action.item : i);

                    const normalizeItemName = (value) => String(value || '')
                        .normalize('NFD')
                        .replace(/[̀-ͯ]/g, '')
                        .trim()
                        .toUpperCase();

                    const syncOrderItems = (items, expectedType) => asArray(items).map(entry => {
                        const matchesByCatalogId = String(entry?.catalogId || '') === String(action.item.id || '');
                        const matchesByLegacyName = previousItem
                            && expectedType === action.item.type
                            && !entry?.catalogId
                            && normalizeItemName(entry?.name) === normalizeItemName(previousItem?.name);

                        if (!matchesByCatalogId && !matchesByLegacyName) return entry;

                        const quantity = Math.max(1, parseInt(entry?.quantity, 10) || 1);
                        const unitPrice = parseFloat(action.item.price) || 0;
                        return {
                            ...entry,
                            name: action.item.name,
                            type: action.item.type,
                            catalogId: action.item.id,
                            unitPrice,
                            price: unitPrice * quantity
                        };
                    });

                    orders = state.orders.map(order => ({
                        ...order,
                        services: syncOrderItems(order.services, 'service'),
                        parts: syncOrderItems(order.parts, 'part'),
                        products: syncOrderItems(order.products, 'product')
                    }));

                    SafeStorage.setItem('alcantara_catalog', JSON.stringify(catalog));
                    SafeStorage.setItem('alcantara_os', JSON.stringify(orders));
                    return { ...state, catalog, orders };
                }
                case 'SAVE_PRODUCT':
                    products = [...state.products];
                    const pExists = products.find(p => p.name.toLowerCase() === action.product.name.toLowerCase());
                    if (!pExists) {
                        products.push({ ...action.product, id: Date.now().toString(),
                            stock: parseInt(action.product.stock) || 0,
                            price: parseFloat(action.product.price) || 0,
                            costPrice: parseFloat(action.product.costPrice || action.product.purchasePrice || 0) || 0 });
                        SafeStorage.setItem('alcantara_products', JSON.stringify(products));
                        return { ...state, products };
                    }
                    return state;
                case 'UPDATE_PRODUCT':
                    products = state.products.map(p => p.id === action.product.id
                        ? { ...action.product, stock: parseInt(action.product.stock)||0, price: parseFloat(action.product.price)||0 }
                        : p);
                    SafeStorage.setItem('alcantara_products', JSON.stringify(products));
                    return { ...state, products };
                case 'DELETE_PRODUCT':
                    products = state.products.filter(p => p.id !== action.id);
                    SafeStorage.setItem('alcantara_products', JSON.stringify(products));
                    return { ...state, products };
                case 'RESERVE_STOCK': {
                    products = [...state.products];
                    const pi = products.findIndex(p => p.id === action.productId);
                    if (pi === -1) return state;
                    const cur = parseInt(products[pi].stock) || 0;
                    if (cur < action.qty) return state;
                    products[pi] = { ...products[pi], stock: cur - action.qty };
                    SafeStorage.setItem('alcantara_products', JSON.stringify(products));
                    return { ...state, products };
                }
                case 'RELEASE_STOCK': {
                    products = [...state.products];
                    const ri = products.findIndex(p => p.id === action.productId);
                    if (ri === -1) return state;
                    products[ri] = { ...products[ri], stock: (parseInt(products[ri].stock)||0) + action.qty };
                    SafeStorage.setItem('alcantara_products', JSON.stringify(products));
                    return { ...state, products };
                }
                default:
                    return state;
            }
        };

        const DbProvider = ({ children }) => {
            const [state, dispatch] = React.useReducer(dbReducer, null, () => ({
                orders:   asArray(safeJsonParse(SafeStorage.getItem('alcantara_os'), [])),
                catalog:  asArray(safeJsonParse(SafeStorage.getItem('alcantara_catalog'), [])),
                products: asArray(safeJsonParse(SafeStorage.getItem('alcantara_products'), [])),
            }));
            return (
                <DbContext.Provider value={{ state, dispatch }}>
                    {children}
                </DbContext.Provider>
            );
        };

        const useDb = () => React.useContext(DbContext);


        // ========== MÁSCARA DE TELEFONE ==========
        const formatPhone = (v) => {
            const d = v.replace(/\D/g, '').slice(0, 11);
            if (d.length <= 2) return d;
            if (d.length <= 6) return `(${d.slice(0,2)}) ${d.slice(2)}`;
            if (d.length <= 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
            return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
        };

        const PhoneInput = ({ value, onChange, placeholder = "WhatsApp", className = "" }) => (
            <input
                type="tel"
                inputMode="numeric"
                className={className}
                placeholder={placeholder}
                value={value}
                onChange={e => onChange(formatPhone(e.target.value))}
                maxLength={15}
                aria-label={placeholder}
            />
        );


        // ========== MODAL DE CONFIRMAÇÃO (substitui confirm() nativo) ==========
        const ConfirmModal = ({ message, subMessage, onConfirm, onCancel, confirmLabel = "CONFIRMAR", confirmClass = "gold-gradient", icon = "alert-triangle" }) => (
            <div className="modal-overlay" onClick={onCancel} role="dialog" aria-modal="true" aria-label="Confirmação">
                <div className="modal-content p-6" onClick={e => e.stopPropagation()}>
                    <div className="flex flex-col items-center text-center gap-4 mb-6">
                        <div className="w-16 h-16 rounded-full border border-yellow-500/30 flex items-center justify-center overflow-hidden">
                            <img src={LOGO_URL} className="w-full h-full object-cover logo-premium-animated" />
                        </div>
                        <div>
                            <p className="font-usarmy text-white text-sm mb-1">{message}</p>
                            {subMessage && <p className="text-gray-500 text-xs">{subMessage}</p>}
                        </div>
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                        <button onClick={onCancel}
                            className="p-4 rounded-xl border-2 border-white/10 text-gray-400 font-usarmy text-xs">
                            CANCELAR
                        </button>
                        <button onClick={onConfirm}
                            className={`p-4 rounded-xl font-usarmy text-xs ${confirmClass}`}>
                            {confirmLabel}
                        </button>
                    </div>
                </div>
            </div>
        );

        const useConfirm = () => {
            const [cfg, setCfg] = useState(null);
            const confirm = useCallback((opts) => new Promise(resolve => {
                setCfg({ ...opts, resolve });
            }), []);
            const modal = cfg ? (
                <ConfirmModal
                    {...cfg}
                    onConfirm={() => { cfg.resolve(true);  setCfg(null); }}
                    onCancel={() =>  { cfg.resolve(false); setCfg(null); }}
                />
            ) : null;
            return { confirm, modal };
        };


        // ========== LISTA VIRTUALIZADA (paginação incremental) ==========
        const PAGE_SIZE = 20;
        const VirtualOrderList = ({ items, onSelect }) => {
            const [page, setPage] = useState(1);
            const visible = useMemo(() => items.slice(0, page * PAGE_SIZE), [items, page]);
            const hasMore = visible.length < items.length;

            const loaderRef = useRef(null);
            useEffect(() => {
                if (!loaderRef.current || !hasMore) return;
                const obs = new IntersectionObserver(entries => {
                    if (entries[0].isIntersecting) setPage(p => p + 1);
                }, { threshold: 0.1 });
                obs.observe(loaderRef.current);
                return () => obs.disconnect();
            }, [hasMore]);

            // reset page when items change (filter/search)
            useEffect(() => setPage(1), [items]);

            return (
                <>
                    {visible.map(o => {
                        const statusConfig = STATUS_CONFIG[o.status] || STATUS_CONFIG.ABERTA;
                        return (
                            <div
                                key={o.id}
                                onClick={() => onSelect(o)}
                                className="os-card p-4 rounded-xl cursor-pointer transition-all hover:scale-[1.01] active:scale-[0.99]"
                                role="button"
                                tabIndex={0}
                                onKeyDown={e => e.key === 'Enter' && onSelect(o)}
                                aria-label={`OS #${o.osNumber} - ${o.customerName}`}
                            >
                                <div className="flex justify-between items-start mb-2">
                                    <div className="flex-1 min-w-0 mr-3">
                                        <p className="text-[8px] text-gray-600 font-mono mb-1">OS #{o.osNumber}</p>
                                        <p className="font-bold text-white text-sm truncate">{o.customerName}</p>
                                        <p className="text-xs text-gray-500 truncate mt-1">{o.equipment}</p>
                                    </div>
                                    <div className="text-right flex-shrink-0">
                                        <p className="font-usarmy text-[#d4af37] text-base">R$ {calculateTotal(o).toFixed(2)}</p>
                                        <p className="text-[9px] text-gray-600 mt-1">{o.date}</p>
                                    </div>
                                </div>

        const normalizeOperationalStatus = (value) => {
            const raw = String(value || 'ENTRADA')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .trim()
                .toUpperCase()
                .replace(/\s+/g, '_');

            const exact = OPERATIONAL_STAGES.find(stage => stage.key === raw);
            if (exact) return exact.key;

            const byLabel = OPERATIONAL_STAGES.find(stage =>
                stage.label
                    .normalize('NFD')
                    .replace(/[\u0300-\u036f]/g, '')
                    .trim()
                    .toUpperCase()
                    .replace(/\s+/g, '_') === raw
            );

            return byLabel ? byLabel.key : 'ENTRADA';

        const db = {

                const orders = db.getOrders();
                const idx = orders.findIndex(o => o.id === order.id);

                );

                    products.push({

                        id: Date.now().toString(),
                        stock: parseInt(product.stock) || 0,
                        price: parseFloat(product.price) || 0
                    });
                    SafeStorage.setItem('alcantara_products', JSON.stringify(products));

            updateProduct: (updatedProduct) => {

                const idx = products.findIndex(p => p.id === updatedProduct.id);

                        ...updatedProduct,
                        stock: parseInt(updatedProduct.stock) || 0,
                        price: parseFloat(updatedProduct.price) || 0,
                        costPrice: parseFloat(updatedProduct.costPrice || updatedProduct.purchasePrice || 0) || 0
                    };
                    SafeStorage.setItem('alcantara_products', JSON.stringify(products));
                }
            },
            checkAndReserveStock: (productId, requestedQuantity) => {
                const products = db.getProducts();
                const idx = products.findIndex(p => p.id === productId);
                if (idx === -1) return { success: false, error: 'Produto não encontrado' };

                const currentStock = parseInt(products[idx].stock) || 0;
                if (currentStock < requestedQuantity) {
                    return { 
                        success: false, 
                        error: `Estoque insuficiente. Disponível: ${currentStock}, Solicitado: ${requestedQuantity}`,
                        available: currentStock
                    };
                }

                products[idx].stock = currentStock - requestedQuantity;
                SafeStorage.setItem('alcantara_products', JSON.stringify(products));
                return { success: true, newStock: products[idx].stock };
            },
            releaseStock: (productId, quantity) => {
                const products = db.getProducts();
                const idx = products.findIndex(p => p.id === productId);
                if (idx !== -1) {
                    products[idx].stock = (parseInt(products[idx].stock) || 0) + quantity;
                    SafeStorage.setItem('alcantara_products', JSON.stringify(products));
                    return products[idx].stock;
                }
                return null;

            updateStock: (productId, quantity) => {
                const products = db.getProducts();
                const idx = products.findIndex(p => p.id === productId);
                if (idx !== -1) {
                    products[idx].stock = parseInt(products[idx].stock || 0) + quantity;
                    if (products[idx].stock < 0) products[idx].stock = 0;
                    SafeStorage.setItem('alcantara_products', JSON.stringify(products));
                    return products[idx].stock;
                }
                return null;
            },

        const showToast = (message, type = 'info') => {

        // ========== FUNÇÕES DE CÁLCULO ==========
        const calculateSubtotal = (order) => {
            const servicesTotal = order.services?.reduce((acc, s) => acc + (parseFloat(s.price) || 0), 0) || 0;
            const partsTotal = order.parts?.reduce((acc, p) => acc + (parseFloat(p.price) || 0), 0) || 0;
            const productsTotal = order.products?.reduce((acc, p) => acc + (parseFloat(p.price) || 0), 0) || 0;
            return servicesTotal + partsTotal + productsTotal;
        };

        const calculateDiscount = (order) => {
            const subtotal = calculateSubtotal(order);
            const discountType = order.discountType || 'none';
            const discountValue = parseFloat(order.discountValue) || 0;

            if (discountType === 'percentage') {
                return Math.min((subtotal * discountValue) / 100, subtotal);
            } else if (discountType === 'fixed') {
                return Math.min(discountValue, subtotal);
            }
            return 0;
        };

        const calculateTotal = (order) => {
            const subtotal = calculateSubtotal(order);
            const discount = calculateDiscount(order);
            return Math.max(0, subtotal - discount);
        };

        const calculateAdvancePayment = (order) => {
            const enabled = order?.hasAdvancePayment === true || Number(order?.advancePaymentValue || 0) > 0;
            if (!enabled) return 0;
            const total = calculateTotal(order || {});
            const advance = parseFloat(order?.advancePaymentValue) || 0;
            return Math.min(Math.max(0, advance), total);
        };

        const calculateRemainingPayment = (order) => {
            const total = calculateTotal(order || {});
            const advance = calculateAdvancePayment(order || {});
            return Math.max(0, total - advance);
        };

        const getItemCostTotal = (item) => {
            const quantity = Math.max(1, parseInt(item?.quantity, 10) || 1);
            if (item?.costTotal !== undefined) return parseFloat(item.costTotal) || 0;
            if (item?.costUnitPrice !== undefined) return (parseFloat(item.costUnitPrice) || 0) * quantity;
            if (item?.costPrice !== undefined) {
                const rawCost = parseFloat(item.costPrice) || 0;
                const sale = parseFloat(item.price) || 0;
                return rawCost > sale && quantity > 1 ? rawCost : rawCost * quantity;
            }
            return 0;
        };

        const getItemProfitTotal = (item) => {
            if (item?.profitTotal !== undefined) return parseFloat(item.profitTotal) || 0;
            const sale = parseFloat(item?.price) || 0;
            const cost = getItemCostTotal(item);
            return Math.max(0, sale - cost);
        };

        const calculatePartsProductsCost = (order) => (
            [...asArray(order?.parts), ...asArray(order?.products)]
                .reduce((acc, item) => acc + getItemCostTotal(item), 0)
        );

        const calculatePartsProductsProfit = (order) => (
            [...asArray(order?.parts), ...asArray(order?.products)]
                .reduce((acc, item) => acc + getItemProfitTotal(item), 0)
        );

        const calculateOrderRealProfit = (order) => {
            const servicesProfit = asArray(order?.services).reduce((acc, item) => acc + (parseFloat(item.price) || 0), 0);
            return servicesProfit + calculatePartsProductsProfit(order);
        };

        const calculateOrderRealMargin = (order) => {
            const total = calculateTotal(order || {});
            if (!total) return 0;
            return (calculateOrderRealProfit(order) / total) * 100;
        };

        const PAYMENT_METHOD_OPTIONS = [

        ];

        const getPaymentMethodLabel = (method) => {
            if (method === 'PIX') return 'Pix';
            if (method === 'DINHEIRO') return 'Dinheiro';
            if (method === 'CARTAO_CREDITO') return 'Cartão de crédito';
            return 'Não informado';
        };

        const getInstallmentCount = (order) => {
            const parsed = parseInt(order?.paymentInstallments, 10);
            return Number.isInteger(parsed) && parsed > 0 ? parsed : 1;
        };

        const getInstallmentAmount = (order) => {
            const total = calculateTotal(order || {});
            const installments = getInstallmentCount(order);
            return installments > 0 ? total / installments : total;
        };

        const getPaymentSummaryText = (order) => {

                return `Pagamento: Cartão de crédito • ${installments}x de R$ ${installmentAmount.toFixed(2)} (${label})`;

        const CUSTOMER_NOTES_KEY = 'alcantara_customer_notes';

        const parsePtBrDate = (value) => {
            const raw = String(value || '').trim();
            const match = raw.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
            if (!match) return 0;
            const [, day, month, year] = match;
            return new Date(`${year}-${month}-${day}T12:00:00`).getTime() || 0;
        };

        const getCustomerNotesMap = () => {

        const saveCustomerNote = (customerName, note) => {
            const key = normalizeCustomerKey(customerName);
            if (!key) return;
            const notesMap = getCustomerNotesMap();
            const cleaned = String(note || '').trim();
            if (cleaned) notesMap[key] = cleaned;
            else delete notesMap[key];
            SafeStorage.setItem(CUSTOMER_NOTES_KEY, JSON.stringify(notesMap));
        };

        const getCustomerHistorySnapshot = (orders, customerName, currentOrderId = null) => {
            const key = normalizeCustomerKey(customerName);
            const notesMap = getCustomerNotesMap();
            const emptyState = {
                hasHistory: false,
                totalOrders: 0,
                pendingOrders: 0,
                averageTicket: 0,
                totalPaid: 0,
                lastEquipment: '',
                lastDefect: '',
                lastOrderLabel: '',
                internalNote: notesMap[key] || '',
                lastOrders: []
            };

            if (!key) return emptyState;

            const relatedOrders = asArray(orders)
                .filter(order => order && order.id !== currentOrderId && normalizeCustomerKey(order.customerName) === key)
                .sort((a, b) => {
                    const diff = parsePtBrDate(b.date) - parsePtBrDate(a.date);
                    if (diff !== 0) return diff;
                    const osA = parseInt(String(a.osNumber || '0').replace(/\D/g, ''), 10) || 0;
                    const osB = parseInt(String(b.osNumber || '0').replace(/\D/g, ''), 10) || 0;
                    return osB - osA;
                });

            if (!relatedOrders.length) return emptyState;

            const totalPaid = relatedOrders.reduce((sum, order) => (
                order.paymentStatus === 'PAGO' ? sum + calculateTotal(order) : sum
            ), 0);

            const averageTicket = relatedOrders.reduce((sum, order) => sum + calculateTotal(order), 0) / relatedOrders.length;
            const pendingOrders = relatedOrders.filter(order => {
                const stage = normalizeOperationalStatus(order.operationalStatus || 'ENTRADA');
                return order.status !== 'CANCELADA' && stage !== 'ENTREGUE';
            }).length;

            const latest = relatedOrders[0];

            return {
                hasHistory: true,
                totalOrders: relatedOrders.length,
                pendingOrders,
                averageTicket,
                totalPaid,
                lastEquipment: latest?.equipment || '',
                lastDefect: latest?.defects || '',
                lastOrderLabel: latest ? `OS #${latest.osNumber || '-'} • ${latest.date || '-'}` : '',
                internalNote: notesMap[key] || '',

            };
        };

        const getLatestCustomerOrder = (orders, customerName, currentOrderId = null) => {
            const key = normalizeCustomerKey(customerName);
            if (!key) return null;

            const relatedOrders = asArray(orders)
                .filter(order => order && order.id !== currentOrderId && normalizeCustomerKey(order.customerName) === key)
                .sort((a, b) => {
                    const diff = parsePtBrDate(b.date) - parsePtBrDate(a.date);
                    if (diff !== 0) return diff;
                    const osA = parseInt(String(a.osNumber || '0').replace(/\D/g, ''), 10) || 0;
                    const osB = parseInt(String(b.osNumber || '0').replace(/\D/g, ''), 10) || 0;
                    return osB - osA;
                });

            return relatedOrders[0] || null;
        };

        const getCustomerOperationalProfile = (orders, customerName, currentOrderId = null) => {
            const key = normalizeCustomerKey(customerName);
            if (!key) return null;

            const relatedOrders = asArray(orders)
                .filter(order => order && order.id !== currentOrderId && normalizeCustomerKey(order.customerName) === key)
                .sort((a, b) => {
                    const diff = parsePtBrDate(b.date) - parsePtBrDate(a.date);
                    if (diff !== 0) return diff;
                    const osA = parseInt(String(a.osNumber || '0').replace(/\D/g, ''), 10) || 0;
                    const osB = parseInt(String(b.osNumber || '0').replace(/\D/g, ''), 10) || 0;
                    return osB - osA;
                });

            if (!relatedOrders.length) return null;

            const platformCounts = { AEG: 0, GBB: 0, HPA: 0, SPRING: 0, OUTROS: 0 };
            const serviceCounts = {};
            const equipmentCounts = {};

            relatedOrders.forEach(order => {
                const eqUpper = String(order.equipment || '').toUpperCase();

                if (eqUpper.includes('AEG')) platformCounts.AEG += 1;
                else if (eqUpper.includes('GBB') || eqUpper.includes('GBBR') || eqUpper.includes('PISTOLA')) platformCounts.GBB += 1;
                else if (eqUpper.includes('HPA')) platformCounts.HPA += 1;
                else if (eqUpper.includes('SPRING') || eqUpper.includes('MOLA')) platformCounts.SPRING += 1;
                else platformCounts.OUTROS += 1;

                const normalizedEquipment = String(order.equipment || '').trim();
                if (normalizedEquipment) equipmentCounts[normalizedEquipment] = (equipmentCounts[normalizedEquipment] || 0) + 1;

                asArray(order.services).forEach(service => {
                    const serviceName = String(service?.name || '').trim();
                    if (serviceName) serviceCounts[serviceName] = (serviceCounts[serviceName] || 0) + 1;
                });
            });

            const favoritePlatform = Object.entries(platformCounts).sort((a, b) => b[1] - a[1])[0]?.[0] || 'OUTROS';
            const favoriteService = Object.entries(serviceCounts).sort((a, b) => b[1] - a[1])[0]?.[0] || '—';
            const recurringEquipment = Object.entries(equipmentCounts)

            const recurrenceLabel = relatedOrders.length >= 5

            // ── Icon refresh ───────────────────────────────────────────────────
            // No Bank não podemos reexecutar lucide.createIcons(), porque o Lucide

            // nas atualizações de contas fixas (salvar / marcar / desmarcar).

            // ── Sync OS payments → bank income ────────────────────────────────
            useEffect(() => {
                const toIsoFromPtBr = (value) => {
                    const raw = String(value || '').trim();
                    if (!raw) return '';
                    if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
                    const match = raw.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
                    return match ? `${match[3]}-${match[2]}-${match[1]}` : '';
                };

                const getOrderSyncId = (order) => String(order?.id || order?.osNumber || '');
                const getAdvanceValue = (order) => Number((typeof calculateAdvancePayment === 'function' ? calculateAdvancePayment(order) : order?.advancePaymentValue) || 0);
                const todayIso = new Date().toISOString().slice(0,10);

                const payableOrders = (orders || []).filter(order => {
                    const total = Number((typeof calculateTotal === 'function' ? calculateTotal(order) : 0) || 0);
                    const advance = getAdvanceValue(order);
                    return total > 0 || advance > 0;
                });

                const advanceOrders = payableOrders.filter(order => getAdvanceValue(order) > 0);
                const paidOrders = payableOrders.filter(order => order.paymentStatus === 'PAGO');
                const advanceMap = new Map(advanceOrders.map(order => [getOrderSyncId(order), order]));
                const paidMap = new Map(paidOrders.map(order => [getOrderSyncId(order), order]));

                setTransactions(prev => {
                    let next = [...prev];

                    // Remove sincronizações antigas que não existem mais na OS.
                    next = next.filter(item => {
                        if (item.syncSource === 'office_advance') return advanceMap.has(String(item.syncId));
                        if (item.syncSource === 'office') return paidMap.has(String(item.syncId));
                        return true;
                    });

                    const upsertSyncedTransaction = (transaction) => {
                        const idx = next.findIndex(item => item.syncSource === transaction.syncSource && String(item.syncId) === String(transaction.syncId));
                        if (idx >= 0) next[idx] = { ...next[idx], ...transaction };
                        else next.unshift(transaction);
                    };

                    advanceOrders.forEach(order => {
                        const syncId = getOrderSyncId(order);
                        if (!syncId) return;
                        const total = Number((typeof calculateTotal === 'function' ? calculateTotal(order) : 0) || 0);
                        const advance = Math.min(getAdvanceValue(order), total || getAdvanceValue(order));
                        if (advance <= 0) return;

                        const orderDateIso = toIsoFromPtBr(order.date) || todayIso;
                        const advanceDateIso = String(order.advancePaymentDate || '').trim() || orderDateIso;
                        const methodLabel = getPaymentMethodLabel(order.advancePaymentMethod || order.paymentMethod || 'PIX');

                        upsertSyncedTransaction({
                            id: 'sync_advance_' + syncId,
                            syncId,
                            syncSource: 'office_advance',
                            area: 'oficina',
                            type: 'entrada',
                            category: 'Sinal de cliente',
                            description: `#${order.osNumber} — ${order.customerName || 'Cliente'}`,
                            value: advance,
                            isPersonalExpense: false,
                            date: advanceDateIso,
                            sourceOrderDate: orderDateIso,
                            paymentDate: advanceDateIso,
                            realProfit: advance,
                            realCost: 0,
                            realMargin: 100,
                            obs: `Auto-importado da oficina • Sinal do cliente via ${methodLabel}`
                        });
                    });

                    paidOrders.forEach(order => {
                        const syncId = getOrderSyncId(order);
                        if (!syncId) return;
                        const total  = Number((typeof calculateTotal === 'function' ? calculateTotal(order) : 0) || 0);
                        const advance = Math.min(getAdvanceValue(order), total);
                        const finalValue = Math.max(0, total - advance);
                        if (finalValue <= 0) return;

                        const realProfitTotal = Number((typeof calculateOrderRealProfit === 'function' ? calculateOrderRealProfit(order) : total) || 0);
                        const finalProfit = Math.max(0, realProfitTotal - advance);
                        const realCost = Math.max(0, finalValue - finalProfit);
                        const orderDateIso = toIsoFromPtBr(order.date) || todayIso;
                        const paymentDateIso = String(order.paymentDate || '').trim() || orderDateIso;
                        const hasAdvance = advance > 0;

                        upsertSyncedTransaction({
                            id: 'sync_' + syncId,
                            syncId,
                            syncSource: 'office',
                            area: 'oficina',
                            type: 'entrada',
                            category: hasAdvance ? 'Pago' : 'Serviço',
                            description: `#${order.osNumber} — ${order.customerName || 'Cliente'}`,
                            value: finalValue,
                            isPersonalExpense: false,
                            date: paymentDateIso,
                            sourceOrderDate: orderDateIso,
                            paymentDate: paymentDateIso,
                            realProfit: finalProfit,
                            realCost,
                            realMargin: finalValue > 0 ? (finalProfit / finalValue) * 100 : 0,
                            obs: hasAdvance
                                ? `Auto-importado da oficina • Saldo após sinal de ${money(advance)} • Lucro real: ${money(finalProfit)}`
                                : `Auto-importado da oficina • Lucro real: ${money(finalProfit)}`
                        });
                    });

                    return normalizeBankTransactions(next);
                });
            }, [orders]);

            // ── Helpers ────────────────────────────────────────────────────────
            const money  = v => Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
            const pct    = (a, b) => b > 0 ? Math.min(100, Math.round((a/b)*100)) : 0;
            const monthLabel = ym => {
                const match = String(ym || '').match(/^(\d{4})-(\d{2})$/);
                if (!match) return 'SEM DATA';
                const year = Number(match[1]);
                const month = Number(match[2]);
                const base = new Date(year, month - 1, 1, 12, 0, 0, 0);
                return Number.isNaN(base.getTime())
                    ? 'SEM DATA'
                    : base.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
            };

            // ── Months for selector ─────────────────────────────────────────────
            const availableMonths = useMemo(() => {
                const set = new Set([currentYM]);
                transactions.forEach(t => { const ym = String(normalizeBankDate(t?.date || '')).slice(0,7); if(/^\d{4}-\d{2}$/.test(ym)) set.add(ym); });
                fixedBills.forEach(b => { if (isIsoDate(b?.date)) set.add(b.date.slice(0,7)); });
                cardEntries.forEach(entry => {
                    const ym = /^\d{4}-\d{2}$/.test(String(entry?.invoiceMonth || ''))
                        ? String(entry.invoiceMonth)
                        : String(normalizeBankDate(entry?.date || entry?.purchaseDate || '')).slice(0,7);
                    if(/^\d{4}-\d{2}$/.test(ym)) set.add(ym);
                });
                // Calendário contínuo: meses anteriores, mês atual e próximos 12 meses disponíveis.
                const [curY, curM] = currentYM.split('-').map(Number);
                const futureBase = new Date(curY, curM - 1 + 12, 1, 12, 0, 0, 0);
                set.add(`${futureBase.getFullYear()}-${String(futureBase.getMonth()+1).padStart(2,'0')}`);
                const allMonths = [...set].filter(Boolean).sort();
                const maxYM = allMonths[allMonths.length - 1] || currentYM;
                const [maxY, maxM] = maxYM.split('-').map(Number);
                const startYear = 2024; const startMonth = 1;
                for (let y = startYear; y <= maxY; y++) {
                    const mStart = (y === startYear) ? startMonth : 1;
                    const mEnd   = (y === maxY) ? maxM : 12;
                    for (let m = mStart; m <= mEnd; m++) {
                        set.add(`${y}-${String(m).padStart(2,'0')}`);
                    }
                }
                return [...set].sort((a,b)=>b.localeCompare(a));
            }, [transactions, fixedBills, cardEntries, cards, currentYM]);

            // ── Summary (all time) ─────────────────────────────────────────────
            const totalSummary = useMemo(() => {
                const p = {i:0,e:0}; const w = {i:0,e:0};
                // Saldo oficina: receitas APENAS de ordens pagas (syncSource=office) + todas as despesas
                const wPaid = {i:0, e:0};
                let personalViaWorkshop = 0;
                transactions.forEach(t => {
                    const v = Number(t.value||0);
                    if (t.area === 'pessoal') { t.type==='entrada' ? p.i+=v : p.e+=v; }
                    else {
                        t.type==='entrada' ? w.i+=v : w.e+=v;
                        if ((t.isPersonalExpense || PERSONAL_EXPENSE_CATS.includes(t.category)) && t.type==='saida') personalViaWorkshop += v;
                        // Saldo oficina pago: entrada só conta se vier de ordem PAGA (syncSource=office)
                        if (t.type==='entrada' && t.syncSource==='office') wPaid.i += v;
                        if (t.type==='saida') wPaid.e += v;
                    }
                });
                const wBalancePaid = wPaid.i - wPaid.e;
                return { pBalance:p.i-p.e, wBalance:w.i-w.e, wBalancePaid, pIncome:p.i, pExpense:p.e, wIncome:w.i, wExpense:w.e,
                    wPaidIncome:wPaid.i, wPaidExpense:wPaid.e,
                    personalViaWorkshop, total:(p.i-p.e)+(w.i-w.e) };
            }, [transactions]);

            // ── Monthly filtered summary ───────────────────────────────────────
            const monthlySummary = useMemo(() => {
                const filtered = transactions.filter(t => t.date && t.date.slice(0,7) === selectedMonth);

            const monthlyExtractGroups = useMemo(() => {
                const rows = transactions
                    .map((t, index) => normalizeBankTransaction(t, index))
                    .filter(Boolean)
                    .filter(t => (!filterArea || filterArea === 'todos' || t.area === filterArea))
                    .filter(t => (!filterType || filterType === 'todos' || t.type === filterType))
                    .filter(t => {
                        const q = String(search || '').trim().toLowerCase();
                        if (!q) return true;
                        return [t.description, t.category, t.area, t.type, t.obs].some(v => String(v || '').toLowerCase().includes(q));
                    })
                    .sort((a,b) => String(normalizeBankDate(b.date)||'').localeCompare(String(normalizeBankDate(a.date)||'')));
                const grouped = {};
                rows.forEach(item => {
                    const ym = String(normalizeBankDate(item.date)).slice(0,7);
                    if (!/^\d{4}-\d{2}$/.test(ym)) return;
                    if (!grouped[ym]) grouped[ym] = [];
                    grouped[ym].push(item);
                });
                return Object.entries(grouped).sort((a,b) => b[0].localeCompare(a[0]));
            }, [transactions, filterArea, filterType, search]);

            const cashFlowDays = useMemo(() => {
                const [y,m] = selectedMonth.split('-').map(Number);
                const daysInMonth = new Date(y, m, 0).getDate();
                const map = {};
                transactions
                    .filter(t => t.date && t.date.slice(0,7) === selectedMonth)
                    .forEach(t => {
                        const d = parseInt(t.date.slice(8,10));
                        if (!map[d]) map[d] = { in:0, out:0 };
                        t.type==='entrada' ? map[d].in+=Number(t.value||0) : map[d].out+=Number(t.value||0);
                    });
                return Array.from({length:daysInMonth},(_,i)=>({
                    day:i+1, in:(map[i+1]||{in:0}).in, out:(map[i+1]||{out:0}).out
                }));
            }, [transactions, selectedMonth]);

            const maxCashFlow = useMemo(() => Math.max(...cashFlowDays.map(d=>Math.max(d.in,d.out)),1), [cashFlowDays]);

            // ── Save transaction ───────────────────────────────────────────────
            const saveTransaction = () => {
                const value = parseFloat(form.value);

            const editTransaction = (t) => {

            const removeTransaction = (id) => {

            // ── Fixed bills ────────────────────────────────────────────────────

            // ── Area form handler ──────────────────────────────────────────────
            const removeFixedBill = (billId) => {

            const handleAreaChange = (area) => {

            // ── Cartões ───────────────────────────────────────────────────────
            const emptyCardForm = {
                name: '',
                brand: '',
                final: '',
                limit: '',
                dueDay: '',
                closingDay: '',
                bestPurchaseDay: ''
            };
            const emptyCardEntryForm = {
                area: 'pessoal',
                category: getCats('pessoal', 'saida')[0],
                description: '',
                totalValue: '',
                date: isoToday(),
                obs: '',
                isInstallment: false,
                installmentCount: '2',
                installmentGroupId: '',
                isRecurring: false,
                recurrenceMonths: '72',
                recurringGroupId: ''
            };
            const selectedCard = useMemo(() => cards.find(c => c.id === selectedCardId) || null, [cards, selectedCardId]);
            const [cardForm, setCardForm] = useState(emptyCardForm);
            const [cardEntryForm, setCardEntryForm] = useState(emptyCardEntryForm);

            const handleCardAreaChange = (area) => {
                const safeArea = area === 'oficina' ? 'oficina' : 'pessoal';
                setCardEntryForm(prev => ({
                    ...prev,
                    area: safeArea,
                    category: getCats(safeArea, 'saida')[0]
                }));
            };

            const parseCardDay = (value) => {
                const raw = parseInt(value, 10);
                return Number.isInteger(raw) && raw >= 1 && raw <= 31 ? raw : null;
            };

            const addMonthsToYM = (ym, amount = 0) => {
                const [year, month] = String(ym || currentYM).split('-').map(Number);
                if (!year || !month) return currentYM;
                const base = new Date(year, month - 1 + amount, 1, 12, 0, 0, 0);
                return `${base.getFullYear()}-${String(base.getMonth() + 1).padStart(2,'0')}`;
            };

            const shiftIsoDateMonths = (isoDate, amount = 0) => {
                const normalized = normalizeBankDate(isoDate, isoToday());
                const [year, month, day] = String(normalized).split('-').map(Number);
                if (!year || !month || !day) return isoToday();
                const base = new Date(year, month - 1 + amount, 1, 12, 0, 0, 0);
                const maxDay = new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate();
                return `${base.getFullYear()}-${String(base.getMonth() + 1).padStart(2,'0')}-${String(Math.min(day, maxDay)).padStart(2,'0')}`;
            };

            const splitAmountAcrossInstallments = (totalValue, count = 1) => {
                const safeTotal = Math.max(Number(totalValue || 0), 0);
                const safeCount = Math.max(parseInt(count || 1, 10) || 1, 1);
                const totalCents = Math.round((safeTotal + Number.EPSILON) * 100);
                const baseCents = Math.floor(totalCents / safeCount);
                const remainder = totalCents - (baseCents * safeCount);
                return Array.from({ length: safeCount }, (_, index) => Number(((baseCents + (index === safeCount - 1 ? remainder : 0)) / 100).toFixed(2)));
            };

            const getCardDueDay = (card) => parseCardDay(card?.dueDay);
            const getCardClosingDay = (card) => parseCardDay(card?.closingDay) || getCardDueDay(card);
            const getCardBestPurchaseDay = (card) => {
                const bestDay = parseCardDay(card?.bestPurchaseDay);
                if (bestDay) return bestDay;
                const closingDay = getCardClosingDay(card);
                return closingDay ? (closingDay === 31 ? 1 : closingDay + 1) : null;
            };

            const getCardInvoiceMonth = (entry, card) => {
                // Para parcelamento, cada registro já representa UMA parcela e tem sua própria data.
                // Por isso a fatura deve ser calculada pela data da parcela (entry.date), não pela data original da compra.
                // Ex.: compra 08/04 em 3x, cartão fecha 31 e vence 11:
                // parcela 1 -> fatura 05/2026, parcela 2 -> fatura 06/2026, parcela 3 -> fatura 07/2026.
                const entryDate = normalizeBankDate(entry?.date || entry?.purchaseDate, isoToday());
                const baseYM = String(entryDate).slice(0,7);
                const closingDay = getCardClosingDay(card);
                const dueDay = getCardDueDay(card);
                const entryDay = parseInt(String(entryDate).slice(8,10), 10);

                // A fatura exibida no Bank representa o mês de VENCIMENTO.
                // Primeiro encontra o mês de fechamento da parcela, depois joga para o mês de vencimento.
                // Ex.: fecha dia 31 e vence dia 11: compra/parcela em 08/04 fecha em 30/04 e vence em 11/05.
                if (!closingDay || !dueDay || !Number.isInteger(entryDay)) {
                    return /^\d{4}-\d{2}$/.test(String(entry?.invoiceMonth || '')) ? String(entry.invoiceMonth) : baseYM;
                }

                const closingYM = entryDay > closingDay ? addMonthsToYM(baseYM, 1) : baseYM;
                return dueDay <= closingDay ? addMonthsToYM(closingYM, 1) : closingYM;
            };

            const getCardInvoiceDueDate = (card, ym = currentYM) => {
                const dueDay = getCardDueDay(card);
                if (!dueDay || !ym) return null;
                const [year, month] = String(ym).split('-').map(Number);
                if (!year || !month) return null;
                const maxDay = new Date(year, month, 0).getDate();
                return new Date(year, month - 1, Math.min(dueDay, maxDay), 12, 0, 0, 0);
            };

            const buildCardEntriesFromForm = (form, card) => {
                const totalValue = Math.round((Number(form.totalValue || 0) + Number.EPSILON) * 100) / 100;
                const purchaseDate = normalizeBankDate(form.date, isoToday());
                const timestamp = Date.now();
                const isRecurring = form.isRecurring === true;

                if (isRecurring) {
                    const recurrenceMonths = Math.min(Math.max(parseInt(form.recurrenceMonths || 72, 10) || 72, 1), 120);
                    const recurringGroupId = form.recurringGroupId || `card_recurring_${timestamp}`;
                    return Array.from({ length: recurrenceMonths }, (_, index) => {
                        const recurringDate = shiftIsoDateMonths(purchaseDate, index);
                        return {
                            id: `card_entry_${timestamp}_rec_${index}_${Math.random().toString(36).slice(2,8)}`,
                            cardId: selectedCardId,
                            area: form.area === 'oficina' ? 'oficina' : 'pessoal',
                            category: form.category,

                            value: totalValue,
                            totalPurchaseValue: totalValue,
                            date: recurringDate,
                            purchaseDate,
                            invoiceMonth: getCardInvoiceMonth({ date: recurringDate }, card),
                            obs: form.obs || '',
                            isInstallment: false,
                            installmentCount: 1,
                            installmentIndex: 1,
                            installmentValue: totalValue,
                            installmentGroupId: '',
                            isRecurring: true,
                            recurringGroupId,
                            recurringIndex: index + 1,
                            recurringActive: true,
                            recurrenceMonths
                        };
                    });
                }

                const installmentCount = form.isInstallment ? Math.max(parseInt(form.installmentCount || 1, 10) || 1, 2) : 1;
                const values = splitAmountAcrossInstallments(totalValue, installmentCount);
                const groupId = installmentCount > 1 ? (form.installmentGroupId || `card_installment_${timestamp}`) : '';
                return values.map((installmentValue, index) => {
                    const installmentDate = shiftIsoDateMonths(purchaseDate, index);
                    return {
                        id: `card_entry_${timestamp}_${index}_${Math.random().toString(36).slice(2,8)}`,
                        cardId: selectedCardId,
                        area: form.area === 'oficina' ? 'oficina' : 'pessoal',
                        category: form.category,
                        description: form.description.trim(),
                        value: installmentValue,
                        totalPurchaseValue: totalValue,
                        date: installmentDate,
                        purchaseDate,
                        invoiceMonth: getCardInvoiceMonth({ date: installmentDate }, card),
                        obs: form.obs || '',
                        isInstallment: installmentCount > 1,
                        installmentCount,
                        installmentIndex: index + 1,
                        installmentValue,
                        installmentGroupId: groupId,
                        isRecurring: false,
                        recurringGroupId: '',
                        recurringIndex: 1,
                        recurringActive: true,
                        recurrenceMonths: 1
                    };
                });
            };

            const saveCard = () => {
                const name = String(cardForm.name || '').trim();
                const brand = String(cardForm.brand || '').trim();
                const final = String(cardForm.final || '').replace(/\D/g, '').slice(-4);
                const limit = cardForm.limit === '' ? '' : Number(cardForm.limit || 0);
                const dueDay = cardForm.dueDay === '' ? '' : Math.min(Math.max(parseInt(cardForm.dueDay || 0, 10), 1), 31);
                const closingDay = cardForm.closingDay === '' ? '' : Math.min(Math.max(parseInt(cardForm.closingDay || 0, 10), 1), 31);
                const bestPurchaseDay = cardForm.bestPurchaseDay === '' ? '' : Math.min(Math.max(parseInt(cardForm.bestPurchaseDay || 0, 10), 1), 31);
                const existingCard = cards.find(card => card.id === editingCardId);
                if (!name) {
                    showToast('Informe o nome do cartão', 'warning');

                    id: editingCardId || `card_${Date.now()}`,

                    limit: limit !== '' && limit > 0 ? limit : '',
                    dueDay: dueDay || '',
                    closingDay: closingDay || '',
                    bestPurchaseDay: bestPurchaseDay || '',
                    createdAt: existingCard?.createdAt || new Date().toISOString()
                };
                setCards(prev => editingCardId
                    ? prev.map(card => card.id === editingCardId ? { ...card, ...payload } : card)
                    : [payload, ...prev]
                );
                if (!editingCardId) setSelectedCardId(payload.id);
                setEditingCardId(null);
                setCardForm(emptyCardForm);
                setShowCardForm(false);
                showToast(editingCardId ? '✅ Cartão atualizado' : '✅ Cartão adicionado', 'success');
            };

            const editCard = (card) => {
                setEditingCardId(card.id);
                setCardForm({
                    name: card.name || '',
                    brand: card.brand || '',
                    final: card.final || '',
                    limit: card.limit === '' ? '' : String(card.limit || ''),
                    dueDay: card.dueDay === '' ? '' : String(card.dueDay || ''),
                    closingDay: card.closingDay === '' ? '' : String(card.closingDay || ''),

                });
                setShowCardForm(true);
                window.scrollTo({top:0,behavior:'smooth'});

            const removeCard = (cardId) => {
                setCards(prev => prev.filter(card => card.id !== cardId));
                setCardEntries(prev => prev.filter(entry => entry.cardId !== cardId));
                if (selectedCardId === cardId) {

            const saveCardEntry = () => {
                if (!selectedCardId) {
                    showToast('Selecione um cartão', 'warning');
                    return;
                }
                const selectedCardData = cards.find(card => card.id === selectedCardId);
                if (!selectedCardData) {
                    showToast('Cartão não encontrado', 'warning');
                    return;
                }
                const totalValue = Number(cardEntryForm.totalValue || 0);
                const installmentCount = cardEntryForm.isInstallment ? Math.max(parseInt(cardEntryForm.installmentCount || 1, 10) || 1, 2) : 1;
                if (cardEntryForm.isRecurring && cardEntryForm.isInstallment) {
                    showToast('Escolha parcelado OU recorrente', 'warning');

                }
                if (!cardEntryForm.description.trim() || totalValue <= 0 || !cardEntryForm.date) {

                if (cardEntryForm.isInstallment && installmentCount < 2) {

                }
                const payloads = buildCardEntriesFromForm(cardEntryForm, selectedCardData);
                const currentEditingEntry = cardEntries.find(entry => entry.id === editingCardEntryId);
                const editingGroupId = currentEditingEntry?.installmentGroupId || cardEntryForm.installmentGroupId || '';
                const editingRecurringGroupId = currentEditingEntry?.recurringGroupId || cardEntryForm.recurringGroupId || '';
                setCardEntries(prev => {
                    const filtered = editingCardEntryId
                        ? prev.filter(entry => editingRecurringGroupId ? entry.recurringGroupId !== editingRecurringGroupId : (editingGroupId ? entry.installmentGroupId !== editingGroupId : entry.id !== editingCardEntryId))
                        : prev;
                    return [...payloads, ...filtered];
                });
                setEditingCardEntryId(null);
                setCardEntryForm(prev => ({ ...emptyCardEntryForm, area: prev.area, category: getCats(prev.area, 'saida')[0], date: prev.date }));
                setShowCardEntryForm(false);
                showToast(
                    editingCardEntryId
                        ? (cardEntryForm.isRecurring ? '✅ Recorrência atualizada' : (payloads.length > 1 ? '✅ Parcelamento atualizado' : '✅ Lançamento do cartão atualizado'))
                        : (cardEntryForm.isRecurring ? '✅ Compra recorrente salva' : (payloads.length > 1 ? '✅ Gasto parcelado salvo' : '✅ Gasto do cartão salvo')),
                    'success'
                );
