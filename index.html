            const editCardEntry = (entry) => {
                const groupEntries = entry.recurringGroupId
                    ? cardEntries
                        .filter(item => item.recurringGroupId === entry.recurringGroupId)
                        .sort((a,b) => Number(a.recurringIndex || 1) - Number(b.recurringIndex || 1))
                    : (entry.installmentGroupId
                        ? cardEntries
                            .filter(item => item.installmentGroupId === entry.installmentGroupId)
                            .sort((a,b) => Number(a.installmentIndex || 1) - Number(b.installmentIndex || 1))
                        : [entry]);
                const baseEntry = groupEntries.find(item => Number(item.installmentIndex || 1) === 1 || Number(item.recurringIndex || 1) === 1) || groupEntries[0] || entry;
                const totalPurchaseValue = entry.recurringGroupId
                    ? Number(baseEntry.value || baseEntry.totalPurchaseValue || 0)
                    : Number(baseEntry.totalPurchaseValue || groupEntries.reduce((sum, item) => sum + Number(item.value || 0), 0));
                const area = baseEntry.area || 'pessoal';
                const installmentCount = Math.max(parseInt(baseEntry.installmentCount || groupEntries.length || 1, 10) || 1, 1);
                setEditingCardEntryId(entry.id);
                setCardEntryForm({
                    area,
                    category: baseEntry.category || getCats(area, 'saida')[0],

        const AssistenciaTecnica = ({ onBack }) => {
            const STORAGE_KEY = 'alcantara_assistencias_registros';
            const todayBr = new Date().toLocaleDateString('pt-BR');
            const todayIso = () => new Date().toISOString().slice(0,10);
            const addDaysIso = (isoDate, days) => {
                const base = /^\d{4}-\d{2}-\d{2}$/.test(String(isoDate || '')) ? new Date(`${isoDate}T12:00:00`) : new Date();
                base.setDate(base.getDate() + Number(days || 0));
                return base.toISOString().slice(0,10);
            };
            const isoToBr = (iso) => /^\d{4}-\d{2}-\d{2}$/.test(String(iso || '')) ? String(iso).split('-').reverse().join('/') : String(iso || '');
            const ASSIST_STATUS = {
                ABERTA: { label: 'ABERTA', cls: 'border-yellow-500/30 bg-yellow-500/10 text-yellow-400' },
                EM_ANDAMENTO: { label: 'EM ANDAMENTO', cls: 'border-blue-500/30 bg-blue-500/10 text-blue-400' },
                AGUARDANDO_PARCEIRO: { label: 'AGUARDANDO PARCEIRO', cls: 'border-orange-500/30 bg-orange-500/10 text-orange-400' },
                AGUARDANDO_REPASSE: { label: 'AGUARDANDO REPASSE', cls: 'border-purple-500/30 bg-purple-500/10 text-purple-300' },
                FINALIZADA: { label: 'FINALIZADA', cls: 'border-green-500/30 bg-green-500/10 text-green-400' }
            };
            const normalizeAssistStatus = (value) => ASSIST_STATUS[String(value || '').toUpperCase()] ? String(value).toUpperCase() : 'ABERTA';
            const parseMoneyInput = (value) => Number(String(value || '').replace(/\./g, '').replace(',', '.')) || 0;

            const generateWorkshopProtocol = () => `AA-${new Date().getFullYear()}-${String(Date.now()).slice(-6)}`;

            const formatPhone = (value) => {
                const digits = String(value || '').replace(/\D/g, '').slice(0, 13);
                if (!digits) return '';
                if (digits.length <= 2) return `(${digits}`;
                if (digits.length <= 7) return `(${digits.slice(0,2)}) ${digits.slice(2)}`;
                if (digits.length <= 11) return `(${digits.slice(0,2)}) ${digits.slice(2,7)}-${digits.slice(7)}`;
                return `+${digits.slice(0,2)} (${digits.slice(2,4)}) ${digits.slice(4,9)}-${digits.slice(9)}`;
            };

            const normalizeCnpj = (value) => {
                const digits = String(value || '').replace(/\D/g, '').slice(0, 14);
                if (!digits) return '';
                if (digits.length <= 2) return digits;
                if (digits.length <= 5) return `${digits.slice(0,2)}.${digits.slice(2)}`;
                if (digits.length <= 8) return `${digits.slice(0,2)}.${digits.slice(2,5)}.${digits.slice(5)}`;
                if (digits.length <= 12) return `${digits.slice(0,2)}.${digits.slice(2,5)}.${digits.slice(5,8)}/${digits.slice(8)}`;
                return `${digits.slice(0,2)}.${digits.slice(2,5)}.${digits.slice(5,8)}/${digits.slice(8,12)}-${digits.slice(12)}`;
            };

            const buildEmpty = () => ({
                id: `assist_${Date.now()}`,
                date: todayBr,
                personType: 'PF',
                assistance: '',
                serialNumber: '',
                defectReport: '',
                customerName: '',
                customerEmail: '',
                customerWhatsapp: '',
                deliveredBy: 'CLIENTE',
                workshopProtocol: generateWorkshopProtocol(),
                partnerProtocol: '',
                status: 'ABERTA',
                repasseValue: '',
                finalizedAt: '',
                repasseDueDate: '',
                bankTransactionId: '',
                storeCnpj: '',
                storeName: '',
                isWholesale: false
            });

            const normalizeRecord = (record, index = 0) => {
                if (!record || typeof record !== 'object') return null;
                const personType = record.personType === 'PJ' ? 'PJ' : 'PF';
                const assistance = String(record.assistance || '').trim();
                const serialNumber = String(record.serialNumber || '').trim();
                if (!assistance || !serialNumber) return null;

                return {
                    id: String(record.id || `assist_${Date.now()}_${index}`),
                    date: String(record.date || todayBr),
                    personType,
                    assistance,
                    serialNumber,
                    defectReport: String(record.defectReport || '').trim(),
                    customerName: String(record.customerName || '').trim(),
                    customerEmail: String(record.customerEmail || '').trim(),
                    customerWhatsapp: formatPhone(String(record.customerWhatsapp || '')),
                    deliveredBy: String(record.deliveredBy || 'CLIENTE').toUpperCase(),
                    workshopProtocol: String(record.workshopProtocol || generateWorkshopProtocol()).trim(),
                    partnerProtocol: String(record.partnerProtocol || '').trim(),
                    status: normalizeAssistStatus(record.status),
                    repasseValue: record.repasseValue === '' || record.repasseValue === undefined ? '' : Number(record.repasseValue || 0),
                    finalizedAt: String(record.finalizedAt || '').trim(),
                    repasseDueDate: String(record.repasseDueDate || '').trim(),
                    bankTransactionId: String(record.bankTransactionId || '').trim(),
                    storeCnpj: normalizeCnpj(record.storeCnpj || ''),
                    storeName: String(record.storeName || '').trim(),
                    isWholesale: !!record.isWholesale,
                    createdAt: record.createdAt || new Date().toISOString()
                };
            };

            const loadRecords = () => {
                try {
                    return asArray(safeJsonParse(SafeStorage.getItem(STORAGE_KEY), []))
                        .map((item, index) => normalizeRecord(item, index))
                        .filter(Boolean)
                        .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
                } catch (error) {
                    console.error('Erro ao carregar assistências:', error);
                    return [];
                }
            };

            const persistRecords = (list) => {
                try {
                    SafeStorage.setItem(STORAGE_KEY, JSON.stringify(asArray(list)));
                    return true;
                } catch (error) {
                    console.error('Erro ao salvar assistências:', error);
                    showToast('⚠️ Erro ao salvar assistência técnica', 'error');
                    return false;
                }
            };

            const [records, setRecords] = useState(loadRecords);
            const [form, setForm] = useState(buildEmpty);
            const [editingId, setEditingId] = useState(null);
            const [confirmDelete, setConfirmDelete] = useState(null);
            const [screen, setScreen] = useState('list');
            const [searchTerm, setSearchTerm] = useState('');

            const resetForm = () => {
                setForm(buildEmpty());
                setEditingId(null);
            };

            const updateForm = (updates) => setForm(prev => ({ ...prev, ...updates }));

            const orderedRecords = useMemo(() => {
                return [...records].sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
            }, [records]);

            const filteredRecords = useMemo(() => {
                const term = String(searchTerm || '').trim().toLowerCase();
                if (!term) return orderedRecords;
                return orderedRecords.filter(record => {
                    const activeProtocol = String(record.partnerProtocol || record.workshopProtocol || '').toLowerCase();
                    return [
                        record.assistance,
                        record.serialNumber,
                        record.defectReport,
                        record.customerName,
                        record.customerEmail,
                        record.customerWhatsapp,
                        record.deliveredBy,
                        record.storeCnpj,
                        record.storeName,
                        activeProtocol,
                        ASSIST_STATUS[record.status]?.label,
                        record.personType
                    ].some(value => String(value || '').toLowerCase().includes(term));
                });
            }, [orderedRecords, searchTerm]);

            const openCreate = () => {
                resetForm();
                setScreen('form');
                try {
                    window.scrollTo({ top: 0 });
                } catch (error) {
                    window.scrollTo(0, 0);
                }
            };

            const handleSubmit = (e) => {
                e?.preventDefault?.();
                e?.stopPropagation?.();

                try {
                    const personType = form.personType === 'PJ' ? 'PJ' : 'PF';
                    const assistance = String(form.assistance || '').trim();
                    const serialNumber = String(form.serialNumber || '').trim();
                    const workshopProtocol = String(form.workshopProtocol || '').trim() || generateWorkshopProtocol();
                    const partnerProtocol = String(form.partnerProtocol || '').trim();
                    const customerName = String(form.customerName || '').trim();
                    const storeName = String(form.storeName || '').trim();
                    const status = normalizeAssistStatus(form.status);
                    const repasseValue = parseMoneyInput(form.repasseValue);
                    const finalizedAt = status === 'FINALIZADA'
                        ? (form.finalizedAt || todayIso())
                        : String(form.finalizedAt || '').trim();
                    const repasseDueDate = status === 'FINALIZADA'
                        ? (form.repasseDueDate || addDaysIso(finalizedAt, 28))
                        : String(form.repasseDueDate || '').trim();

                    if (!assistance || !serialNumber) {
                        showToast('⚠️ Preencha assistência e número de série', 'warning');
                        return false;
                    }
                    if (personType === 'PF' && !String(form.defectReport || '').trim()) {
                        showToast('⚠️ Informe o defeito relatado', 'warning');
                        return false;
                    }
                    if (personType === 'PJ' && !String(form.storeCnpj || '').trim()) {
                        showToast('⚠️ Informe o CNPJ da loja', 'warning');
                        return false;
                    }

                    let normalized = normalizeRecord({
                        ...form,
                        id: editingId || form.id || `assist_${Date.now()}`,
                        personType,
                        assistance,
                        serialNumber,
                        workshopProtocol,
                        partnerProtocol,
                        status,
                        repasseValue: repasseValue > 0 ? repasseValue : '',
                        finalizedAt,
                        repasseDueDate,
                        bankTransactionId: String(form.bankTransactionId || '').trim(),
                        customerName,
                        storeName,
                        storeCnpj: normalizeCnpj(form.storeCnpj || ''),
                        createdAt: editingId
                            ? (records.find(item => item.id === editingId)?.createdAt || new Date().toISOString())
                            : new Date().toISOString()
                    });

                    if (!normalized) {
                        showToast('⚠️ Não foi possível salvar a assistência', 'error');
                        return false;
                    }
                    if (normalized.status === 'FINALIZADA' && Number(normalized.repasseValue || 0) > 0) {
                        normalized = upsertAssistenciaBankEntry(normalized);
                    }

                    const next = [...records];
                    const index = next.findIndex(item => item.id === normalized.id);
                    if (index >= 0) next[index] = normalized;
                    else next.unshift(normalized);

                    const orderedNext = [...next].sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

                    if (!persistRecords(orderedNext)) return false;

                    setRecords(orderedNext);
                    showToast(editingId ? '✅ Assistência atualizada' : '✅ Assistência cadastrada', 'success');
                    resetForm();
                    setScreen('list');
                    try {
                        window.scrollTo({ top: 0 });
                    } catch (error) {
                        window.scrollTo(0, 0);
                    }
                    return false;
                } catch (error) {
                    console.error('Erro ao cadastrar assistência:', error);
                    showToast('⚠️ Erro ao salvar assistência técnica', 'error');
                    return false;
                }
            };

            const handleEdit = (record) => {
                try {
                    setForm({ ...buildEmpty(), ...record });
                    setEditingId(record.id);
                    setScreen('form');
                    window.scrollTo({ top: 0 });
                } catch (error) {
                    console.error('Erro ao editar assistência:', error);
                    showToast('⚠️ Erro ao abrir cadastro para edição', 'error');
                    try { window.scrollTo(0, 0); } catch (_) {}
                }
            };

            const handleDelete = (id) => {
                try {
                    const next = records.filter(item => item.id !== id);
                    if (!persistRecords(next)) return;
                    setRecords(next);
                    if (editingId === id) resetForm();
                    setConfirmDelete(null);
                    showToast('🗑️ Assistência removida', 'success');
                } catch (error) {
                    console.error('Erro ao excluir assistência:', error);
                    showToast('⚠️ Erro ao excluir assistência', 'error');
                }
            };


            const upsertAssistenciaBankEntry = (record) => {
                const value = Number(record.repasseValue || 0);
                if (value <= 0 || !record.repasseDueDate) return record;
                const txId = record.bankTransactionId || `assist_repasse_${record.id}`;
                const transactions = normalizeBankTransactions(safeJsonParse(SafeStorage.getItem('alcantara_bank_transactions'), []));
                const displayName = record.personType === 'PJ' ? (record.storeName || 'Loja') : (record.customerName || 'Cliente');
                const transaction = {
                    id: txId,
                    area: 'oficina',
                    type: 'entrada',
                    category: 'Assistência',
                    description: `Repasse assistência - ${record.assistance} - ${displayName}`,
                    value,
                    date: record.repasseDueDate,
                    paymentDate: record.repasseDueDate,
                    source: 'assistencia_tecnica',
                    sourceAssistenciaId: record.id,
                    obs: `Finalizada em ${isoToBr(record.finalizedAt)} | Protocolo ${record.partnerProtocol || record.workshopProtocol || 'não informado'}`
                };
                const index = transactions.findIndex(item => item.id === txId || item.sourceAssistenciaId === record.id);
                if (index >= 0) transactions[index] = { ...transactions[index], ...transaction };
                else transactions.unshift(transaction);
                SafeStorage.setItem('alcantara_bank_transactions', JSON.stringify(transactions));
                return { ...record, bankTransactionId: txId };
            };

            const finalizeAssistencia = (record) => {
                try {
                    const value = Number(record.repasseValue || 0);
                    if (value <= 0) {
                        showToast('⚠️ Informe o valor de repasse antes de finalizar', 'warning');
                        handleEdit(record);
                        return;
                    }
                    const finalizedAt = record.finalizedAt || todayIso();
                    const repasseDueDate = record.repasseDueDate || addDaysIso(finalizedAt, 28);
                    let finalized = normalizeRecord({ ...record, status: 'FINALIZADA', finalizedAt, repasseDueDate });
                    finalized = upsertAssistenciaBankEntry(finalized);
                    const next = records.map(item => item.id === record.id ? finalized : item);
                    if (!persistRecords(next)) return;
                    setRecords(next);
                    showToast(`✅ Assistência finalizada. Repasse no Bank em ${isoToBr(repasseDueDate)}`, 'success');
                } catch (error) {
                    console.error('Erro ao finalizar assistência:', error);
                    showToast('⚠️ Erro ao finalizar assistência', 'error');
                }
            };

            return (
                <div className="animate-fadeIn space-y-4 pb-8">
                    <div className="flex items-center justify-between mb-2">
                        <button type="button" onClick={screen === 'form' ? () => { setScreen('list'); resetForm(); } : onBack} className="btn-icon text-[#6f8f42]" aria-label="Voltar">
                            <i data-lucide="arrow-left" className="w-5 h-5"></i>
                        </button>
                        <div className="text-center flex-1">
                            <h2 className="font-usarmy text-[#6f8f42] text-lg">ASSISTÊNCIA TÉCNICA</h2>
                            <p className="text-[9px] text-gray-500 tracking-[0.25em]">{screen === 'form' ? 'CADASTRO DE PROTOCOLO' : 'LISTA DE ASSISTÊNCIAS'}</p>
                        </div>
                        <div className="w-11"></div>
                    </div>

                    {screen === 'list' ? (
                        <>
                            <div className="os-card rounded-xl p-4 border border-[#6f8f42]/25">
                                <div className="flex items-center gap-3 mb-4">
                                    <div className="w-12 h-12 assistencia-logo-premium logo-premium-animated" aria-hidden="true"></div>
                                    <div>
                                        <p className="font-usarmy text-[#8fb85a] text-sm">PAINEL DE ASSISTÊNCIAS</p>
                                        <p className="text-[10px] text-gray-500">Lista em ordem, busca rápida e acesso ao PDF.</p>
                                    </div>
                                </div>

                                <div className="space-y-3">
                                    <input
                                        type="text"
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                        placeholder="Buscar por assistência, cliente/loja, série, defeito, protocolo, contato ou CNPJ"
                                        className="w-full p-3 rounded-xl"
                                    />
                                    <div className="grid grid-cols-2 gap-3">
                                        <button type="button" onClick={() => setSearchTerm('')} className="p-3 rounded-xl border border-white/10 text-gray-400 font-usarmy text-xs">LIMPAR BUSCA</button>
                                        <button type="button" onClick={openCreate} className="p-3 rounded-xl text-white font-usarmy text-xs border border-[#8fb85a]/40" style={{ background: 'linear-gradient(135deg, #4e6b2f 0%, #5d7a37 50%, #6f8f42 100%)' }}>+ NOVA ASSISTÊNCIA</button>
                                    </div>
                                </div>
                            </div>

                            <div className="os-card rounded-xl p-4 border border-white/5">
                                <div className="flex items-center justify-between mb-3">
                                    <p className="font-usarmy text-[#d4af37] text-xs">REGISTROS DE ASSISTÊNCIA</p>
                                    <span className="results-count">{filteredRecords.length} REGISTROS</span>
                                </div>

                                {filteredRecords.length === 0 ? (
                                    <div className="text-center py-10">
                                        <i data-lucide="clipboard-list" className="w-12 h-12 text-gray-700 mx-auto mb-3"></i>
                                        <p className="font-usarmy text-[10px] text-gray-500">{records.length === 0 ? 'NENHUMA ASSISTÊNCIA CADASTRADA' : 'NENHUM REGISTRO ENCONTRADO NA BUSCA'}</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 gap-3">
                                        {filteredRecords.map(record => {
                                            const activeProtocol = record.partnerProtocol || record.workshopProtocol || 'EM ABERTO';
                                            const displayName = record.personType === 'PJ'
                                                ? (record.storeName || 'Loja não informada')
                                                : (record.customerName || 'Cliente não informado');

                                            return (
                                                <div key={record.id} className="rounded-xl border border-[#6f8f42]/20 bg-gradient-to-br from-[#17210d] to-slate-950 p-3">
                                                    <button type="button" onClick={() => handleEdit(record)} className="w-full text-left">
                                                        <div className="flex items-start justify-between gap-3">
                                                            <div className="min-w-0">
                                                                <div className="flex items-center gap-2 flex-wrap">
                                                                    <p className="font-usarmy text-[#8fb85a] text-xs">{record.assistance}</p>
                                                                    <span className="text-[9px] uppercase tracking-[0.2em] text-[#6f8f42]">{record.personType === 'PJ' ? 'PJ' : 'PF'}</span>
                                                                </div>
                                                                <p className="text-[10px] text-gray-300 mt-1 truncate">{displayName}</p>
                                                                <p className="text-[10px] text-gray-400 mt-1">Série: {record.serialNumber}</p>
                                                                <p className="text-[10px] text-gray-400 mt-1">Protocolo: {activeProtocol}</p>
                                                                {record.personType === 'PF' ? (
                                                                    <p className="text-[10px] text-gray-500 mt-1 truncate">{record.customerWhatsapp || record.customerEmail || 'Cliente sem contato informado'}</p>
                                                                ) : (
                                                                    <p className="text-[10px] text-gray-500 mt-1 truncate">CNPJ: {record.storeCnpj || 'Não informado'}</p>
                                                                )}
                                                            </div>
                                                            <div className="text-right shrink-0">
                                                                <p className="text-[9px] text-gray-500">{record.date}</p>
                                                                <div className={`mt-2 px-2 py-1 rounded-lg border font-usarmy text-[9px] ${ASSIST_STATUS[record.status]?.cls || ASSIST_STATUS.ABERTA.cls}`}>
                                                                    {ASSIST_STATUS[record.status]?.label || 'ABERTA'}
                                                                </div>
                                                                {record.repasseValue ? <p className="text-[9px] text-[#d4af37] mt-2">Repasse: {brMoney(record.repasseValue)}</p> : null}
                                                                {record.repasseDueDate ? <p className="text-[9px] text-gray-500 mt-1">Bank: {isoToBr(record.repasseDueDate)}</p> : null}
                                                            </div>
                                                        </div>
                                                    </button>
                                                    <div className="grid grid-cols-4 gap-2 mt-3">
                                                        <button type="button" onClick={() => generateAssistenciaPDF(record)} className="p-2 rounded-lg border border-[#8fb85a]/30 text-[#8fb85a] font-usarmy text-[10px]">PDF</button>
                                                        <button type="button" onClick={() => finalizeAssistencia(record)} className="p-2 rounded-lg border border-green-500/30 text-green-400 font-usarmy text-[9px] bg-green-500/5">FINALIZAR</button>
                                                        <button type="button" onClick={() => handleEdit(record)} className="p-2 rounded-lg border border-white/10 text-gray-300 font-usarmy text-[10px]">EDITAR</button>
                                                        <button type="button" onClick={() => setConfirmDelete(record.id)} className="p-2 rounded-lg border border-red-500/20 text-red-400 font-usarmy text-[10px] bg-red-500/5">EXCLUIR</button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        </>
                    ) : (
                        <div className="os-card rounded-xl p-4 border border-[#6f8f42]/25">
                            <div className="flex items-center gap-3 mb-4">
                                <div className="w-12 h-12 assistencia-logo-premium logo-premium-animated" aria-hidden="true"></div>
                                <div>
                                    <p className="font-usarmy text-[#8fb85a] text-sm">{editingId ? 'EDITAR ASSISTÊNCIA' : 'CADASTRO DE ASSISTÊNCIA'}</p>                                   
                                </div>
                            </div>

                            <form onSubmit={handleSubmit} action="javascript:void(0)" className="space-y-3">
                                <div className="rounded-xl border border-white/10 p-3 bg-black/20">
                                    <p className="text-[10px] font-usarmy text-[#d4af37] mb-2">TIPO DE CADASTRO</p>
                                    <div className="grid grid-cols-2 gap-2">
                                        <label className={`p-3 rounded-xl border cursor-pointer ${form.personType === 'PF' ? 'border-[#8fb85a] bg-[#6f8f42]/10 text-[#8fb85a]' : 'border-white/10 text-gray-400'}`}>
                                            <input type="radio" className="hidden" checked={form.personType === 'PF'} onChange={() => updateForm({ personType: 'PF' })} />
                                            <span className="font-usarmy text-xs">PESSOA FÍSICA</span>
                                        </label>
                                        <label className={`p-3 rounded-xl border cursor-pointer ${form.personType === 'PJ' ? 'border-[#8fb85a] bg-[#6f8f42]/10 text-[#8fb85a]' : 'border-white/10 text-gray-400'}`}>
                                            <input type="radio" className="hidden" checked={form.personType === 'PJ'} onChange={() => updateForm({ personType: 'PJ' })} />
                                            <span className="font-usarmy text-xs">PESSOA JURÍDICA</span>
                                        </label>
                                    </div>
                                </div>

                                <input type="text" value={form.assistance} onChange={(e) => updateForm({ assistance: e.target.value })} placeholder="Assistência" className="w-full p-3 rounded-xl" />
                                <input type="text" value={form.serialNumber} onChange={(e) => updateForm({ serialNumber: e.target.value })} placeholder="Número de série" className="w-full p-3 rounded-xl" />

                                <div className="rounded-xl border border-white/10 p-3 bg-black/20">
                                    <p className="text-[10px] font-usarmy text-[#d4af37] mb-2">STATUS DA ASSISTÊNCIA</p>
                                    <select value={form.status || 'ABERTA'} onChange={(e) => {
                                        const nextStatus = e.target.value;
                                        updateForm({
                                            status: nextStatus,
                                            finalizedAt: nextStatus === 'FINALIZADA' ? (form.finalizedAt || todayIso()) : form.finalizedAt,
                                            repasseDueDate: nextStatus === 'FINALIZADA' ? (form.repasseDueDate || addDaysIso(form.finalizedAt || todayIso(), 28)) : form.repasseDueDate
                                        });
                                    }} className="w-full p-3 rounded-xl">
                                        {Object.entries(ASSIST_STATUS).map(([key, cfg]) => <option key={key} value={key}>{cfg.label}</option>)}
                                    </select>
                                </div>

                                {form.personType === 'PF' ? (
                                    <>
                                        <textarea value={form.defectReport} onChange={(e) => updateForm({ defectReport: e.target.value })} placeholder="Defeito relatado" className="w-full p-3 rounded-xl min-h-[92px]" />
                                        <input type="text" value={form.customerName} onChange={(e) => updateForm({ customerName: e.target.value })} placeholder="Nome do cliente" className="w-full p-3 rounded-xl" />
                                        <input type="email" value={form.customerEmail} onChange={(e) => updateForm({ customerEmail: e.target.value })} placeholder="E-mail do cliente" className="w-full p-3 rounded-xl" />
                                        <PhoneInput value={form.customerWhatsapp} onChange={(value) => updateForm({ customerWhatsapp: value })} placeholder="WhatsApp do cliente" className="w-full p-3 rounded-xl" />
                                        <div>
                                            <p className="text-[10px] font-usarmy text-[#d4af37] mb-2">QUEM ENTREGOU O PRODUTO?</p>
                                            <div className="grid grid-cols-1 gap-2 sm:grid-cols-3">
                                                {['CLIENTE', 'REPRESENTANTE', 'TRANSPORTE'].map(option => (
                                                    <label key={option} className={`p-3 rounded-xl border cursor-pointer text-center ${form.deliveredBy === option ? 'border-[#8fb85a] bg-[#6f8f42]/10 text-[#8fb85a]' : 'border-white/10 text-gray-400'}`}>
                                                        <input type="radio" className="hidden" checked={form.deliveredBy === option} onChange={() => updateForm({ deliveredBy: option })} />
                                                        <span className="font-usarmy text-[10px]">{option}</span>
                                                    </label>
                                                ))}
                                            </div>
                                        </div>
                                    </>
                                ) : (
                                    <>
                                        <input type="text" value={form.storeCnpj} onChange={(e) => updateForm({ storeCnpj: normalizeCnpj(e.target.value) })} placeholder="CNPJ da loja" className="w-full p-3 rounded-xl" />
                                        <input type="text" value={form.storeName} onChange={(e) => updateForm({ storeName: e.target.value })} placeholder="Nome do cliente/loja" className="w-full p-3 rounded-xl" />
                                        <label className="flex items-center gap-3 rounded-xl border border-white/10 p-3 cursor-pointer">
                                            <input type="checkbox" checked={!!form.isWholesale} onChange={(e) => updateForm({ isWholesale: e.target.checked })} />
                                            <span className="font-usarmy text-xs text-gray-300">Lojista de atacado</span>
                                        </label>
                                    </>
                                )}

                                <div className="rounded-xl border border-[#d4af37]/20 p-3 bg-[#d4af37]/5 space-y-3">
                                    <p className="text-[10px] font-usarmy text-[#d4af37]">REPASSE DA ASSISTÊNCIA PARA O BANK</p>
                                    <div className="grid grid-cols-1 gap-3 sm:grid-cols-3">
                                        <input type="text" inputMode="decimal" step="0.01" min="0" value={form.repasseValue} onChange={(e) => updateForm({ repasseValue: e.target.value })} placeholder="Valor de repasse" className="w-full p-3 rounded-xl" />
                                        <input type="date" value={form.finalizedAt || ''} onChange={(e) => updateForm({ finalizedAt: e.target.value, repasseDueDate: addDaysIso(e.target.value, 28) })} className="w-full p-3 rounded-xl" />
                                        <input type="date" value={form.repasseDueDate || ''} onChange={(e) => updateForm({ repasseDueDate: e.target.value })} className="w-full p-3 rounded-xl" />
                                    </div>
                                    <p className="text-[10px] text-gray-500">Ao finalizar, o app lança automaticamente uma entrada no Alcantara Bank com vencimento/pagamento 28 dias após a finalização.</p>
                                </div>

                                <div className="grid grid-cols-1 gap-3 sm:grid-cols-2">
                                    <input type="text" value={form.workshopProtocol} onChange={(e) => updateForm({ workshopProtocol: e.target.value })} placeholder="Protocolo provisório da oficina" className="w-full p-3 rounded-xl" />
                                    <input type="text" value={form.partnerProtocol} onChange={(e) => updateForm({ partnerProtocol: e.target.value })} placeholder="Número de protocolo do parceiro (em aberto)" className="w-full p-3 rounded-xl" />
                                </div>

                                <p className="text-[10px] text-gray-500 -mt-1">
                                    O PDF usa o protocolo do parceiro quando existir. Se não existir, permanece o protocolo provisório da oficina.
                                </p>

                                <div className="grid grid-cols-2 gap-3">
                                    <button type="button" onClick={() => { resetForm(); setScreen('list'); }} className="p-3 rounded-xl border border-white/10 text-gray-400 font-usarmy text-xs">CANCELAR</button>
                                    <button type="submit" className="p-3 rounded-xl text-white font-usarmy text-xs border border-[#8fb85a]/40" style={{ background: 'linear-gradient(135deg, #4e6b2f 0%, #5d7a37 50%, #6f8f42 100%)' }}>
                                        {editingId ? 'SALVAR' : 'CADASTRAR'}
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}

                    {confirmDelete && (
                        <div className="modal-overlay" onClick={() => setConfirmDelete(null)}>
                            <div className="modal-content p-6" onClick={e => e.stopPropagation()}>
                                <p className="font-usarmy text-[#d4af37] text-sm mb-2">EXCLUIR ASSISTÊNCIA</p>
                                <p className="text-gray-400 text-sm mb-6">Tem certeza? Esta ação não pode ser desfeita.</p>
                                <div className="grid grid-cols-2 gap-3">
                                    <button type="button" onClick={() => setConfirmDelete(null)} className="p-3 rounded-xl border border-white/10 text-gray-400 font-usarmy text-xs">CANCELAR</button>
                                    <button type="button" onClick={() => handleDelete(confirmDelete)} className="p-3 rounded-xl bg-red-500/20 border border-red-500/30 text-red-400 font-usarmy text-xs">EXCLUIR</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };


// ========== COMPONENTE PRINCIPAL ==========


        // ========== ALCANTARA TECH — DASHBOARD NATIVO ALCANTARA ==========
        const AlcantaraTechIntegrated = ({ onBack }) => {
            const [techView, setTechView] = useState(() => {
                const directView = SafeStorage.getItem('__alcantara_tech_direct_view');
                if (directView) {
                    SafeStorage.removeItem('__alcantara_tech_direct_view');
                    return directView;
                }
                return 'home';
            });
            const [energyForm, setEnergyForm] = useState({ mode: 'fps', weight: '0.20', value: '350' });
            const [rofForm, setRofForm] = useState({ rpm: '30000', ratio: '18', efficiency: '78' });
            const [volumeForm, setVolumeForm] = useState({ cylDiameter: '23.8', cylLength: '72', barrelDiameter: '6.03', barrelLength: '300' });
            const [springForm, setSpringForm] = useState({ currentFps: '330', targetFps: '380' });
            const TECH_MAINTENANCE_KEY = 'alcantara_tech_maintenances';
            const emptyMaintenanceForm = { brand: '', model: '', serial: '', notes: '' };
            const [maintenanceForm, setMaintenanceForm] = useState(emptyMaintenanceForm);
            const [maintenances, setMaintenances] = useState(() => asArray(safeJsonParse(SafeStorage.getItem(TECH_MAINTENANCE_KEY), [])));
            const [selectedMaintenanceId, setSelectedMaintenanceId] = useState(null);
            const [editingMaintenanceId, setEditingMaintenanceId] = useState(null);
            const [maintenanceSearch, setMaintenanceSearch] = useState('');

                    ms = rawValue * 0.3048;
                    joule = 0.5 * weightKg * ms * ms;
                } else if (energyForm.mode === 'ms') {

                } else {

                    <InfoCard icon="settings-2" title="GEARBOX V3" tag="AK / G36">Observe montagem do gatilho, seletor externo, gaiola do motor e passagem dos fios para evitar esmagamento.</InfoCard>
                    <InfoCard icon="package" title="SHOTGUN / GBB / HPA" tag="ESPECIAL">Separe por sistema. Em GBB priorize vedação, lubrificação correta e peças de ciclo. Em HPA valide linha, regulador e pressão.</InfoCard>
                </div>
            );

            const renderEletrica = () => (
                <div className="p-4 space-y-4 animate-fadeIn">
                    <TechHeader title="ELÉTRICA" subtitle="BATERIA, MOSFET E RESPOSTA" backHome />
                    <InfoCard icon="battery-charging" title="BATERIA" tag="TESTE" tone="green">Verifique tensão, C-rating, conector e queda sob carga. Bateria fraca simula motor ruim e falha de ciclo.</InfoCard>
                    <InfoCard icon="zap" title="MOSFET" tag="PROTEÇÃO" tone="red">Protege contatos, melhora resposta e permite recursos como active brake e pré-cocking quando compatível.</InfoCard>
                    <InfoCard icon="cable" title="FIAÇÃO E CONECTORES" tag="PERDA" tone="gold">Cabos finos, conector ruim e solda fria geram aquecimento e perda de desempenho. Prefira conexão firme e isolamento limpo.</InfoCard>

                </div>
            );

            const renderPrecisao = () => (
                <div className="p-4 space-y-4 animate-fadeIn">
                    <TechHeader title="PRECISÃO" subtitle="HOP-UP, CANO E CONSISTÊNCIA" backHome />
                    <InfoCard icon="target" title="HOP-UP" tag="ALCANCE">Bucking, nub e pressão correta definem o backspin. Ajuste exagerado rouba energia e instabiliza trajetória.</InfoCard>
                    <InfoCard icon="ruler" title="CANO INTERNO" tag="AGRUPAMENTO" tone="green">Limpeza, centralização e compatibilidade com o bucking importam mais que apenas comprimento.</InfoCard>
                    <InfoCard icon="gauge" title="CONSISTÊNCIA" tag="FPS" tone="blue">Variação baixa de FPS indica vedação boa. Se há oscilação, revise nozzle, bucking e conjunto de compressão.</InfoCard>
                    <InfoCard icon="crosshair" title="BB E PESO" tag="CAMPO" tone="gold">BB mais pesada pode melhorar estabilidade, desde que o volume e hop-up suportem o setup.</InfoCard>
                </div>
            );

            const renderProjetos = () => (
                <div className="p-4 space-y-4 animate-fadeIn">
                    <TechHeader title="PROJETOS" subtitle="IDEIAS E MODS DE OFICINA" backHome />
                    {projectData.map((p, i) => (
                        <InfoCard key={p.title} icon={i % 2 ? 'cpu' : 'flask-conical'} title={p.title} tag="PROJETO" tone={i % 2 ? 'blue' : 'green'}>
                            {p.text}
                        </InfoCard>
                    ))}
                </div>
            );

            const renderFaq = () => (
                <div className="p-4 space-y-4 animate-fadeIn">
                    <TechHeader title="FAQ / QNA" subtitle="RESPOSTAS RÁPIDAS NA BANCADA" backHome />
                    {faqData.map(item => (
                        <div key={item.q} className="os-card rounded-xl p-4 border border-white/5">
                            <p className="font-usarmy text-[#d4af37] text-xs">{item.q}</p>
                            <p className="text-xs text-gray-400 mt-2 leading-5">{item.a}</p>
                        </div>
                    ))}
                </div>
            );

            const renderLinks = () => {
                const selectedMaintenance = maintenances.find(item => item.id === selectedMaintenanceId);
                const query = maintenanceSearch.trim().toLowerCase();
                const filteredMaintenances = maintenances.filter(item => {
                    if (!query) return true;
                    return [item.brand, item.model, item.serial, item.notes].some(value => String(value || '').toLowerCase().includes(query));
                });

                if (selectedMaintenance) {
                    return (
                        <div className="p-4 space-y-4 animate-fadeIn">
                            <TechHeader title="FICHA TÉCNICA" subtitle="DADOS SALVOS DO EQUIPAMENTO" backHome />
                            <div className="os-card rounded-2xl p-5 border border-cyan-400/20">
                                <div className="flex items-start justify-between gap-3 mb-4">
                                    <div className="min-w-0">
                                        <p className="font-usarmy text-cyan-300 text-xs tracking-widest">{selectedMaintenance.brand || 'MARCA NÃO INFORMADA'}</p>
                                        <h3 className="font-usarmy text-[#d4af37] text-xl mt-1 break-words">{selectedMaintenance.model}</h3>
                                    </div>
                                    <div className="w-12 h-12 rounded-2xl bg-cyan-400/10 border border-cyan-400/25 flex items-center justify-center flex-shrink-0">
                                        <i data-lucide="clipboard-list" className="w-6 h-6 text-cyan-300"></i>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 gap-3 text-sm">
                                    <div className="bg-black/30 rounded-xl p-4 border border-white/5">
                                        <p className="text-[9px] text-gray-500 font-mono mb-1">MARCA</p>
                                        <p className="text-white font-bold">{selectedMaintenance.brand || 'Não informado'}</p>
                                    </div>
                                    <div className="bg-black/30 rounded-xl p-4 border border-white/5">
                                        <p className="text-[9px] text-gray-500 font-mono mb-1">MODELO</p>
                                        <p className="text-white font-bold">{selectedMaintenance.model}</p>
                                    </div>
                                    <div className="bg-black/30 rounded-xl p-4 border border-white/5">
                                        <p className="text-[9px] text-gray-500 font-mono mb-1">NÚMERO DE SÉRIE</p>
                                        <p className="text-white font-bold">{selectedMaintenance.serial || 'Não informado'}</p>
                                    </div>
                                    <div className="bg-black/30 rounded-xl p-4 border border-white/5">
                                        <p className="text-[9px] text-gray-500 font-mono mb-1">OBSERVAÇÕES DA MANUTENÇÃO</p>
                                        <p className="text-gray-300 leading-6 whitespace-pre-wrap">{selectedMaintenance.notes || 'Sem observações cadastradas.'}</p>
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-3 mt-5">
                                    <button onClick={() => editMaintenanceRecord(selectedMaintenance)} className="p-4 rounded-xl border border-[#d4af37]/25 bg-[#d4af37]/10 text-[#d4af37] font-usarmy text-xs">EDITAR</button>
                                    <button onClick={() => deleteMaintenanceRecord(selectedMaintenance.id)} className="p-4 rounded-xl border border-red-500/30 bg-red-500/10 text-red-400 font-usarmy text-xs">EXCLUIR</button>
                                </div>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="p-4 space-y-4 animate-fadeIn">
                        <TechHeader title="REFERÊNCIAS" subtitle="CADASTRO TÉCNICO DE EQUIPAMENTOS" backHome />
                        <div className="os-card rounded-2xl p-5 border border-[#d4af37]/15">
                            <p className="font-usarmy text-[#d4af37] text-sm mb-2">NOVO CADASTRO</p>
                            <p className="text-xs text-gray-500 leading-5 mb-4">Dados básicos para abrir a ficha individual do equipamento.</p>
                            <div className="space-y-3">
                                <input value={maintenanceForm.brand} onChange={e => setMaintenanceField('brand', e.target.value)} className="w-full p-4 rounded-2xl text-base" placeholder="Marca" />
                                <input value={maintenanceForm.model} onChange={e => setMaintenanceField('model', e.target.value)} className="w-full p-4 rounded-2xl text-base" placeholder="Modelo do equipamento *" />
                                <input value={maintenanceForm.serial} onChange={e => setMaintenanceField('serial', e.target.value)} className="w-full p-4 rounded-2xl text-base" placeholder="Número de série (se tiver)" />
                                <textarea value={maintenanceForm.notes} onChange={e => setMaintenanceField('notes', e.target.value)} className="w-full p-4 rounded-2xl text-base min-h-[140px] resize-y" placeholder="Observações da manutenção"></textarea>
                            </div>
                            <div className="grid grid-cols-2 gap-3 mt-4">
                                <button onClick={clearMaintenanceForm} className="p-4 rounded-2xl border border-white/10 text-gray-300 font-usarmy text-xs">LIMPAR</button>
                                <button onClick={saveMaintenanceRecord} className="p-4 rounded-2xl gold-gradient font-usarmy text-xs">{editingMaintenanceId ? 'ATUALIZAR' : 'SALVAR'}</button>
                            </div>
                        </div>

                        <div className="os-card rounded-2xl p-5 border border-cyan-400/10">
                            <div className="flex items-center justify-between gap-3 mb-4">
                                <div>
                                    <p className="font-usarmy text-cyan-300 text-sm">EQUIPAMENTOS CADASTRADOS</p>
                                    <p className="text-xs text-gray-500 mt-1">Clique no card para abrir a aba exclusiva.</p>
                                </div>
                                <div className="w-12 h-12 rounded-full bg-cyan-400/10 border border-cyan-400/25 flex items-center justify-center text-cyan-300 font-usarmy">{maintenances.length}</div>
                            </div>
                            <input value={maintenanceSearch} onChange={e => setMaintenanceSearch(e.target.value)} className="w-full p-4 rounded-2xl text-sm mb-4" placeholder="Buscar por marca, modelo, série ou observação" />
                            <div className="space-y-3">
                                {filteredMaintenances.map(item => (
                                    <button key={item.id} onClick={() => setSelectedMaintenanceId(item.id)} className="w-full text-left os-card rounded-xl p-4 border border-white/5 active:scale-[0.99] transition-all">
                                        <div className="flex items-center justify-between gap-3">
                                            <div className="min-w-0">
                                                <p className="font-usarmy text-[#d4af37] text-sm truncate">{item.model}</p>
                                                <p className="text-xs text-gray-400 mt-1 truncate">{item.brand || 'Marca não informada'}</p>
                                                {item.serial && <p className="text-[10px] text-gray-600 font-mono mt-1 truncate">SÉRIE: {item.serial}</p>}
                                            </div>
                                            <i data-lucide="chevron-right" className="w-5 h-5 text-cyan-300 flex-shrink-0"></i>
                                        </div>
                                    </button>
                                ))}
                                {filteredMaintenances.length === 0 && (
                                    <div className="text-center py-10 border border-dashed border-white/10 rounded-xl">
                                        <p className="font-usarmy text-gray-600 text-xs">NENHUM EQUIPAMENTO CADASTRADO</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            const views = {
                home: renderHome,
                calculadoras: renderCalculadoras,
                guias: renderGuias,
                desmontagem: renderDesmontagem,
                eletrica: renderEletrica,
                precisao: renderPrecisao,
                projetos: renderProjetos,
                faq: renderFaq,
                links: renderLinks
            };

            return (views[techView] || renderHome)();
        };


        const App = () => {
            const { state, dispatch } = useDb();
            const { confirm: confirmDialog, modal: confirmModal } = useConfirm();
            const [isAuth, setIsAuth] = useState(SafeStorage.getItem('alcantara_auth') === 'true');
            const [view, setView] = useState('dashboard');
            const orders = state.orders;
            const [selectedOrder, setSelectedOrder] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [orderListStageFilter, setOrderListStageFilter] = useState('TODOS');
            const [orderListPaymentFilter, setOrderListPaymentFilter] = useState('TODOS');
            const [installPrompt, setInstallPrompt] = useState(null);
            const [showInstallButton, setShowInstallButton] = useState(false);
            const [isStandalone, setIsStandalone] = useState(false);

            useEffect(() => {
                if (view === 'create') {
                    const goTop = () => {
                        try {
                            window.scrollTo({ top: 0 });
                        } catch (e) {
                            window.scrollTo(0, 0);
                        }
                    };
                    goTop();
                    requestAnimationFrame(goTop);
                    setTimeout(goTop, 120);
                }
            }, [view]);

            useEffect(() => {
                const checkStandalone = () => {
                    const isStandaloneMode = window.matchMedia('(display-mode: standalone)').matches || 
                                            window.navigator.standalone === true ||
                                            document.referrer.includes('android-app://');
                    setIsStandalone(isStandaloneMode);
                    setShowInstallButton(!isStandaloneMode && installPrompt !== null);
                };

                checkStandalone();

                const mediaQuery = window.matchMedia('(display-mode: standalone)');
                mediaQuery.addEventListener('change', checkStandalone);

                return () => mediaQuery.removeEventListener('change', checkStandalone);
            }, [installPrompt]);

            // orders vêm do DbContext (reativo)

            useEffect(() => {
                if (isAuth && view !== 'alcantara_bank' && typeof lucide !== 'undefined') {
                    const timer = setTimeout(() => {
                        try {
                            lucide.createIcons();
                        } catch (e) {
                            console.log('Erro ao criar ícones:', e);
                        }
                    }, 100);
                    return () => clearTimeout(timer);
                }
            }, [isAuth, view]);

            useEffect(() => {
                const handleBeforeInstallPrompt = (e) => {
                    e.preventDefault();
                    setInstallPrompt(e);
                    if (!isStandalone) {
                        setShowInstallButton(true);
                    }
                };

                window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);

                return () => {
                    window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
                };
            }, [isStandalone]);

            const handleInstallClick = async () => {
                if (!installPrompt) return;

                installPrompt.prompt();

                const { outcome } = await installPrompt.userChoice;

                if (outcome === 'accepted') {
                    showToast("✅ App instalado com sucesso!", "success");
                    setShowInstallButton(false);
                    setIsStandalone(true);
                } else {
                    showToast("❌ Instalação cancelada", "info");
                }

                setInstallPrompt(null);
            };

            useEffect(() => {
                if (!isAuth) return;

                let isProcessing = false;

                const handleBackButton = (e) => {
                    if (isProcessing) return;
                    isProcessing = true;

                    e.preventDefault();

                    switch (view) {
                        case 'dashboard':
                            showToast('Você já está no painel principal', 'info');
                            window.history.pushState({ view: 'dashboard', locked: true, timestamp: Date.now() }, '', window.location.href);
                            break;

                        case 'list':
                            setView('dashboard');
                            break;

                        case 'create':
                            if (selectedOrder) {
                                setView('detail');
                            } else {
                                setView('dashboard');
                            }
                            break;

                        case 'detail':
                            setView('list');
                            setSelectedOrder(null);
                            break;

                        case 'catalog':
                        case 'products':
                        case 'clients_list':
                        case 'tools':
                        case 'management':
                        case 'gestao_home':
                        case 'calculadoras_hub':
                        case 'profit_analysis':
                        case 'bench_shortcut':
                        case 'assistencia_tecnica':
                        case 'fornecedores':
                            setView('dashboard');
                            break;

                        case 'alcantara_tech':
                            if (window.__alcantaraTechBack && window.__alcantaraTechBack()) {
                                // Back físico tratado dentro da Área Tech: subpágina -> Área Tech.
                            } else {
                                setView('dashboard');
                            }
                            break;

                        case 'tech_calculadora':
                            setView('calculadoras_hub');
                            break;

                        case 'gestao_calculadora':
                        case 'gestao_fornecedores':
                        case 'gestao_pecas':
                        case 'gestao_ferramentas':
                            setView('calculadoras_hub');
                            break;

                        default:
                            setView('dashboard');
                    }

                    setTimeout(() => { isProcessing = false; }, 100);
                };

                const pushState = () => {
                    window.history.pushState({ view: view, timestamp: Date.now() }, '', window.location.href);
                };

                pushState();

                const handlePopState = (e) => {
                    handleBackButton(e);
                    setTimeout(pushState, 0);
                };

                window.addEventListener('popstate', handlePopState);

                const handleDeviceBack = (e) => {
                    e.preventDefault();
                    handleBackButton(e);
                };

                document.addEventListener('backbutton', handleDeviceBack, false);

                return () => {
                    window.removeEventListener('popstate', handlePopState);
                    document.removeEventListener('backbutton', handleDeviceBack, false);
                };
            }, [isAuth, view, selectedOrder]);

            if (!isAuth) return <Login onLogin={() => setIsAuth(true)} />;

            const filteredOrders = orders.filter(o => 
                o.customerName?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                o.equipment?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                o.osNumber?.includes(searchTerm)
            );

            const getClientList = () => {
                const uniqueClients = new Map();

                orders.forEach(order => {
                    if (order.customerName && !uniqueClients.has(order.customerName)) {
                        uniqueClients.set(order.customerName, {
                            name: order.customerName,
                            phone: order.customerPhone || 'Não informado'
                        });
                    }
                });

                return Array.from(uniqueClients.values()).sort((a, b) => a.name.localeCompare(b.name));
            };

            const clients = getClientList();

            return (
                <div className="min-h-screen pb-24">
                    {showInstallButton && !isStandalone && (
                        <button 
                            onClick={handleInstallClick}
                            className="install-prompt"
                        >
                            <i data-lucide="download" className="w-5 h-5"></i>
                            <span>INSTALAR APP NA ÁREA DE TRABALHO</span>
                        </button>
                    )}

                    <header className="p-4 border-b border-white/5 bg-black/90 backdrop-blur-sm flex items-center justify-between sticky top-0 z-50">
                        <div className="flex items-center gap-3">
                            <img src={LOGO_URL} className="w-10 h-10 rounded-full border border-[#d4af37]/30 logo-premium-animated" alt="Logo" />
                            <div>
                                <h1 className="font-usarmy text-[#d4af37] text-sm">ALCANTARA ARMEIRO</h1>
                                <p className="text-[8px] text-gray-500">SISTEMA PRO V20.0</p>
                            </div>
                        </div>
                        <button
                            onClick={async () => {
                                const ok = await confirmDialog({
                                    message: 'SAIR DO SISTEMA?',
                                    subMessage: 'Sua sessão será encerrada.',
                                    confirmLabel: 'SAIR',
                                    confirmClass: 'bg-red-600 text-white',
                                    icon: 'log-out'
                                });
                                if (ok) { SafeStorage.removeItem('alcantara_auth'); window.location.reload(); }
                            }}
                            className="btn-icon text-red-500"
                            aria-label="Sair do sistema"
                        >
                            <i data-lucide="log-out" className="w-5 h-5"></i>
                        </button>
                    </header>

                    {confirmModal}
                    <main role="main" className="p-4 max-w-lg mx-auto">
                        {view === 'dashboard' && (
                            <Dashboard 
                                orders={orders} 
                                clients={clients}
                                setView={(v) => { 
                                    if(v === 'create') setSelectedOrder(null); 
                                    setView(v); 
                                }}
                                onOpenOrders={({ stage = 'TODOS', payment = 'TODOS' }) => {
                                    setOrderListStageFilter(stage);
                                    setOrderListPaymentFilter(payment);
                                    setView('list');
                                }} 
                            />
                        )}

                        {view === 'list' && (
                            <OrderList 
                                orders={filteredOrders}
                                searchTerm={searchTerm}
                                setSearchTerm={setSearchTerm}
                                initialStageFilter={orderListStageFilter}
                                initialPaymentFilter={orderListPaymentFilter}
                                onSelect={(o) => { setSelectedOrder(o); setView('detail'); }} 
                                onBack={() => setView('dashboard')} 
                            />
                        )}

                        {view === 'create' && (
                            <OrderForm 
                                order={selectedOrder} 
                                onOpenEquipmentHistory={() => setView('equipment_history')} 
                                onSave={(savedOrder) => { 
                                    dispatch({ type: 'LOAD' });
                                    if (savedOrder) setSelectedOrder(savedOrder);
                                    setView(selectedOrder ? 'detail' : 'list'); 
                                }} 
                                onBack={() => setView(selectedOrder ? 'detail' : 'dashboard')} 
                            />
                        )}

                        {view === 'detail' && (
                            <OrderDetail 
                                order={selectedOrder} 
                                onEdit={() => setView('create')} 
                                onBack={() => setView('list')} 
                                onDelete={() => {
                                    dispatch({ type: 'DELETE_ORDER', id: selectedOrder.id });
                                    setView('list');
                                    showToast("🗑️ Ordem excluída", "success");
                                }}
                            />
                        )}

                        {view === 'catalog' && (
                            <CatalogManager onBack={() => setView('dashboard')} />
                        )}

                        {view === 'products' && (
                            <ProductsManager onBack={() => setView('dashboard')} />
                        )}

                        {view === 'clients_list' && (
                            <ClientsList clients={clients} orders={orders} onBack={() => setView('dashboard')} />
                        )}

                        {view === 'tools' && (
                            <ToolsManager onBack={() => setView('dashboard')} />
                        )}

                        {view === 'bench_shortcut' && (
                            <BenchShortcut 
                                orders={orders}
                                onBack={() => setView('dashboard')}
                            />
                        )}

                        {view === 'gestao_home' && (
                            <GestaoCalculadora onBack={() => setView('dashboard')} onHome={() => setView('dashboard')} />
                        )}

                        {view === 'calculadoras_hub' && (
                            <CalculadorasHub onBack={() => setView('dashboard')} setView={setView} />
                        )}

                        {view === 'gestao_calculadora' && (
                            <GestaoCalculadora onBack={() => setView('calculadoras_hub')} onHome={() => setView('dashboard')} />
                        )}


                        {view === 'tech_calculadora' && (
                            <TechCalculadora onBack={() => setView('calculadoras_hub')} onHome={() => setView('dashboard')} />
                        )}

                        {view === 'gestao_fornecedores' && (
                            <GestaoCalculadora onBack={() => setView('dashboard')} onHome={() => setView('dashboard')} />
                        )}

                        {view === 'gestao_pecas' && (
                            <GestaoCalculadora onBack={() => setView('dashboard')} onHome={() => setView('dashboard')} />
                        )}

                        {view === 'gestao_ferramentas' && (
                            <GestaoCalculadora onBack={() => setView('dashboard')} onHome={() => setView('dashboard')} />
                        )}


                        {view === 'assistencia_tecnica' && (
                            <AssistenciaTecnica onBack={() => setView('dashboard')} />
                        )}

                        {view === 'fornecedores' && (
                            <Fornecedores onBack={() => setView('dashboard')} />
                        )}

                        {view === 'equipment_history' && (
                            <EquipmentHistoryManager onBack={() => setView('dashboard')} />
                        )}

                        {view === 'alcantara_bank' && (
                            <AlcantaraBankIntegrated 
                                orders={orders}
                                onBack={() => setView('dashboard')}
                                onOpenOrder={(order) => { setSelectedOrder(order); setView('detail'); }}
                            />
                        )}

                        {view === 'alcantara_tech' && (
                            <TechCalculadora onBack={() => setView('calculadoras_hub')} onHome={() => setView('dashboard')} />
                        )}

                        {view === 'profit_analysis' && (
                            <ProfitAnalysis onBack={() => setView('dashboard')} orders={orders} />
                        )}
                    </main>
                </div>
            );
        };


        const CalculadorasHub = ({ onBack, setView }) => {
            useEffect(() => {
                setTimeout(() => { try { if (window.lucide) lucide.createIcons(); } catch (_) {} }, 40);
            }, []);

            const openTechCalculators = () => {
                setView('tech_calculadora');
                try { window.scrollTo({ top: 0 }); } catch (e) { window.scrollTo(0, 0); }
            };

            return (
                <div className="animate-fadeIn space-y-4 pb-10">
                    <button onClick={onBack} className="flex items-center gap-2 text-[#d4af37] mb-2 font-usarmy text-xs">
                        <i data-lucide="arrow-left" className="w-4 h-4"></i> VOLTAR
                    </button>

                    <div className="text-center os-card rounded-xl p-5 border border-white/5">
                        <i data-lucide="calculator" className="w-9 h-9 mx-auto text-[#d4af37] mb-3"></i>
                        <h2 className="font-usarmy text-[#d4af37] text-lg">CALCULADORAS</h2>
                        <p className="text-gray-500 text-xs mt-1">Gestão e Calculadora Tech</p>
                    </div>

                    <button
                        type="button"
                        onClick={() => setView('gestao_calculadora')}

            const [cylinderForm, setCylinderForm] = useState({
                barrelLength: '300',
                barrelDiameter: '6.03',
                cylinderDiameter: '23.8',
                cylinderLength: '72'
            });

            useEffect(() => {
                setTimeout(() => { try { if (window.lucide) lucide.createIcons(); } catch (_) {} }, 40);
            }, []);

            const n = (value) => Number(String(value || '').replace(',', '.')) || 0;
            const round = (value, digits = 2) => Number.isFinite(value) ? value.toFixed(digits) : '0.00';

            const updateCylinder = useCallback((field, value) => {
                setCylinderForm(prev => ({ ...prev, [field]: value }));
            }, []);

            const cylinderResult = useMemo(() => {
                const barrelLength = n(cylinderForm.barrelLength);
                const barrelDiameter = n(cylinderForm.barrelDiameter);
                const cylinderDiameter = n(cylinderForm.cylinderDiameter);
                const cylinderLength = n(cylinderForm.cylinderLength);

                if (!barrelLength || !barrelDiameter || !cylinderDiameter || !cylinderLength) return null;

                const barrelVolume = Math.PI * Math.pow(barrelDiameter / 2, 2) * barrelLength;
                const cylinderVolume = Math.PI * Math.pow(cylinderDiameter / 2, 2) * cylinderLength;
                const ratio = cylinderVolume / barrelVolume;

                let status = 'EQUILIBRADO';
                let text = 'Relação boa para uso geral. Ajuste final depende de vedação, hop-up, bucking, nozzle e potência desejada.';
                let bbs = '0.28g a 0.32g';
                let bbsNote = 'Boa faixa para precisão com volume equilibrado.';

                if (ratio < 1.60) {
                    status = 'VOLUME BAIXO';
                    text = 'O cilindro está com pouco volume para esse cano. Pode perder eficiência, principalmente com BB mais pesada.';
                    bbs = '0.20g a 0.25g';
                    bbsNote = 'Evite BB pesada nesse conjunto ou reduza o comprimento do cano/aumente o volume.';
                } else if (ratio < 1.85) {
                    status = 'LEVE / RÁPIDO';
                    text = 'Relação utilizável para configuração mais leve. Funciona melhor com BB média e cano não muito longo.';
                    bbs = '0.25g a 0.28g';
                    bbsNote = 'Boa escolha para resposta rápida e uso mais geral.';
                } else if (ratio < 2.15) {
                    status = 'EQUILIBRADO';
                    text = 'Relação bem equilibrada para a maioria dos setups. Boa eficiência entre volume de cilindro e cano.';
                    bbs = '0.28g a 0.32g';
                    bbsNote = 'Faixa recomendada para precisão e estabilidade.';
                } else if (ratio < 2.50) {
                    status = 'FORTE / BB PESADA';
                    text = 'Volume alto e aproveitável para BB mais pesada, desde que a vedação e o hop-up estejam bem ajustados.';
                    bbs = '0.32g a 0.36g';
                    bbsNote = 'Boa opção para setups de precisão e maior consistência.';
                } else {
                    status = 'VOLUME ALTO';
                    text = 'Volume muito alto para esse cano. Pode haver desperdício de ar, ruído e turbulência se o conjunto não estiver bem casado.';
                    bbs = '0.36g ou mais';
                    bbsNote = 'Use BB pesada somente se o hop-up levantar bem; caso contrário, reduza volume ou ajuste o cano.';
                }

                return { barrelVolume, cylinderVolume, ratio, status, text, bbs, bbsNote };
