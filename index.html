        // ========== NOVO COMPONENTE: ANÁLISE DE LUCRATIVIDADE ==========
        const ProfitAnalysis = ({ onBack, orders }) => {
            const [periodFilter, setPeriodFilter] = useState('thisMonth');
            const [dateRange, setDateRange] = useState({ start: '', end: '' });
            const [activeTab, setActiveTab] = useState('overview');
            const [monthlyGoal, setMonthlyGoal] = useState(() => parseFloat(SafeStorage.getItem('alcantara_profit_goal') || '12000') || 12000);
            const [operationalCost, setOperationalCost] = useState(() => parseFloat(SafeStorage.getItem('alcantara_operational_cost') || '0') || 0);

            const persistGoal = (value) => {
                const normalized = parseFloat(String(value).replace(',', '.')) || 0;
                setMonthlyGoal(normalized);
                SafeStorage.setItem('alcantara_profit_goal', String(normalized));
            };

            const persistOperationalCost = (value) => {
                const normalized = parseFloat(String(value).replace(',', '.')) || 0;
                setOperationalCost(normalized);
                SafeStorage.setItem('alcantara_operational_cost', String(normalized));
            };

            const parseOrderDate = (order) => {
                if (!order?.date) return null;
                const raw = String(order.date);
                if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return new Date(`${raw}T12:00:00`);
                const parts = raw.split('/');
                if (parts.length === 3) return new Date(`${parts[2]}-${parts[1]}-${parts[0]}T12:00:00`);
                const fallback = new Date(raw);
                return Number.isNaN(fallback.getTime()) ? null : fallback;
            };

            const getPeriodDates = (period) => {
                const today = new Date();
                const end = today.toISOString().split('T')[0];
                let start = new Date();

                switch(period) {
                    case '7days':
                        start.setDate(today.getDate() - 7);
                        break;
                    case '30days':
                        start.setDate(today.getDate() - 30);
                        break;
                    case '90days':
                        start.setDate(today.getDate() - 90);
                        break;
                    case 'thisMonth':
                        start = new Date(today.getFullYear(), today.getMonth(), 1);
                        break;
                    case 'lastMonth': {
                        const lastMonthStart = new Date(today.getFullYear(), today.getMonth() - 1, 1);
                        const lastMonthEnd = new Date(today.getFullYear(), today.getMonth(), 0);
                        return { start: lastMonthStart.toISOString().split('T')[0], end: lastMonthEnd.toISOString().split('T')[0] };
                    }
                    case 'thisYear':
                        start = new Date(today.getFullYear(), 0, 1);
                        break;
                    default:
                        return { start: '', end: '' };
                }
                return { start: start.toISOString().split('T')[0], end };
            };

            useEffect(() => {
                if (periodFilter !== 'custom') setDateRange(getPeriodDates(periodFilter));
            }, [periodFilter]);

            const filteredOrders = useMemo(() => {
                const validOrders = asArray(orders).filter(order => order?.status !== 'CANCELADA');
                if (!dateRange.start || !dateRange.end) return validOrders;

                const startDate = new Date(`${dateRange.start}T00:00:00`);
                const endDate = new Date(`${dateRange.end}T23:59:59`);
                return validOrders.filter(order => {
                    const orderDate = parseOrderDate(order);
                    return orderDate && orderDate >= startDate && orderDate <= endDate;
                });
            }, [orders, dateRange]);

            const buildOrderProfit = (order, costPerOrder = 0) => {
                const revenue = calculateTotal(order);
                const discount = calculateDiscount(order);
                const servicesRevenue = asArray(order.services).reduce((acc, item) => acc + (parseFloat(item.price) || 0), 0);
                const partsRevenue = asArray(order.parts).reduce((acc, item) => acc + (parseFloat(item.price) || 0), 0);
                const productsRevenue = asArray(order.products).reduce((acc, item) => acc + (parseFloat(item.price) || 0), 0);
                const partsCost = asArray(order.parts).reduce((acc, item) => acc + getItemCostTotal(item), 0);
                const productsCost = asArray(order.products).reduce((acc, item) => acc + getItemCostTotal(item), 0);
                const grossProfit = servicesRevenue + (partsRevenue - partsCost) + (productsRevenue - productsCost);
                const netProfit = grossProfit - costPerOrder;
                const margin = revenue > 0 ? (netProfit / revenue) * 100 : 0;
                const orderDate = parseOrderDate(order);
                return {
                    order,
                    osNumber: order.osNumber || order.id || '-',
                    customerName: order.customerName || 'Cliente sem nome',
                    equipment: order.equipment || 'Equipamento não informado',
                    revenue,
                    discount,
                    servicesRevenue,
                    partsRevenue,
                    productsRevenue,
                    partsCost,
                    productsCost,
                    realCosts: partsCost + productsCost,
                    grossProfit,
                    operationalCost: costPerOrder,
                    netProfit,
                    margin,
                    date: orderDate
                };
            };

            const financialMetrics = useMemo(() => {
                const activeOrders = filteredOrders;
                const costPerOrder = activeOrders.length > 0 ? operationalCost / activeOrders.length : 0;
                const orderProfits = activeOrders.map(order => buildOrderProfit(order, costPerOrder));

                const serviceBreakdown = {};
                const equipmentBreakdown = {};
                const dailyBreakdown = {};
                const partBreakdown = {};

                orderProfits.forEach(item => {
                    asArray(item.order.services).forEach(service => {
                        const name = service.name || 'Serviço sem nome';
                        const revenue = parseFloat(service.price) || 0;
                        if (!serviceBreakdown[name]) serviceBreakdown[name] = { count: 0, revenue: 0, profit: 0 };
                        serviceBreakdown[name].count += 1;
                        serviceBreakdown[name].revenue += revenue;
                        serviceBreakdown[name].profit += revenue;
                    });

                    asArray(item.order.parts).forEach(part => {
                        const name = part.name || 'Peça sem nome';
                        const revenue = parseFloat(part.price) || 0;
                        const cost = getItemCostTotal(part);
                        if (!partBreakdown[name]) partBreakdown[name] = { count: 0, revenue: 0, cost: 0, profit: 0 };
                        partBreakdown[name].count += 1;
                        partBreakdown[name].revenue += revenue;
                        partBreakdown[name].cost += cost;
                        partBreakdown[name].profit += revenue - cost;
                    });

                    const equip = item.equipment;
                    if (!equipmentBreakdown[equip]) equipmentBreakdown[equip] = { count: 0, revenue: 0, profit: 0 };
                    equipmentBreakdown[equip].count += 1;
                    equipmentBreakdown[equip].revenue += item.revenue;
                    equipmentBreakdown[equip].profit += item.netProfit;

                    if (item.date) {
                        const key = item.date.toISOString().slice(0, 10);
                        if (!dailyBreakdown[key]) dailyBreakdown[key] = { revenue: 0, profit: 0, count: 0 };
                        dailyBreakdown[key].revenue += item.revenue;
                        dailyBreakdown[key].profit += item.netProfit;
                        dailyBreakdown[key].count += 1;
                    }
                });

                const totals = orderProfits.reduce((acc, item) => {
                    acc.totalRevenue += item.revenue;
                    acc.totalDiscounts += item.discount;
                    acc.totalServices += item.servicesRevenue;
                    acc.totalParts += item.partsRevenue;
                    acc.totalProducts += item.productsRevenue;
                    acc.totalPartsCost += item.partsCost;
                    acc.totalProductsCost += item.productsCost;
                    acc.totalGrossProfit += item.grossProfit;
                    acc.totalNetProfit += item.netProfit;
                    return acc;
                }, {
                    totalRevenue: 0,
                    totalDiscounts: 0,
                    totalServices: 0,
                    totalParts: 0,
                    totalProducts: 0,
                    totalPartsCost: 0,
                    totalProductsCost: 0,
                    totalGrossProfit: 0,
                    totalNetProfit: 0
                });

                const totalRealCosts = totals.totalPartsCost + totals.totalProductsCost + operationalCost;
                const margin = totals.totalRevenue > 0 ? (totals.totalNetProfit / totals.totalRevenue) * 100 : 0;
                const goalProgress = monthlyGoal > 0 ? Math.min(100, (totals.totalNetProfit / monthlyGoal) * 100) : 0;
                const lowMarginOrders = orderProfits
                    .filter(item => item.revenue > 0 && item.margin < 25)
                    .sort((a, b) => a.margin - b.margin)
                    .slice(0, 5);

                return {
                    ...totals,
                    totalRealCosts,
                    operationalCost,
                    costPerOrder,
                    orderProfits,
                    totalOrders: orderProfits.length,
                    avgTicket: orderProfits.length ? totals.totalRevenue / orderProfits.length : 0,
                    margin,
                    goalProgress,
                    remainingGoal: Math.max(0, monthlyGoal - totals.totalNetProfit),
                    topOrders: [...orderProfits].sort((a, b) => b.netProfit - a.netProfit).slice(0, 5),
                    lowMarginOrders,
                    serviceBreakdown: Object.entries(serviceBreakdown).sort((a,b) => b[1].profit - a[1].profit).slice(0, 10),
                    partBreakdown: Object.entries(partBreakdown).sort((a,b) => b[1].profit - a[1].profit).slice(0, 10),
                    equipmentBreakdown: Object.entries(equipmentBreakdown).sort((a,b) => b[1].profit - a[1].profit).slice(0, 5),
                    dailyBreakdown: Object.entries(dailyBreakdown).sort((a,b) => a[0].localeCompare(b[0])).slice(-10)
                };
            }, [filteredOrders, monthlyGoal, operationalCost]);

            const formatCurrency = (value) => new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            }).format(Number(value || 0));

            const safePercent = (value) => `${Math.max(0, Math.min(100, Number(value || 0))).toFixed(0)}%`;

            const healthConfig = financialMetrics.margin >= 45
                ? { label: 'SAUDÁVEL', color: 'text-green-400', bg: 'bg-green-500/10', border: 'border-green-500/25', icon: 'shield-check' }
                : financialMetrics.margin >= 25
                    ? { label: 'ATENÇÃO', color: 'text-yellow-400', bg: 'bg-yellow-500/10', border: 'border-yellow-500/25', icon: 'alert-triangle' }
                    : { label: 'CRÍTICO', color: 'text-red-400', bg: 'bg-red-500/10', border: 'border-red-500/25', icon: 'circle-alert' };

            const periodOptions = [
                { value: 'all', label: 'TODOS OS PERÍODOS' },
                { value: '7days', label: 'ÚLTIMOS 7 DIAS' },
                { value: '30days', label: 'ÚLTIMOS 30 DIAS' },
                { value: '90days', label: 'ÚLTIMOS 90 DIAS' },
                { value: 'thisMonth', label: 'ESTE MÊS' },
                { value: 'lastMonth', label: 'MÊS PASSADO' },
                { value: 'thisYear', label: 'ESTE ANO' },
                { value: 'custom', label: 'PERÍODO PERSONALIZADO' }
            ];

            const MetricCard = ({ title, value, subtitle, icon, tone = 'gold' }) => {
                const toneClass = {
                    gold: 'text-[#d4af37] border-[#d4af37]/20 bg-[#d4af37]/10',
                    green: 'text-green-400 border-green-500/20 bg-green-500/10',
                    red: 'text-red-400 border-red-500/20 bg-red-500/10',
                    blue: 'text-blue-400 border-blue-500/20 bg-blue-500/10',
                    yellow: 'text-yellow-400 border-yellow-500/20 bg-yellow-500/10'
                }[tone] || 'text-[#d4af37] border-[#d4af37]/20 bg-[#d4af37]/10';

                return (
                    <div className={`p-4 rounded-xl border ${toneClass}`}>
                        <div className="flex items-center gap-2 mb-2">
                            <i data-lucide={icon} className="w-4 h-4"></i>
                            <p className="text-[9px] font-usarmy">{title}</p>
                        </div>
                        <p className="text-lg font-usarmy text-white leading-tight">{value}</p>
                        {subtitle && <p className="text-[9px] text-gray-500 mt-1">{subtitle}</p>}
                    </div>
                );
            };

            return (
                <div className="space-y-6 animate-fadeIn pb-10">
                    <div className="flex items-center justify-between border-b border-white/10 pb-4">
                        <button type="button" onClick={onBack} className="btn-icon text-[#d4af37]">
                            <i data-lucide="arrow-left" className="w-5 h-5"></i>
                        </button>
                        <h2 className="font-usarmy text-[#d4af37] text-sm">ANÁLISE DE LUCRATIVIDADE PRO</h2>
                        <div className="w-10"></div>
                    </div>

                    <div className="os-card p-4 rounded-xl space-y-4">
                        <div className="flex items-center gap-2">
                            <i data-lucide="calendar" className="w-4 h-4 text-[#d4af37]"></i>
                            <span className="text-[10px] font-usarmy text-gray-500">PERÍODO E METAS</span>
                        </div>

                        <select value={periodFilter} onChange={(e) => setPeriodFilter(e.target.value)} className="w-full p-3 rounded-lg text-sm">
                            {periodOptions.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                        </select>

                        {periodFilter === 'custom' && (
                            <div className="grid grid-cols-2 gap-2">
                                <div>
                                    <label className="text-[9px] text-gray-500 block mb-1">DATA INÍCIO</label>
                                    <input type="date" value={dateRange.start} onChange={(e) => setDateRange({...dateRange, start: e.target.value})} className="w-full p-2 rounded-lg text-sm" />
                                </div>
                                <div>
                                    <label className="text-[9px] text-gray-500 block mb-1">DATA FIM</label>
                                    <input type="date" value={dateRange.end} onChange={(e) => setDateRange({...dateRange, end: e.target.value})} className="w-full p-2 rounded-lg text-sm" />
                                </div>
                            </div>
                        )}

                        <div className="grid grid-cols-2 gap-2">
                            <div>
                                <label className="text-[9px] text-gray-500 block mb-1">META DE LUCRO</label>
                                <input type="text" inputMode="decimal" value={monthlyGoal} onChange={(e) => persistGoal(e.target.value)} className="w-full p-2 rounded-lg text-sm" placeholder="12000" />
                            </div>
                            <div>
                                <label className="text-[9px] text-gray-500 block mb-1">CUSTO OPERACIONAL</label>
                                <input type="text" inputMode="decimal" value={operationalCost} onChange={(e) => persistOperationalCost(e.target.value)} className="w-full p-2 rounded-lg text-sm" placeholder="0" />
                            </div>
                        </div>

                        {dateRange.start && dateRange.end && (
                            <p className="text-[10px] text-center text-[#d4af37]">
                                {new Date(`${dateRange.start}T12:00:00`).toLocaleDateString('pt-BR')} até {new Date(`${dateRange.end}T12:00:00`).toLocaleDateString('pt-BR')}
                            </p>
                        )}
                    </div>

                    <div className="flex gap-2">
                        {[
                            ['overview', 'GERAL'],
                            ['ranking', 'RANKING'],
                            ['breakdown', 'CUSTOS'],
                            ['services', 'SERVIÇOS']
                        ].map(([key, label]) => (
                            <button key={key} onClick={() => setActiveTab(key)} className={`flex-1 py-3 px-2 rounded-lg text-[10px] font-bold transition-all ${activeTab === key ? 'tab-active' : 'tab-inactive'}`}>
                                {label}
                            </button>
                        ))}
                    </div>

                    {activeTab === 'overview' && (
                        <div className="space-y-4">
                            <div className={`p-4 rounded-xl border ${healthConfig.bg} ${healthConfig.border}`}>
                                <div className="flex items-center justify-between gap-3">
                                    <div className="flex items-center gap-3">
                                        <i data-lucide={healthConfig.icon} className={`w-5 h-5 ${healthConfig.color}`}></i>
                                        <div>
                                            <p className="text-[9px] text-gray-500 font-usarmy">SAÚDE DA OPERAÇÃO</p>
                                            <p className={`text-lg font-usarmy ${healthConfig.color}`}>{healthConfig.label}</p>
                                        </div>
                                    </div>
                                    <div className="text-right">
                                        <p className="text-[9px] text-gray-500">Margem líquida</p>
                                        <p className={`text-xl font-usarmy ${healthConfig.color}`}>{financialMetrics.margin.toFixed(1)}%</p>
                                    </div>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-3">
                                <MetricCard title="LUCRO LÍQUIDO" value={formatCurrency(financialMetrics.totalNetProfit)} subtitle="já desconta custo operacional" icon="badge-dollar-sign" tone="green" />
                                <MetricCard title="FATURAMENTO" value={formatCurrency(financialMetrics.totalRevenue)} subtitle={`${financialMetrics.totalOrders} OS no período`} icon="wallet" tone="gold" />
                                <MetricCard title="CUSTOS REAIS" value={formatCurrency(financialMetrics.totalRealCosts)} subtitle={`Peças + produtos + operação`} icon="receipt" tone="red" />
                                <MetricCard title="TICKET MÉDIO" value={formatCurrency(financialMetrics.avgTicket)} subtitle="média por OS" icon="activity" tone="blue" />
                            </div>

                            <div className="os-card p-5 rounded-xl space-y-3">
                                <div className="flex items-center justify-between">
                                    <p className="text-[10px] font-usarmy text-[#d4af37]">META DE LUCRO</p>
                                    <p className="text-[10px] text-gray-400">{safePercent(financialMetrics.goalProgress)}</p>
                                </div>
                                <div className="profit-bar-container h-3">
                                    <div className="profit-bar bg-green-500" style={{ width: safePercent(financialMetrics.goalProgress) }}></div>
                                </div>
                                <div className="flex justify-between text-[10px]">
                                    <span className="text-green-400">{formatCurrency(financialMetrics.totalNetProfit)}</span>
                                    <span className="text-gray-500">Faltam {formatCurrency(financialMetrics.remainingGoal)}</span>
                                    <span className="text-[#d4af37]">{formatCurrency(monthlyGoal)}</span>
                                </div>
                            </div>

                            {financialMetrics.lowMarginOrders.length > 0 && (
                                <div className="os-card p-5 rounded-xl border border-yellow-500/20">
                                    <div className="flex items-center gap-2 mb-3">
                                        <i data-lucide="alert-triangle" className="w-4 h-4 text-yellow-400"></i>
                                        <p className="text-[10px] font-usarmy text-yellow-400">ALERTA DE MARGEM BAIXA</p>
                                    </div>
                                    <div className="space-y-2">
                                        {financialMetrics.lowMarginOrders.map(item => (
                                            <div key={item.osNumber} className="flex justify-between items-center p-3 rounded-lg bg-yellow-500/5 border border-yellow-500/10">
                                                <div>
                                                    <p className="text-xs text-white font-bold">OS #{item.osNumber} • {item.customerName}</p>
                                                    <p className="text-[9px] text-gray-500">{item.equipment}</p>
                                                </div>
                                                <div className="text-right">
                                                    <p className="text-yellow-400 font-mono text-xs">{formatCurrency(item.netProfit)}</p>
                                                    <p className="text-[9px] text-yellow-400">{item.margin.toFixed(1)}%</p>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            <div className="os-card p-5 rounded-xl">
                                <p className="text-[10px] font-usarmy text-[#d4af37] mb-4 text-center">EVOLUÇÃO RECENTE</p>
                                <div className="space-y-3">
                                    {financialMetrics.dailyBreakdown.length === 0 ? (
                                        <p className="text-center text-gray-600 text-sm py-4">Nenhum dado no período</p>
                                    ) : financialMetrics.dailyBreakdown.map(([date, data]) => {
                                        const maxProfit = Math.max(...financialMetrics.dailyBreakdown.map(([,d]) => Math.abs(d.profit)), 1);
                                        return (
                                            <div key={date}>
                                                <div className="flex justify-between text-[10px] mb-1">
                                                    <span className="text-gray-400">{new Date(`${date}T12:00:00`).toLocaleDateString('pt-BR')}</span>
                                                    <span className={data.profit >= 0 ? 'text-green-400' : 'text-red-400'}>{formatCurrency(data.profit)}</span>
                                                </div>
                                                <div className="profit-bar-container">
                                                    <div className={data.profit >= 0 ? 'profit-bar bg-green-500' : 'profit-bar bg-red-500'} style={{ width: `${Math.max(5, Math.abs(data.profit) / maxProfit * 100)}%` }}></div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    {activeTab === 'ranking' && (
                        <div className="space-y-4">
                            <div className="os-card p-5 rounded-xl">
                                <p className="text-[10px] font-usarmy text-[#d4af37] mb-4 text-center">TOP 5 OS MAIS LUCRATIVAS</p>
                                <div className="space-y-3">
                                    {financialMetrics.topOrders.length === 0 ? (
                                        <p className="text-center text-gray-600 text-sm py-4">Nenhuma OS no período</p>
                                    ) : financialMetrics.topOrders.map((item, index) => (
                                        <div key={item.osNumber} className="breakdown-item p-4 rounded-lg">
                                            <div className="flex justify-between items-start">
                                                <div className="flex items-center gap-3 min-w-0">
                                                    <div className={`w-9 h-9 rounded-xl flex items-center justify-center ${index === 0 ? 'gold-gradient' : 'bg-white/10'}`}>
                                                        <span className={`font-usarmy text-sm ${index === 0 ? 'text-black' : 'text-white'}`}>{index + 1}</span>
                                                    </div>
                                                    <div className="min-w-0">
                                                        <p className="text-sm text-white font-bold truncate">OS #{item.osNumber} • {item.customerName}</p>
                                                        <p className="text-[9px] text-gray-500 truncate">{item.equipment}</p>
                                                    </div>
                                                </div>
                                                <div className="text-right flex-shrink-0">
                                                    <p className="text-green-400 font-bold font-mono">{formatCurrency(item.netProfit)}</p>
                                                    <p className="text-[9px] text-gray-500">{item.margin.toFixed(1)}%</p>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="os-card p-5 rounded-xl">
                                <p className="text-[10px] font-usarmy text-[#d4af37] mb-4 text-center">TOP EQUIPAMENTOS POR LUCRO</p>
                                <div className="space-y-2">
                                    {financialMetrics.equipmentBreakdown.length === 0 ? (
                                        <p className="text-center text-gray-600 text-sm py-4">Nenhum dado disponível</p>
                                    ) : financialMetrics.equipmentBreakdown.map(([equipment, data], index) => (
                                        <div key={equipment} className="breakdown-item p-3 rounded-lg flex justify-between items-center">
                                            <div>
                                                <p className="text-sm text-white font-bold">#{index + 1} {equipment}</p>
                                                <p className="text-[9px] text-gray-500">{data.count} ordens • Receita {formatCurrency(data.revenue)}</p>
                                            </div>
                                            <span className="text-green-400 font-bold font-mono">{formatCurrency(data.profit)}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {activeTab === 'breakdown' && (
                        <div className="space-y-4">
                            <div className="os-card p-5 rounded-xl">
                                <p className="text-[10px] font-usarmy text-[#d4af37] mb-4 text-center">CUSTOS VS RECEITAS</p>
                                <div className="space-y-4">
                                    {[
                                        ['Receita líquida', financialMetrics.totalRevenue, 'bg-[#d4af37]', 'text-[#d4af37]', 100],
                                        ['Custo peças', financialMetrics.totalPartsCost, 'bg-red-500', 'text-red-400', financialMetrics.totalRevenue ? (financialMetrics.totalPartsCost / financialMetrics.totalRevenue) * 100 : 0],
                                        ['Custo produtos', financialMetrics.totalProductsCost, 'bg-red-600', 'text-red-400', financialMetrics.totalRevenue ? (financialMetrics.totalProductsCost / financialMetrics.totalRevenue) * 100 : 0],
                                        ['Custo operacional', financialMetrics.operationalCost, 'bg-yellow-500', 'text-yellow-400', financialMetrics.totalRevenue ? (financialMetrics.operationalCost / financialMetrics.totalRevenue) * 100 : 0],
                                        ['Lucro líquido', financialMetrics.totalNetProfit, 'bg-green-500', 'text-green-400', financialMetrics.totalRevenue ? (financialMetrics.totalNetProfit / financialMetrics.totalRevenue) * 100 : 0]
                                    ].map(([label, value, bar, text, width]) => (
                                        <div key={label} className="breakdown-item p-3 rounded-lg">
                                            <div className="flex justify-between items-center mb-2">
                                                <span className={`text-sm ${text}`}>{label}</span>
                                                <span className={`${text} font-bold font-mono`}>{formatCurrency(value)}</span>
                                            </div>
                                            <div className="profit-bar-container">
                                                <div className={`profit-bar ${bar}`} style={{ width: safePercent(width) }}></div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-3">
                                <MetricCard title="CUSTO POR OS" value={formatCurrency(financialMetrics.costPerOrder)} subtitle="rateio operacional" icon="calculator" tone="yellow" />
                                <MetricCard title="LUCRO BRUTO" value={formatCurrency(financialMetrics.totalGrossProfit)} subtitle="antes do operacional" icon="circle-dollar-sign" tone="green" />
                            </div>

                            <div className="os-card p-5 rounded-xl">
                                <p className="text-[10px] font-usarmy text-[#d4af37] mb-4 text-center">PEÇAS MAIS LUCRATIVAS</p>
                                <div className="space-y-2">
                                    {financialMetrics.partBreakdown.length === 0 ? (
                                        <p className="text-center text-gray-600 text-sm py-4">Nenhuma peça registrada com custo/venda</p>
                                    ) : financialMetrics.partBreakdown.map(([name, data], index) => (
                                        <div key={name} className="breakdown-item p-3 rounded-lg flex justify-between items-center">
                                            <div>
                                                <p className="text-sm text-white font-bold">#{index + 1} {name}</p>
                                                <p className="text-[9px] text-gray-500">{data.count}x • Venda {formatCurrency(data.revenue)} • Custo {formatCurrency(data.cost)}</p>
                                            </div>
                                            <span className="text-green-400 font-bold font-mono">{formatCurrency(data.profit)}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {activeTab === 'services' && (
                        <div className="space-y-4">
                            <div className="os-card p-5 rounded-xl">
                                <p className="text-[10px] font-usarmy text-[#d4af37] mb-4 text-center">SERVIÇOS MAIS RENTÁVEIS</p>
                                <div className="space-y-3">
                                    {financialMetrics.serviceBreakdown.length === 0 ? (
                                        <p className="text-center text-gray-600 text-sm py-4">Nenhum serviço registrado</p>
                                    ) : financialMetrics.serviceBreakdown.map(([serviceName, data], index) => (
                                        <div key={serviceName} className="breakdown-item p-4 rounded-lg">
                                            <div className="flex justify-between items-start mb-2">
                                                <div className="flex items-center gap-3 min-w-0">
                                                    <div className={`w-8 h-8 rounded-lg flex items-center justify-center ${index === 0 ? 'gold-gradient' : index === 1 ? 'bg-gray-600' : index === 2 ? 'bg-orange-700' : 'bg-white/10'}`}>
                                                        <span className={`font-usarmy text-sm ${index < 3 ? 'text-black' : 'text-white'}`}>{index + 1}</span>
                                                    </div>
                                                    <div className="min-w-0">
                                                        <p className="text-sm text-white font-bold truncate">{serviceName}</p>
                                                        <p className="text-[9px] text-gray-500">{data.count}x realizados</p>
                                                    </div>
                                                </div>
                                                <div className="text-right flex-shrink-0">
                                                    <p className="text-[#d4af37] font-bold font-mono">{formatCurrency(data.profit)}</p>
                                                    <p className="text-[9px] text-green-400">Média {formatCurrency(data.profit / data.count)}</p>
                                                </div>
                                            </div>
                                            <div className="profit-bar-container mt-2">
                                                <div className="profit-bar bg-blue-500" style={{ width: safePercent(financialMetrics.totalServices > 0 ? (data.revenue / financialMetrics.totalServices) * 100 : 0) }}></div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-3">
                                <MetricCard title="SERVIÇOS" value={formatCurrency(financialMetrics.totalServices)} subtitle="mão de obra faturada" icon="wrench" tone="blue" />
                                <MetricCard title="PEÇAS" value={formatCurrency(financialMetrics.totalParts)} subtitle={`lucro ${formatCurrency(financialMetrics.totalParts - financialMetrics.totalPartsCost)}`} icon="package" tone="gold" />
                                <MetricCard title="PRODUTOS" value={formatCurrency(financialMetrics.totalProducts)} subtitle={`lucro ${formatCurrency(financialMetrics.totalProducts - financialMetrics.totalProductsCost)}`} icon="boxes" tone="green" />
                                <MetricCard title="DESCONTOS" value={formatCurrency(financialMetrics.totalDiscounts)} subtitle="concedidos no período" icon="badge-percent" tone="red" />
                            </div>
                        </div>
                    )}
                </div>

            });
            const [pecas, setPecas] = useState(() => {
                try { return JSON.parse(SafeStorage.getItem('gf_pecas')) || []; } 
                catch(e) { return []; }
            });
            const [margemPadrao, setMargemPadrao] = useState(() => {
                try { 
                    const saved = SafeStorage.getItem('gf_margem');
                    return saved ? parseInt(saved) : 60; 
                }
                catch(e) { return 60; }
            });

            useEffect(() => {
                SafeStorage.setItem('gf_fornecedores', JSON.stringify(fornecedores));
            }, [fornecedores]);

            useEffect(() => {
                SafeStorage.setItem('gf_pecas', JSON.stringify(pecas));
            }, [pecas]);

            useEffect(() => {
                SafeStorage.setItem('gf_margem', margemPadrao.toString());
            }, [margemPadrao]);

            const calcularPrecoVenda = useCallback((preco, margem) => {
                let m;
                if (margem === undefined || margem === null || margem === '') {
                    m = margemPadrao;
                } else {
                    m = parseFloat(margem);
                    if (isNaN(m)) m = margemPadrao;
                }

                const p = parseFloat(preco);
                if (isNaN(p) || p <= 0) return '0.00';
                return (p * (1 + m / 100)).toFixed(2);
            }, [margemPadrao]);

            return {
                fornecedores, setFornecedores,
                pecas, setPecas,
                margemPadrao, setMargemPadrao,
                calcularPrecoVenda
            };

                                <input placeholder="Telefone" value={form.telefone} onChange={e => setForm({...form, telefone: e.target.value})} />
                                <input placeholder="Email" value={form.email} onChange={e => setForm({...form, email: e.target.value})} />
                                <button onClick={adicionar} className="w-full gold-gradient p-4 rounded-xl font-usarmy text-sm">+ ADICIONAR</button>

                    <div className="relative">
                        <i data-lucide="search" className="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
                        <input 
                            type="text"
                            placeholder="Buscar fornecedor..."
                            className="w-full pl-12"
                            value={busca}
                            onChange={e => setBusca(e.target.value)}
                        />
                    </div>

                    <div className="space-y-3">
                        {fornecedoresFiltrados.length === 0 ? (
                            <div className="text-center py-12 text-gray-600">
                                <i data-lucide="store" className="w-12 h-12 mx-auto mb-4 opacity-50"></i>
                                <p className="font-usarmy text-xs">Nenhum fornecedor cadastrado</p>
                            </div>
                        ) : (
                            fornecedoresFiltrados.map(f => {
                                const qtd = pecas.filter(p => p.fornecedorId === f.id).length;
                                return (
                                    <div key={f.id} className="os-card p-4 rounded-xl border-l-2 border-[#d4af37]/40">

                                            <div className="flex-1">
                                                <p className="text-white font-bold">{f.nome}</p>

                                                <button onClick={() => setEditando(f)} className="btn-icon text-[#d4af37] w-8 h-8">

                                                </button>

                                                    <i data-lucide="trash-2" className="w-4 h-4"></i>

                                            </div>
                                        </div>
                                    </div>

                    </div>
                </div>
            );
        };

        const GestaoPecas = ({ onBack, onHome }) => {
            const { pecas, setPecas, fornecedores, margemPadrao, setMargemPadrao, calcularPrecoVenda } = useGestaoData();
            const { confirm, modal: confirmModal } = useConfirm();
            const [form, setForm] = useState({ nome: '', fornecedorId: '', precoCompra: '', codigo: '', margem: '' });
            const [editando, setEditando] = useState(null);
            const [busca, setBusca] = useState('');

            const pecasFiltradas = useMemo(() => 
                pecas.filter(p => {
                    const termo = busca.toLowerCase();
                    const fornecedor = fornecedores.find(f => f.id === p.fornecedorId);
                    return p.nome.toLowerCase().includes(termo) || 
                           (p.codigo && p.codigo.toLowerCase().includes(termo)) ||
                           (fornecedor && fornecedor.nome.toLowerCase().includes(termo));
                }), [pecas, fornecedores, busca]);

            const adicionar = () => {
                if (!form.nome.trim() || !form.fornecedorId || !form.precoCompra) {
                    showToast('Preencha todos os campos obrigatórios');
                    return;
                }
                const preco = parseFloat(form.precoCompra);
                if (isNaN(preco) || preco <= 0) {
                    showToast('Preço inválido');
                    return;
                }
                const margemPeca = form.margem !== '' && form.margem !== undefined ? parseInt(form.margem) : undefined;
                const peca = {
                    id: Date.now().toString(),
                    nome: form.nome.trim(),
                    fornecedorId: form.fornecedorId,
                    precoCompra: preco,
                    codigo: form.codigo ? form.codigo.trim() : '',
                    margem: margemPeca,
                    dataCadastro: new Date().toLocaleDateString('pt-BR')

                setPecas(prev => [...prev, peca]);
                setForm({ nome: '', fornecedorId: '', precoCompra: '', codigo: '', margem: '' });
                showToast('Peça adicionada!');

            const atualizar = () => {
                if (!editando || !editando.nome.trim()) return;
                const preco = parseFloat(editando.precoCompra);
                if (isNaN(preco) || preco <= 0) {
                    showToast('Preço inválido');
                    return;
                }
                let margemIndividual;
                if (editando.margem === '' || editando.margem === undefined || editando.margem === null) {

                    margemIndividual = parseInt(editando.margem);

                setPecas(prev => prev.map(p => p.id === editando.id ? {
                    ...editando, 
                    precoCompra: preco, 
                    margem: margemIndividual

                setEditando(null);

                    message: 'EXCLUIR PEÇA?',
                    confirmLabel: 'EXCLUIR',

                    icon: 'trash-2'

                const precoVenda = calcularPrecoVenda(peca.precoCompra, peca.margem);
                const texto = `${peca.nome}: R$ ${precoVenda.replace('.', ',')} (custo: R$ ${peca.precoCompra.toFixed(2).replace('.', ',')})`;
                navigator.clipboard?.writeText(texto).then(() => showToast('Preço copiado!'));

                setEditando({
                    ...peca,

                        />
                    </div>

                    <div className="os-card p-5 space-y-4">
                        <p className="text-[10px] font-usarmy text-[#d4af37] mb-2">{editando ? 'EDITAR PEÇA' : 'NOVA PEÇA'}</p>

                        {editando ? (
                            <>
                                <input placeholder="Nome" value={editando.nome} onChange={e => setEditando({...editando, nome: e.target.value})} />
                                <input placeholder="Código" value={editando.codigo || ''} onChange={e => setEditando({...editando, codigo: e.target.value})} />
                                <select value={editando.fornecedorId} onChange={e => setEditando({...editando, fornecedorId: e.target.value})}>
                                    <option value="">Selecione...</option>
                                    {fornecedores.map(f => <option key={f.id} value={f.id}>{f.nome}</option>)}
                                </select>
                                <input type="text" inputMode="decimal" step="0.01" placeholder="Preço de compra" value={editando.precoCompra} onChange={e => setEditando({...editando, precoCompra: e.target.value})} />
                                <div className="relative">
                                    <input
                                        type="text" inputMode="decimal"
                                        min="0"
                                        max="999"
                                        placeholder={`Margem % (padrão: ${margemPadrao}%)`}
                                        value={editando.margem !== undefined ? editando.margem : ''}
                                        onChange={e => setEditando({...editando, margem: e.target.value === '' ? '' : parseInt(e.target.value) || 0})}
                                    />
                                    <span className="absolute right-4 top-1/2 -translate-y-1/2 text-[#d4af37] text-xs font-usarmy">%</span>
                                </div>
                                <p className="text-[10px] text-gray-500">Deixe vazio para usar a margem padrão ({margemPadrao}%)</p>
                                <div className="flex gap-2">
                                    <button onClick={atualizar} className="flex-1 gold-gradient p-3 rounded-xl font-usarmy text-xs">SALVAR</button>
                                    <button onClick={() => setEditando(null)} className="flex-1 border border-white/10 p-3 rounded-xl text-gray-400 font-usarmy text-xs">CANCELAR</button>
                                </div>
                            </>
                        ) : (
                            <>
                                <input placeholder="Nome da peça *" value={form.nome} onChange={e => setForm({...form, nome: e.target.value})} />
                                <input placeholder="Código/SKU" value={form.codigo} onChange={e => setForm({...form, codigo: e.target.value})} />
                                <select value={form.fornecedorId} onChange={e => setForm({...form, fornecedorId: e.target.value})}>
                                    <option value="">Selecione fornecedor...</option>
                                    {fornecedores.map(f => <option key={f.id} value={f.id}>{f.nome}</option>)}
                                </select>
                                <input type="text" inputMode="decimal" step="0.01" placeholder="Preço de compra R$ *" value={form.precoCompra} onChange={e => setForm({...form, precoCompra: e.target.value})} />
                                <div className="relative">
                                    <input
                                        type="text" inputMode="decimal"
                                        min="0"
                                        max="999"
                                        placeholder={`Margem % (padrão: ${margemPadrao}%)`}
                                        value={form.margem}
                                        onChange={e => setForm({...form, margem: e.target.value})}
                                    />
                                    <span className="absolute right-4 top-1/2 -translate-y-1/2 text-[#d4af37] text-xs font-usarmy">%</span>
                                </div>
                                <p className="text-[10px] text-gray-500">Deixe vazio para usar a margem padrão ({margemPadrao}%)</p>
                                <button onClick={adicionar} className="w-full gold-gradient p-4 rounded-xl font-usarmy text-sm">+ ADICIONAR PEÇA</button>
                            </>
                        )}
                    </div>

                    <div className="relative">
                        <i data-lucide="search" className="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
                        <input 
                            type="text"
                            placeholder="Buscar peças..."
                            className="w-full pl-12"
                            value={busca}
                            onChange={e => setBusca(e.target.value)}
                        />
                    </div>

                    <div className="space-y-3">
                        {pecasFiltradas.length === 0 ? (
                            <div className="text-center py-12 text-gray-600">
                                <i data-lucide="package" className="w-12 h-12 mx-auto mb-4 opacity-50"></i>
                                <p className="font-usarmy text-xs">Nenhuma peça cadastrada</p>
                            </div>
                        ) : (
                            pecasFiltradas.map(p => {
                                const f = fornecedores.find(x => x.id === p.fornecedorId);
                                const margemEfetiva = p.margem !== undefined && p.margem !== null ? p.margem : margemPadrao;
                                const precoVenda = calcularPrecoVenda(p.precoCompra, p.margem);
                                const lucro = parseFloat(precoVenda) - p.precoCompra;

                                return (
                                    <div key={p.id} className="os-card p-4 rounded-xl border-l-2 border-[#d4af37]/40">
                                        <div className="flex justify-between items-start mb-3">
                                            <div className="flex-1">
                                                <p className="text-white font-bold">{p.nome}</p>
                                                <p className="text-xs text-gray-500">{f ? f.nome : 'Fornecedor removido'}{p.codigo ? ` • Cód: ${p.codigo}` : ''}</p>
                                            </div>
                                        </div>

                                        <div className="flex justify-between items-center border-t border-white/5 pt-3">
                                            <div className="flex gap-4 text-sm">
                                                <span className="text-red-400">R$ {p.precoCompra.toFixed(2)}</span>
                                                <span className="text-[#d4af37] font-bold">R$ {precoVenda}</span>
                                                <span className="text-green-400">+R$ {lucro.toFixed(2)}</span>
                                                {p.margem !== undefined && p.margem !== null && <span className="text-xs text-blue-400 font-usarmy">{p.margem}%</span>}
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={() => copiar(p)} className="btn-icon text-[#d4af37] w-8 h-8">
                                                    <i data-lucide="copy" className="w-4 h-4"></i>
                                                </button>
                                                <button onClick={() => iniciarEdicao(p)} className="btn-icon text-[#d4af37] w-8 h-8">
                                                    <i data-lucide="edit" className="w-4 h-4"></i>
                                                </button>
                                                <button onClick={() => excluir(p.id)} className="btn-icon text-red-500 w-8 h-8">
                                                    <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })
                        )}
                    </div>
                </div>
            );
        };

        const GestaoFerramentas = ({ onBack, onHome }) => {
            const { fornecedores, pecas, margemPadrao, setFornecedores, setPecas, setMargemPadrao } = useGestaoData();

            const exportar = () => {
                const dados = { 
                    fornecedores, 
                    pecas, 
                    margemPadrao, 
                    exportadoEm: new Date().toISOString() 
                };
                const json = JSON.stringify(dados, null, 2);
                navigator.clipboard?.writeText(json).then(() => showToast('📋 Dados de gestão copiados!'));
            };

            const importar = () => {
                const json = prompt('Cole o JSON de backup da gestão:');
                if (!json) return;
                try {
                    const dados = JSON.parse(json);
                    if (dados.fornecedores) setFornecedores(dados.fornecedores);
                    if (dados.pecas) setPecas(dados.pecas);
                    if (dados.margemPadrao) setMargemPadrao(dados.margemPadrao);
                    showToast('✅ Dados da gestão importados com sucesso!');
                } catch(e) {
                    showToast('❌ Erro ao importar dados da gestão!');
                }
            };

            return (
                <div className="space-y-6 animate-fadeIn pb-10">
                    <div className="flex items-center justify-between border-b border-white/10 pb-4">
                        <button type="button" onClick={onBack} className="btn-icon text-[#d4af37]">
                            <i data-lucide="arrow-left" className="w-5 h-5"></i>
                        </button>
                        <h2 className="font-usarmy text-[#d4af37] text-sm">FERRAMENTAS TÁTICAS</h2>
                        <button onClick={onHome} className="btn-icon text-[#d4af37]">
                            <i data-lucide="home" className="w-5 h-5"></i>
                        </button>
                    </div>

                    <div className="os-card p-6">
                        <div className="flex items-start gap-4">
                            <div className="w-14 h-14 rounded-2xl assistencia-logo-premium logo-premium-animated shrink-0" aria-hidden="true"></div>
                            <div className="flex-1 min-w-0">
                                <p className="text-[10px] font-usarmy text-gray-400 tracking-[1px] mb-2">PAINEL DE APOIO</p>
                                <h3 className="font-usarmy text-[#d4af37] text-base mb-2">GESTÃO DE FORNECEDORES E PEÇAS</h3>
                                <p className="text-gray-400 text-sm leading-relaxed">Aqui ficam as utilidades rápidas da área técnica. O backup total do sistema continua centralizado em Ferramentas do menu principal.</p>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-3 gap-3">
                        <div className="os-card p-4 text-center">
                            <p className="text-[9px] text-gray-500 font-usarmy mb-1">FORNECEDORES</p>
                            <p className="font-usarmy text-[#d4af37] text-lg">{fornecedores.length}</p>
                        </div>
                        <div className="os-card p-4 text-center">
                            <p className="text-[9px] text-gray-500 font-usarmy mb-1">PEÇAS</p>
                            <p className="font-usarmy text-[#d4af37] text-lg">{pecas.length}</p>
                        </div>
                        <div className="os-card p-4 text-center">
                            <p className="text-[9px] text-gray-500 font-usarmy mb-1">MARGEM</p>
                            <p className="font-usarmy text-[#d4af37] text-lg">{parseFloat(margemPadrao || 0).toFixed(0)}%</p>
                        </div>
                    </div>

                    <div className="os-card p-5">
                        <div className="flex items-center gap-3 mb-4">
                            <div className="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center">
                                <i data-lucide="clipboard-list" className="w-5 h-5 text-cyan-300"></i>
                            </div>
                            <div>
                                <h4 className="font-usarmy text-cyan-300 text-sm">UTILIDADES RÁPIDAS</h4>
                                <p className="text-gray-500 text-xs">Backup manual da área de gestão</p>
                            </div>
                        </div>

                        <div className="space-y-3">
                            <button onClick={exportar} className="w-full gold-gradient p-4 rounded-xl font-usarmy text-sm flex items-center justify-center gap-3">
                                <i data-lucide="download" className="w-5 h-5"></i>
                                COPIAR DADOS DA GESTÃO
                            </button>

                            <button onClick={importar} className="w-full os-card p-4 rounded-xl font-usarmy text-sm text-[#d4af37] border border-[#d4af37]/30 flex items-center justify-center gap-3">
                                <i data-lucide="upload" className="w-5 h-5"></i>
                                RESTAURAR DADOS DA GESTÃO
                            </button>
                        </div>
                    </div>

                    <div className="os-card p-5">
                        <h4 className="font-usarmy text-[#d4af37] text-xs mb-4">ORIENTAÇÕES</h4>
                        <ul className="text-gray-400 text-sm space-y-2">
                            <li>• Use este bloco somente para fornecedores, peças e margem padrão.</li>
                            <li>• O backup total do app está centralizado em Ferramentas no menu principal.</li>
                            <li>• Antes de grandes mudanças, faça um backup total completo.</li>
                        </ul>
                    </div>
                </div>
            );
        };

        const ToolsManager = ({ onBack }) => {
            const [importing, setImporting] = useState(false);
            const [backupBusy, setBackupBusy] = useState(false);
            const [lastAction, setLastAction] = useState('PRONTO');

            const handleExportFullBackup = async () => {
                try {
                    setBackupBusy(true);
                    setLastAction('GERANDO BACKUP');
                    const payload = await buildFullAppBackup();
                    downloadJsonFile(`alcantara_backup_total_v13_${new Date().toISOString().slice(0,10)}.json`, payload);
                    showToast('✅ Backup total gerado com sucesso!', 'success');
                    setLastAction('BACKUP BAIXADO');
                } catch (err) {
                    showToast('❌ Erro ao gerar backup total', 'error');
                    setLastAction('ERRO NO BACKUP');
                } finally {
                    setBackupBusy(false);
                }
            };

            const handleExportFullBackupDrive = async () => {
                try {
                    setBackupBusy(true);
                    setLastAction('ENVIANDO PARA O DRIVE');
                    const payload = await buildFullAppBackup();
                    const shared = await shareJsonFile(
                        `alcantara_backup_total_v13_${new Date().toISOString().slice(0,10)}.json`,
                        payload,
                        'Salvar backup total do app no Google Drive'
                    );
                    showToast(shared ? '☁️ Compartilhe no Google Drive para salvar o backup' : '📦 Backup total baixado para envio manual', shared ? 'success' : 'warning');
                    setLastAction(shared ? 'PRONTO PARA O DRIVE' : 'ARQUIVO BAIXADO');
                } catch (err) {
                    showToast('❌ Erro ao enviar backup para o Drive', 'error');
                    setLastAction('ERRO NO DRIVE');
                } finally {
                    setBackupBusy(false);
                }
            };

            const handleImport = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setImporting(true);
                setLastAction('RESTAURANDO DADOS');
                try {
                    const raw = await file.text();
                    const parsed = JSON.parse(raw);
                    if (parsed && parsed.mode === 'full_system_backup') {

        if (isNaN(unitPrice) || unitPrice < 0) {
            showToast("⚠️ Preço inválido", "warning");
            return;
        }

        const totalPrice = unitPrice * quantity;
        const hasCostControl = type === 'part' || type === 'product';
        const costUnitPrice = hasCostControl ? (parseFloat(temp.costPrice) || 0) : 0;
        const costTotal = costUnitPrice * quantity;
        const profitTotal = hasCostControl ? Math.max(0, totalPrice - costTotal) : 0;

        const item = {
            id: Date.now() + Math.random(),
            name: temp.name.toUpperCase(),
            quantity: quantity,
            unitPrice: unitPrice,
            price: totalPrice,
            type: type,
            costUnitPrice,
            costPrice: costTotal,
            costTotal,
            profitTotal
        };

        setFormData(prev => {
            if (type === 'service') {
                return { ...prev, services: [...prev.services, item] };
            } else if (type === 'part') {
                return { ...prev, parts: [...prev.parts, item] };
            } else if (type === 'product') {
                return { ...prev, products: [...prev.products, item] };
            }
            return prev;
        });

        dispatch({
            type: 'SAVE_CATALOG_ITEM',
            item: { name: temp.name.toUpperCase(), price: unitPrice, type, costPrice: costUnitPrice }
        });

        setTemp({ name: '', quantity: '', price: '', costPrice: '' });
        setSelectedCatalogId('');
        showToast("✅ Item adicionado", "success");
    } catch (err) {
        console.error(err);
        showToast("❌ Erro ao adicionar item", "error");
    }
}, [temp, type, dispatch]);

                const price = parseFloat(newItem.price);
                if (isNaN(price) || price < 0) {
                    showToast("⚠️ Preço inválido", "warning");
                    return;

                showToast("✅ Item adicionado ao catálogo", "success");

                setEditingItem({
                    ...item,
                    editPrice: item.price.toString(),
                    editName: item.name

                if (!editingItem.editName.trim() || !editingItem.editPrice) {
                    showToast("⚠️ Preencha todos os campos", "warning");
                    return;

                    return;

        const EditProductModal = ({ product, onSave, onClose }) => {

            });

                const price = parseFloat(editData.price);
                const stock = parseInt(editData.stock);

                if (isNaN(price) || price < 0) {
                    showToast("⚠️ Preço inválido", "warning");
                    return;
                }

                if (isNaN(stock) || stock < 0) {
                    showToast("⚠️ Estoque inválido", "warning");
                    return;
                }

                    ...product,
                    price: price,
                    stock: stock
                };

                brand: '',
                model: '',
                ammoType: '',
                defect: '',

                saveEquipmentHistoryRecords(records);

                setForm({
                    brand: '',
                    model: '',
                    ammoType: '',
                    defect: '',
                    diagnosis: '',
                    classification: 'EM_ANALISE',
                    notes: ''
                });
                setEditingId(null);
            };

            const filteredRecords = useMemo(() => {
                const term = search.trim().toLowerCase();
                if (!term) return records;
                return records.filter(record =>
                    [record.brand, record.model, record.ammoType, record.defect, record.diagnosis, record.notes, record.classification, record.customerName, record.osNumber, record.equipmentLabel]
                        .some(value => String(value || '').toLowerCase().includes(term))
                );
            }, [records, search]);

            const summary = useMemo(() => getEquipmentHistorySummary(records), [records]);

            const handleSubmit = () => {
                if (!form.brand.trim() || !form.model.trim() || !form.defect.trim()) {
                    showToast('⚠️ Preencha marca, modelo e defeito', 'warning');
                    return;
                }

                const currentLinked = editingId ? records.find(item => item.id === editingId) : null;
                const payload = {
                    id: editingId || String(Date.now()),
                    orderId: currentLinked?.orderId || '',
                    osNumber: currentLinked?.osNumber || '',
                    customerName: currentLinked?.customerName || '',
                    equipmentLabel: currentLinked?.equipmentLabel || '',
                    brand: form.brand.trim(),
                    model: form.model.trim(),
                    ammoType: form.ammoType.trim(),
                    defect: form.defect.trim(),
                    diagnosis: form.diagnosis.trim(),
                    classification: form.classification,
                    notes: form.notes.trim(),
                    date: currentLinked?.date || new Date().toLocaleDateString('pt-BR')
                };

                setRecords(prev => editingId
                    ? prev.map(item => item.id === editingId ? payload : item)
                    : [payload, ...prev]
                );

                showToast(editingId ? '✅ Histórico atualizado' : '✅ Histórico de equipamento salvo', 'success');
                resetForm();

                    brand: record.brand || '',
                    model: record.model || '',
                    ammoType: record.ammoType || '',
                    defect: record.defect || '',
                    diagnosis: record.diagnosis || '',
                    classification: record.classification || 'EM_ANALISE',
                    notes: record.notes || ''
                });

                    window.scrollTo({ top: 0 });

<script>
(function(){

                if (window.lucide && typeof window.lucide.createIcons === 'function') {
                    window.lucide.createIcons();
                }
            } catch (e) {
                console.warn('Falha ao atualizar ícones Lucide:', e);
            }
        }, 40);
    }

    document.addEventListener('DOMContentLoaded', function(){

        setTimeout(refreshAlcantaraIcons, 250);
        setTimeout(refreshAlcantaraIcons, 700);

        try {
            const root = document.getElementById('root') || document.body;
            const observer = new MutationObserver(function(){
                refreshAlcantaraIcons();
            });
            observer.observe(root, { childList: true, subtree: true });

    });

    window.addEventListener('load', refreshAlcantaraIcons);
