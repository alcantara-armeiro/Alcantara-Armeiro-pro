                        <div className="w-11"></div>
                    </div>

                    {screen === 'list' ? (
                        <>
                            <div className="os-card rounded-xl p-4 border border-[#6f8f42]/25">
                                <div className="flex items-center gap-3 mb-4">
                                    <div className="w-12 h-12 rounded-full bg-[#6f8f42]/10 border border-[#6f8f42]/30 flex items-center justify-center">
                                        <i data-lucide="shield-check" className="w-6 h-6 text-[#8fb85a]"></i>
                                    </div>
                                    <div>
                                        <p className="font-usarmy text-[#8fb85a] text-sm">PAINEL DE ASSISTÊNCIAS</p>
                                        <p className="text-[10px] text-gray-500">Lista em ordem, busca rápida e acesso ao PDF.</p>
                                    </div>
                                </div>

                                <div className="space-y-3">
                                    <input
                                        type="text"
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                        placeholder="Buscar por assistência, cliente/loja, série, defeito, protocolo, contato ou CNPJ"
                                        className="w-full p-3 rounded-xl"
                                    />
                                    <div className="grid grid-cols-2 gap-3">
                                        <button type="button" onClick={() => setSearchTerm('')} className="p-3 rounded-xl border border-white/10 text-gray-400 font-usarmy text-xs">LIMPAR BUSCA</button>
                                        <button type="button" onClick={openCreate} className="p-3 rounded-xl text-white font-usarmy text-xs border border-[#8fb85a]/40" style={{ background: 'linear-gradient(135deg, #4e6b2f 0%, #5d7a37 50%, #6f8f42 100%)' }}>+ NOVA ASSISTÊNCIA</button>
                                    </div>
                                </div>
                            </div>

                            <div className="os-card rounded-xl p-4 border border-white/5">
                                <div className="flex items-center justify-between mb-3">
                                    <p className="font-usarmy text-[#d4af37] text-xs">REGISTROS DE ASSISTÊNCIA</p>
                                    <span className="results-count">{filteredRecords.length} REGISTROS</span>
                                </div>

                                {filteredRecords.length === 0 ? (
                                    <div className="text-center py-10">
                                        <i data-lucide="clipboard-list" className="w-12 h-12 text-gray-700 mx-auto mb-3"></i>
                                        <p className="font-usarmy text-[10px] text-gray-500">{records.length === 0 ? 'NENHUMA ASSISTÊNCIA CADASTRADA' : 'NENHUM REGISTRO ENCONTRADO NA BUSCA'}</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 gap-3">
                                        {filteredRecords.map(record => {
                                            const activeProtocol = record.partnerProtocol || record.workshopProtocol || 'EM ABERTO';
                                            const displayName = record.personType === 'PJ'
                                                ? (record.storeName || 'Loja não informada')
                                                : (record.customerName || 'Cliente não informado');

                                            return (
                                                <div key={record.id} className="rounded-xl border border-[#6f8f42]/20 bg-gradient-to-br from-[#17210d] to-slate-950 p-3">
                                                    <button type="button" onClick={() => handleEdit(record)} className="w-full text-left">
                                                        <div className="flex items-start justify-between gap-3">
                                                            <div className="min-w-0">
                                                                <div className="flex items-center gap-2 flex-wrap">
                                                                    <p className="font-usarmy text-[#8fb85a] text-xs">{record.assistance}</p>
                                                                    <span className="text-[9px] uppercase tracking-[0.2em] text-[#6f8f42]">{record.personType === 'PJ' ? 'PJ' : 'PF'}</span>
                                                                </div>
                                                                <p className="text-[10px] text-gray-300 mt-1 truncate">{displayName}</p>
                                                                <p className="text-[10px] text-gray-400 mt-1">Série: {record.serialNumber}</p>
                                                                <p className="text-[10px] text-gray-400 mt-1">Protocolo: {activeProtocol}</p>
                                                                {record.personType === 'PF' ? (
                                                                    <p className="text-[10px] text-gray-500 mt-1 truncate">{record.customerWhatsapp || record.customerEmail || 'Cliente sem contato informado'}</p>
                                                                ) : (
                                                                    <p className="text-[10px] text-gray-500 mt-1 truncate">CNPJ: {record.storeCnpj || 'Não informado'}</p>
                                                                )}
                                                            </div>
                                                            <div className="text-right shrink-0">
                                                                <p className="text-[9px] text-gray-500">{record.date}</p>
                                                                <div className="mt-2 px-2 py-1 rounded-lg border border-[#6f8f42]/30 bg-[#6f8f42]/10 text-[#8fb85a] font-usarmy text-[9px]">ASSISTÊNCIA</div>
                                                            </div>
                                                        </div>
                                                    </button>
                                                    <div className="grid grid-cols-3 gap-2 mt-3">
                                                        <button type="button" onClick={() => generateAssistenciaPDF(record)} className="p-2 rounded-lg border border-[#8fb85a]/30 text-[#8fb85a] font-usarmy text-[10px]">PDF</button>
                                                        <button type="button" onClick={() => handleEdit(record)} className="p-2 rounded-lg border border-white/10 text-gray-300 font-usarmy text-[10px]">EDITAR</button>
                                                        <button type="button" onClick={() => setConfirmDelete(record.id)} className="p-2 rounded-lg border border-red-500/20 text-red-400 font-usarmy text-[10px] bg-red-500/5">EXCLUIR</button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        </>
                    ) : (
                        <div className="os-card rounded-xl p-4 border border-[#6f8f42]/25">
                            <div className="flex items-center gap-3 mb-4">
                                <div className="w-12 h-12 rounded-full bg-[#6f8f42]/10 border border-[#6f8f42]/30 flex items-center justify-center">
                                    <i data-lucide="file-pen-line" className="w-6 h-6 text-[#8fb85a]"></i>
                                </div>
                                <div>
                                    <p className="font-usarmy text-[#8fb85a] text-sm">{editingId ? 'EDITAR ASSISTÊNCIA' : 'CADASTRO DE ASSISTÊNCIA'}</p>                                   
                                </div>
                            </div>

                            <form onSubmit={handleSubmit} action="javascript:void(0)" className="space-y-3">
                                <div className="rounded-xl border border-white/10 p-3 bg-black/20">
                                    <p className="text-[10px] font-usarmy text-[#d4af37] mb-2">TIPO DE CADASTRO</p>
                                    <div className="grid grid-cols-2 gap-2">
                                        <label className={`p-3 rounded-xl border cursor-pointer ${form.personType === 'PF' ? 'border-[#8fb85a] bg-[#6f8f42]/10 text-[#8fb85a]' : 'border-white/10 text-gray-400'}`}>
                                            <input type="radio" className="hidden" checked={form.personType === 'PF'} onChange={() => updateForm({ personType: 'PF' })} />
                                            <span className="font-usarmy text-xs">PESSOA FÍSICA</span>
                                        </label>
                                        <label className={`p-3 rounded-xl border cursor-pointer ${form.personType === 'PJ' ? 'border-[#8fb85a] bg-[#6f8f42]/10 text-[#8fb85a]' : 'border-white/10 text-gray-400'}`}>
                                            <input type="radio" className="hidden" checked={form.personType === 'PJ'} onChange={() => updateForm({ personType: 'PJ' })} />
                                            <span className="font-usarmy text-xs">PESSOA JURÍDICA</span>
                                        </label>
                                    </div>
                                </div>

                                <input type="text" value={form.assistance} onChange={(e) => updateForm({ assistance: e.target.value })} placeholder="Assistência" className="w-full p-3 rounded-xl" />
                                <input type="text" value={form.serialNumber} onChange={(e) => updateForm({ serialNumber: e.target.value })} placeholder="Número de série" className="w-full p-3 rounded-xl" />

                                {form.personType === 'PF' ? (
                                    <>
                                        <textarea value={form.defectReport} onChange={(e) => updateForm({ defectReport: e.target.value })} placeholder="Defeito relatado" className="w-full p-3 rounded-xl min-h-[92px]" />
                                        <input type="text" value={form.customerName} onChange={(e) => updateForm({ customerName: e.target.value })} placeholder="Nome do cliente" className="w-full p-3 rounded-xl" />
                                        <input type="email" value={form.customerEmail} onChange={(e) => updateForm({ customerEmail: e.target.value })} placeholder="E-mail do cliente" className="w-full p-3 rounded-xl" />
                                        <PhoneInput value={form.customerWhatsapp} onChange={(value) => updateForm({ customerWhatsapp: value })} placeholder="WhatsApp do cliente" className="w-full p-3 rounded-xl" />
                                        <div>
                                            <p className="text-[10px] font-usarmy text-[#d4af37] mb-2">QUEM ENTREGOU O PRODUTO?</p>
                                            <div className="grid grid-cols-1 gap-2 sm:grid-cols-3">
                                                {['CLIENTE', 'REPRESENTANTE', 'TRANSPORTE'].map(option => (
                                                    <label key={option} className={`p-3 rounded-xl border cursor-pointer text-center ${form.deliveredBy === option ? 'border-[#8fb85a] bg-[#6f8f42]/10 text-[#8fb85a]' : 'border-white/10 text-gray-400'}`}>
                                                        <input type="radio" className="hidden" checked={form.deliveredBy === option} onChange={() => updateForm({ deliveredBy: option })} />
                                                        <span className="font-usarmy text-[10px]">{option}</span>
                                                    </label>
                                                ))}
                                            </div>
                                        </div>
                                    </>
                                ) : (
                                    <>
                                        <input type="text" value={form.storeCnpj} onChange={(e) => updateForm({ storeCnpj: normalizeCnpj(e.target.value) })} placeholder="CNPJ da loja" className="w-full p-3 rounded-xl" />
                                        <input type="text" value={form.storeName} onChange={(e) => updateForm({ storeName: e.target.value })} placeholder="Nome do cliente/loja" className="w-full p-3 rounded-xl" />
                                        <label className="flex items-center gap-3 rounded-xl border border-white/10 p-3 cursor-pointer">
                                            <input type="checkbox" checked={!!form.isWholesale} onChange={(e) => updateForm({ isWholesale: e.target.checked })} />
                                            <span className="font-usarmy text-xs text-gray-300">Lojista de atacado</span>
                                        </label>
                                    </>
                                )}

                                <div className="grid grid-cols-1 gap-3 sm:grid-cols-2">
                                    <input type="text" value={form.workshopProtocol} onChange={(e) => updateForm({ workshopProtocol: e.target.value })} placeholder="Protocolo provisório da oficina" className="w-full p-3 rounded-xl" />
                                    <input type="text" value={form.partnerProtocol} onChange={(e) => updateForm({ partnerProtocol: e.target.value })} placeholder="Número de protocolo do parceiro (em aberto)" className="w-full p-3 rounded-xl" />
                                </div>

                                <p className="text-[10px] text-gray-500 -mt-1">
                                    O PDF usa o protocolo do parceiro quando existir. Se não existir, permanece o protocolo provisório da oficina.
                                </p>

                                <div className="grid grid-cols-2 gap-3">
                                    <button type="button" onClick={() => { resetForm(); setScreen('list'); }} className="p-3 rounded-xl border border-white/10 text-gray-400 font-usarmy text-xs">CANCELAR</button>
                                    <button type="submit" className="p-3 rounded-xl text-white font-usarmy text-xs border border-[#8fb85a]/40" style={{ background: 'linear-gradient(135deg, #4e6b2f 0%, #5d7a37 50%, #6f8f42 100%)' }}>
                                        {editingId ? 'SALVAR' : 'CADASTRAR'}
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}

                    {confirmDelete && (
                        <div className="modal-overlay" onClick={() => setConfirmDelete(null)}>
                            <div className="modal-content p-6" onClick={e => e.stopPropagation()}>
                                <p className="font-usarmy text-[#d4af37] text-sm mb-2">EXCLUIR ASSISTÊNCIA</p>
                                <p className="text-gray-400 text-sm mb-6">Tem certeza? Esta ação não pode ser desfeita.</p>
                                <div className="grid grid-cols-2 gap-3">
                                    <button type="button" onClick={() => setConfirmDelete(null)} className="p-3 rounded-xl border border-white/10 text-gray-400 font-usarmy text-xs">CANCELAR</button>
                                    <button type="button" onClick={() => handleDelete(confirmDelete)} className="p-3 rounded-xl bg-red-500/20 border border-red-500/30 text-red-400 font-usarmy text-xs">EXCLUIR</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };


// ========== COMPONENTE PRINCIPAL ==========
        const App = () => {
            const { state, dispatch } = useDb();
            const { confirm: confirmDialog, modal: confirmModal } = useConfirm();
            const [isAuth, setIsAuth] = useState(SafeStorage.getItem('alcantara_auth') === 'true');
            const [view, setView] = useState('dashboard');
            const orders = state.orders;
            const [selectedOrder, setSelectedOrder] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [orderListStageFilter, setOrderListStageFilter] = useState('TODOS');
            const [orderListPaymentFilter, setOrderListPaymentFilter] = useState('TODOS');
            const [installPrompt, setInstallPrompt] = useState(null);
            const [showInstallButton, setShowInstallButton] = useState(false);
            const [isStandalone, setIsStandalone] = useState(false);

            useEffect(() => {
                if (view === 'create') {
                    const goTop = () => {
                        try {
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                        } catch (e) {
                            window.scrollTo(0, 0);
                        }
                    };
                    goTop();
                    requestAnimationFrame(goTop);
                    setTimeout(goTop, 120);
                }
            }, [view]);

            useEffect(() => {
                const checkStandalone = () => {
                    const isStandaloneMode = window.matchMedia('(display-mode: standalone)').matches || 
                                            window.navigator.standalone === true ||
                                            document.referrer.includes('android-app://');
                    setIsStandalone(isStandaloneMode);
                    setShowInstallButton(!isStandaloneMode && installPrompt !== null);
                };

                checkStandalone();

                const mediaQuery = window.matchMedia('(display-mode: standalone)');
                mediaQuery.addEventListener('change', checkStandalone);

                return () => mediaQuery.removeEventListener('change', checkStandalone);
            }, [installPrompt]);

            // orders vêm do DbContext (reativo)

            useEffect(() => {
                if (isAuth && typeof lucide !== 'undefined') {
                    const timer = setTimeout(() => {
                        try {
                            lucide.createIcons();
                        } catch (e) {
                            console.log('Erro ao criar ícones:', e);
                        }
                    }, 100);
                    return () => clearTimeout(timer);
                }
            }, [isAuth, view]);

            useEffect(() => {
                const handleBeforeInstallPrompt = (e) => {
                    e.preventDefault();
                    setInstallPrompt(e);
                    if (!isStandalone) {
                        setShowInstallButton(true);
                    }
                };

                window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);

                return () => {
                    window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
                };
            }, [isStandalone]);

            const handleInstallClick = async () => {
                if (!installPrompt) return;

                installPrompt.prompt();

                const { outcome } = await installPrompt.userChoice;

                if (outcome === 'accepted') {
                    showToast("✅ App instalado com sucesso!", "success");
                    setShowInstallButton(false);
                    setIsStandalone(true);
                } else {
                    showToast("❌ Instalação cancelada", "info");
                }

                setInstallPrompt(null);
            };

            useEffect(() => {
                if (!isAuth) return;

                let isProcessing = false;

                const handleBackButton = (e) => {
                    if (isProcessing) return;
                    isProcessing = true;

                    e.preventDefault();

                    switch (view) {
                        case 'dashboard':
                            // logout pelo header button (useConfirm)
                            break;

                        case 'list':
                            setView('dashboard');
                            break;

                        case 'create':
                            if (selectedOrder) {
                                setView('detail');
                            } else {
                                setView('dashboard');
                            }
                            break;

                        case 'detail':
                            setView('list');
                            setSelectedOrder(null);
                            break;

                        case 'catalog':
                        case 'products':
                        case 'clients_list':
                        case 'tools':
                        case 'management':
                        case 'gestao_home':
                        case 'profit_analysis':
                        case 'bench_shortcut':
                        case 'assistencia_tecnica':
                        case 'fornecedores':
                            setView('dashboard');
                            break;

                        case 'gestao_calculadora':
                        case 'gestao_fornecedores':
                        case 'gestao_pecas':
                        case 'gestao_ferramentas':
                            setView('gestao_home');
                            break;

                        default:
                            setView('dashboard');
                    }

                    setTimeout(() => { isProcessing = false; }, 100);
                };

                const pushState = () => {
                    window.history.pushState({ view: view, timestamp: Date.now() }, '', window.location.href);
                };

                pushState();

                const handlePopState = (e) => {
                    handleBackButton(e);
                    setTimeout(pushState, 0);
                };

                window.addEventListener('popstate', handlePopState);

                const handleDeviceBack = (e) => {
                    e.preventDefault();
                    handleBackButton(e);
                };

                document.addEventListener('backbutton', handleDeviceBack, false);

                return () => {
                    window.removeEventListener('popstate', handlePopState);
                    document.removeEventListener('backbutton', handleDeviceBack, false);
                };
            }, [isAuth, view, selectedOrder]);

            if (!isAuth) return <Login onLogin={() => setIsAuth(true)} />;

            const filteredOrders = orders.filter(o => 
                o.customerName?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                o.equipment?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                o.osNumber?.includes(searchTerm)
            );

            const getClientList = () => {
                const uniqueClients = new Map();

                orders.forEach(order => {
                    if (order.customerName && !uniqueClients.has(order.customerName)) {
                        uniqueClients.set(order.customerName, {
                            name: order.customerName,
                            phone: order.customerPhone || 'Não informado'
                        });
                    }
                });

                return Array.from(uniqueClients.values()).sort((a, b) => a.name.localeCompare(b.name));
            };

            const clients = getClientList();

            return (
                <div className="min-h-screen pb-24">
                    {showInstallButton && !isStandalone && (
                        <button 
                            onClick={handleInstallClick}
                            className="install-prompt"
                        >
                            <i data-lucide="download" className="w-5 h-5"></i>
                            <span>INSTALAR APP NA ÁREA DE TRABALHO</span>
                        </button>
                    )}

                    <header className="p-4 border-b border-white/5 bg-black/90 backdrop-blur-sm flex items-center justify-between sticky top-0 z-50">
                        <div className="flex items-center gap-3">
                            <img src={LOGO_URL} className="w-10 h-10 rounded-full border border-[#d4af37]/30" alt="Logo" />
                            <div>
                                <h1 className="font-usarmy text-[#d4af37] text-sm">ALCANTARA ARMEIRO</h1>
                                <p className="text-[8px] text-gray-500">SISTEMA PRO V15.0</p>
                            </div>
                        </div>
                        <button
                            onClick={async () => {
                                const ok = await confirmDialog({
                                    message: 'SAIR DO SISTEMA?',
                                    subMessage: 'Sua sessão será encerrada.',
                                    confirmLabel: 'SAIR',
                                    confirmClass: 'bg-red-600 text-white',
                                    icon: 'log-out'
                                });
                                if (ok) { SafeStorage.removeItem('alcantara_auth'); window.location.reload(); }
                            }}
                            className="btn-icon text-red-500"
                            aria-label="Sair do sistema"
                        >
                            <i data-lucide="log-out" className="w-5 h-5"></i>
                        </button>
                    </header>

                    {confirmModal}
                    <main role="main" className="p-4 max-w-lg mx-auto">
                        {view === 'dashboard' && (
                            <Dashboard 
                                orders={orders} 
                                clients={clients}
                                setView={(v) => { 
                                    if(v === 'create') setSelectedOrder(null); 
                                    setView(v); 
                                }}
                                onOpenOrders={({ stage = 'TODOS', payment = 'TODOS' }) => {
                                    setOrderListStageFilter(stage);
                                    setOrderListPaymentFilter(payment);
                                    setView('list');
                                }} 
                            />
                        )}

                        {view === 'list' && (
                            <OrderList 
                                orders={filteredOrders}
                                searchTerm={searchTerm}
                                setSearchTerm={setSearchTerm}
                                initialStageFilter={orderListStageFilter}
                                initialPaymentFilter={orderListPaymentFilter}
                                onSelect={(o) => { setSelectedOrder(o); setView('detail'); }} 
                                onBack={() => setView('dashboard')} 
                            />
                        )}

                        {view === 'create' && (
                            <OrderForm 
                                order={selectedOrder} 
                                onOpenEquipmentHistory={() => setView('equipment_history')} 
                                onSave={(savedOrder) => { 
                                    dispatch({ type: 'LOAD' });
                                    if (savedOrder) setSelectedOrder(savedOrder);
                                    setView(selectedOrder ? 'detail' : 'list'); 
                                }} 
                                onBack={() => setView(selectedOrder ? 'detail' : 'dashboard')} 
                            />
                        )}

                        {view === 'detail' && (
                            <OrderDetail 
                                order={selectedOrder} 
                                onEdit={() => setView('create')} 
                                onBack={() => setView('list')} 
                                onDelete={() => {
                                    dispatch({ type: 'DELETE_ORDER', id: selectedOrder.id });
                                    setView('list');
                                    showToast("🗑️ Ordem excluída", "success");
                                }}
                            />
                        )}

                        {view === 'catalog' && (
                            <CatalogManager onBack={() => setView('dashboard')} />
                        )}

                        {view === 'products' && (
                            <ProductsManager onBack={() => setView('dashboard')} />
                        )}

                        {view === 'clients_list' && (
                            <ClientsList clients={clients} orders={orders} onBack={() => setView('dashboard')} />
                        )}

                        {view === 'tools' && (
                            <ToolsManager onBack={() => setView('dashboard')} />
                        )}

                        {view === 'bench_shortcut' && (
                            <BenchShortcut 
                                orders={orders}
                                onBack={() => setView('dashboard')}
                            />
                        )}

                        {view === 'gestao_home' && (
                            <GestaoHome onBack={() => setView('dashboard')} setView={setView} />
                        )}

                        {view === 'gestao_calculadora' && (
                            <GestaoCalculadora onBack={() => setView('gestao_home')} onHome={() => setView('gestao_home')} />
                        )}

                        {view === 'gestao_fornecedores' && (
                            <GestaoFornecedores onBack={() => setView('gestao_home')} onHome={() => setView('gestao_home')} />
                        )}

                        {view === 'gestao_pecas' && (
                            <GestaoPecas onBack={() => setView('gestao_home')} onHome={() => setView('gestao_home')} />
                        )}

                        {view === 'gestao_ferramentas' && (
                            <GestaoFerramentas onBack={() => setView('gestao_home')} onHome={() => setView('gestao_home')} />
                        )}


                        {view === 'assistencia_tecnica' && (
                            <AssistenciaTecnica onBack={() => setView('dashboard')} />
                        )}

                        {view === 'fornecedores' && (
                            <Fornecedores onBack={() => setView('dashboard')} />
                        )}

                        {view === 'equipment_history' && (
                            <EquipmentHistoryManager onBack={() => setView('dashboard')} />
                        )}

                        {view === 'alcantara_bank' && (
                            <AlcantaraBankIntegrated 
                                orders={orders}
                                onBack={() => setView('dashboard')}
                                onOpenOrder={(order) => { setSelectedOrder(order); setView('detail'); }}
                            />
                        )}

                        {view === 'profit_analysis' && (
                            <ProfitAnalysis onBack={() => setView('dashboard')} orders={orders} />
                        )}
                    </main>
                </div>
            );
        };


        const BenchShortcut = ({ orders, onBack }) => {
            const [selectedId, setSelectedId] = useState('');
            const [lastOrderId, setLastOrderId] = useState(SafeStorage.getItem('alcantara_last_bench_os') || '');

            const stageLabels = {
                ENTRADA: 'ENTRADA',
                TRIAGEM: 'TRIAGEM',
                DIAGNOSTICO: 'DIAGNÓSTICO',
                AGUARDANDO_APROVACAO: 'AGUARDANDO APROVAÇÃO',
                AGUARDANDO_PECA: 'AGUARDANDO PEÇA',
                EM_SERVICO: 'EM SERVIÇO',
                EM_TESTE: 'EM TESTE',
                PRONTO: 'PRONTO',
                ENTREGUE: 'ENTREGUE'
            };

            const activeOrders = useMemo(() => {
                return (orders || []).filter(o => {
                    const stage = o.operationalStatus || 'ENTRADA';
                    return stage !== 'ENTREGUE' && o.status !== 'CANCELADA';
                });
            }, [orders]);

            const selectedOrder = useMemo(() => {
                return activeOrders.find(o => o.id === selectedId)
                    || activeOrders.find(o => o.id === lastOrderId)
                    || activeOrders[0]
                    || null;
            }, [activeOrders, selectedId, lastOrderId]);

            useEffect(() => {
                if (selectedOrder?.id && selectedId !== selectedOrder.id) {
                    setSelectedId(selectedOrder.id);
                }
            }, [selectedOrder, selectedId]);

            const updateOperationalStage = (stage) => {
                if (!selectedOrder) return;

                const allOrders = JSON.parse(SafeStorage.getItem('alcantara_os') || '[]');
                const idx = allOrders.findIndex(o => o.id === selectedOrder.id);
                if (idx === -1) return;

                allOrders[idx] = {
                    ...allOrders[idx],
                    operationalStatus: stage,
                    lastOperationalUpdate: new Date().toLocaleString('pt-BR')
                };

                SafeStorage.setItem('alcantara_os', JSON.stringify(allOrders));
                SafeStorage.setItem('alcantara_last_bench_os', selectedOrder.id);
                setLastOrderId(selectedOrder.id);
                showToast(`✅ OS ${selectedOrder.osNumber} atualizada para ${stageLabels[stage]}`, 'success');
                setTimeout(() => window.location.reload(), 250);
            };

            const lastOrder = activeOrders.find(o => o.id === lastOrderId);

            return (
                <div className="space-y-6 animate-fadeIn pb-10">
                    <div className="flex items-center justify-between border-b border-white/10 pb-4">
                        <button type="button" onClick={onBack} className="btn-icon text-[#d4af37]">
                            <i data-lucide="arrow-left" className="w-5 h-5"></i>
                        </button>
                        <h2 className="font-usarmy text-[#d4af37] text-sm">ATALHO DE BANCADA</h2>
                        <div className="w-10"></div>
                    </div>

                    {lastOrder && (
                        <div className="os-card p-4 rounded-xl">
                            <p className="text-[10px] font-usarmy text-gray-500 mb-3">ÚLTIMA O.S. MOVIMENTADA</p>
                            <button
                                onClick={() => setSelectedId(lastOrder.id)}
                                className="w-full text-left p-3 rounded-xl border border-[#d4af37]/20 bg-[#d4af37]/5"
                            >
                                <p className="text-[9px] text-gray-500 font-mono mb-1">OS #{lastOrder.osNumber}</p>
                                <p className="font-bold text-white text-sm">{lastOrder.customerName}</p>
                                <p className="text-xs text-gray-500 mt-1">{lastOrder.equipment}</p>
                            </button>
                        </div>
                    )}

                    <div className="os-card p-4 rounded-xl">
                        <label className="text-[10px] font-usarmy text-gray-500 mb-2 block">SELECIONAR O.S.</label>
                        <select
                            className="w-full p-4 rounded-xl"
                            value={selectedOrder?.id || ''}
                            onChange={e => setSelectedId(e.target.value)}
                        >
                            {activeOrders.map(o => (
                                <option key={o.id} value={o.id}>
                                    {`OS ${o.osNumber} - ${o.customerName} - ${o.equipment}`}
                                </option>
                            ))}
                        </select>
                    </div>

                    {selectedOrder ? (
                        <>
                            <div className="os-card p-4 rounded-xl">
                                <div className="flex justify-between items-start gap-3">
                                    <div className="min-w-0">
                                        <p className="text-[9px] text-gray-500 font-mono mb-1">OS #{selectedOrder.osNumber}</p>
                                        <p className="font-bold text-white text-sm">{selectedOrder.customerName}</p>
                                        <p className="text-xs text-gray-500 mt-1">{selectedOrder.equipment}</p>
                                        <p className="text-[10px] text-gray-400 mt-3">
                                            Etapa atual: <span className="text-[#d4af37] font-bold">{stageLabels[selectedOrder.operationalStatus || 'ENTRADA']}</span>
                                        </p>
                                        <p className="text-[10px] text-gray-500 mt-1">
                                            Pagamento: {selectedOrder.paymentStatus || 'PENDENTE'}
                                        </p>
                                    </div>
                                    <div className="text-right">
                                        <p className="font-usarmy text-[#d4af37] text-base">R$ {calculateTotal(selectedOrder).toFixed(2)}</p>
                                    </div>
                                </div>
                            </div>

                            <div className="os-card p-4 rounded-xl">
                                <p className="text-[10px] font-usarmy text-gray-500 mb-3">ETAPAS OPERACIONAIS</p>
                                <div className="grid grid-cols-2 gap-3">
                                    {Object.entries(stageLabels).map(([key, label]) => {
                                        const active = (selectedOrder.operationalStatus || 'ENTRADA') === key;
                                        return (
                                            <button
                                                key={key}
                                                onClick={() => updateOperationalStage(key)}
                                                className={active
                                                    ? "p-4 rounded-xl gold-gradient font-usarmy text-[10px]"
                                                    : "p-4 rounded-xl border border-white/10 text-gray-300 font-usarmy text-[10px]"}
                                            >
                                                {label}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        </>
                    ) : (
                        <div className="os-card p-6 rounded-xl text-center">
                            <i data-lucide="clipboard" className="w-12 h-12 text-gray-700 mx-auto mb-3"></i>
                            <p className="font-usarmy text-gray-400 text-xs">NENHUMA O.S. DISPONÍVEL</p>
                        </div>
                    )}
                </div>
            );
        };


        // ========== LOGIN ==========
        const Login = ({ onLogin }) => {
            const [pass, setPass] = useState('');
            const [error, setError] = useState(false);
            const [shake, setShake] = useState(false);
            const inputRef = useRef(null);

            const handleLogin = () => {
                if (verifyPassword(pass)) {
                    SafeStorage.setItem('alcantara_auth', 'true');
                    onLogin();
                } else {
                    setError(true);
                    setShake(true);
                    setTimeout(() => setShake(false), 300);
                    setTimeout(() => setError(false), 2000);
                    setPass('');
                    inputRef.current?.focus();
                }
            };

            return (
                <div className="fixed inset-0 z-[100] bg-black flex flex-col items-center justify-center px-8">
                    <div
                        className="absolute inset-0 opacity-25"
                        style={{backgroundImage: 'radial-gradient(circle at center, rgba(80,60,10,0.35) 0%, #050505 55%, #000 100%)'}}
                    ></div>

                    <div className="relative z-10 flex flex-col items-center w-full max-w-sm">
                        <div className="splash-logo-wrap mb-6 splash-fade-up">
                            <div className="splash-logo-glow"></div>
                            <img src={LOGO_URL} className="relative w-36 h-36 rounded-full border-2 border-[#d4af37]/35" alt="Logo" />
                        </div>

                        <div className="text-center splash-fade-up" style={{ animationDelay: '0.12s' }}>
                            <h1 className="font-usarmy splash-title-gold text-[34px] leading-[0.95] tracking-[0.08em]">
                                ALCANTARA<br />ARMEIRO
                            </h1>
                            <p className="text-[11px] text-gray-500 font-bold tracking-[0.42em] mt-3">AIRSOFT REPAIRS</p>
                            <div className="splash-loading-track">
                                <div className="splash-loading-bar"></div>
                            </div>
                        </div>

                        <div className="w-full mt-10 space-y-6 relative z-10 splash-fade-up" style={{ animationDelay: '0.24s' }}>
                            <div className="text-center space-y-2">
                                <h2 className="font-usarmy text-[#d4af37] text-xl">SISTEMA TÁTICO</h2>
                                <p className="text-[10px] text-gray-500 font-medium tracking-[0.3em]">AUTENTICAÇÃO DE OPERADOR</p>
                            </div>

                            <div className="relative">
                                <input 
                                    ref={inputRef}
                                    type="password" 
                                    placeholder="DIGITE A SENHA DE ACESSO"
                                    autoComplete="current-password"
                                    className={`w-full bg-[#0a0a0a] border ${error ? 'border-red-600' : 'border-white/10'} p-4 rounded-xl text-center text-sm tracking-[0.2em] outline-none ${shake ? 'shake' : ''}`}
                                    value={pass} 
                                    onChange={e => setPass(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && handleLogin()}
                                    autoFocus
                                />
                                {error && (
                                    <p className="absolute -bottom-6 text-center text-[9px] text-red-500 font-bold w-full">
                                        ACESSO NEGADO - CREDENCIAIS INVÁLIDAS
                                    </p>
                                )}
                            </div>

                            <button 
                                onClick={handleLogin}
                                className="w-full gold-gradient p-4 rounded-xl font-usarmy text-sm tracking-widest"
                            >
                                AUTORIZAR ENTRADA
                            </button>
                        </div>
                    </div>

                    <div className="absolute bottom-10 text-center splash-fade-up" style={{ animationDelay: '0.34s' }}>
                        <p className="text-[8px] text-gray-600 font-usarmy tracking-[0.5em]">ALCANTARA PRO v7.0</p>
                    </div>
                </div>
            );
        };

        // ========== NOVO COMPONENTE: ANÁLISE DE LUCRATIVIDADE ==========
        const ProfitAnalysis = ({ onBack, orders }) => {
            const [periodFilter, setPeriodFilter] = useState('all');
            const [dateRange, setDateRange] = useState({ start: '', end: '' });
            const [activeTab, setActiveTab] = useState('overview');

            // Períodos pré-definidos
            const getPeriodDates = (period) => {
                const today = new Date();
                const end = today.toISOString().split('T')[0];
                let start = new Date();

                switch(period) {
                    case '7days':
                        start.setDate(today.getDate() - 7);
                        break;
                    case '30days':
                        start.setDate(today.getDate() - 30);
                        break;
                    case '90days':
                        start.setDate(today.getDate() - 90);
                        break;
                    case 'thisMonth':
                        start = new Date(today.getFullYear(), today.getMonth(), 1);
                        break;
                    case 'lastMonth':
                        start = new Date(today.getFullYear(), today.getMonth() - 1, 1);
                        const lastDayLastMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                        return { start: start.toISOString().split('T')[0], end: lastDayLastMonth.toISOString().split('T')[0] };
                    case 'thisYear':
                        start = new Date(today.getFullYear(), 0, 1);
                        break;
                    default:
                        return { start: '', end: '' };
                }
                return { start: start.toISOString().split('T')[0], end };
            };

            // Aplicar filtro de período
            useEffect(() => {
                if (periodFilter !== 'custom') {
                    setDateRange(getPeriodDates(periodFilter));
                }
            }, [periodFilter]);

            // Filtrar ordens por período
            const filteredOrders = useMemo(() => {
                if (!dateRange.start || !dateRange.end) return orders;

                return orders.filter(order => {
                    if (!order.date) return false;
                    const [day, month, year] = order.date.split('/');
                    // Usar T12:00:00 para evitar bug de fuso-horário (UTC off-by-one)
                    const orderDate = new Date(`${year}-${month}-${day}T12:00:00`);
                    const start = new Date(`${dateRange.start}T00:00:00`);
                    const end = new Date(`${dateRange.end}T23:59:59`);
                    return orderDate >= start && orderDate <= end;
                });
            }, [orders, dateRange]);

            // Cálculos financeiros detalhados
            const financialMetrics = useMemo(() => {
                let totalRevenue = 0;
                let totalServices = 0;
                let totalParts = 0;
                let totalProducts = 0;
                let totalDiscounts = 0;
                let servicesCount = 0;
                let partsCount = 0;
                let ordersWithServices = 0;
                let ordersWithParts = 0;

                const serviceBreakdown = {};
                const equipmentBreakdown = {};

                filteredOrders.forEach(order => {
                    if (order.status === 'CANCELADA') return;

                    const subtotal = calculateSubtotal(order);
                    const discount = calculateDiscount(order);
                    const total = calculateTotal(order);

                    totalRevenue += total;
                    totalDiscounts += discount;

                    // Serviços
                    if (order.services && order.services.length > 0) {
                        ordersWithServices++;
                        order.services.forEach(service => {
                            const price = parseFloat(service.price) || 0;
                            totalServices += price;
                            servicesCount++;

                            if (!serviceBreakdown[service.name]) {
                                serviceBreakdown[service.name] = { count: 0, revenue: 0 };
                            }
                            serviceBreakdown[service.name].count++;
                            serviceBreakdown[service.name].revenue += price;
                        });
                    }

                    // Peças
                    if (order.parts && order.parts.length > 0) {
                        ordersWithParts++;
                        order.parts.forEach(part => {
                            const price = parseFloat(part.price) || 0;
                            totalParts += price;
                            partsCount++;
                        });
                    }

                    // Produtos
                    if (order.products && order.products.length > 0) {
                        order.products.forEach(product => {
                            totalProducts += parseFloat(product.price) || 0;
                        });
                    }

                    // Por equipamento
                    if (order.equipment) {
                        if (!equipmentBreakdown[order.equipment]) {
                            equipmentBreakdown[order.equipment] = { count: 0, revenue: 0 };
                        }
                        equipmentBreakdown[order.equipment].count++;
                        equipmentBreakdown[order.equipment].revenue += total;
                    }
                });

                // Calcular custos estimados (assumindo 60% margem para peças)
                const estimatedPartsCost = totalParts * 0.4; // 40% do valor é custo
                const estimatedPartsProfit = totalParts * 0.6; // 60% é lucro

                // Lucro de serviços = 100% (mão de obra)
                const servicesProfit = totalServices;

                // Lucro de produtos (assumindo 30% margem)
                const productsProfit = totalProducts * 0.3;
                const productsCost = totalProducts * 0.7;

                const totalProfit = servicesProfit + estimatedPartsProfit + productsProfit;
                const totalCosts = estimatedPartsCost + productsCost;

                return {
                    totalRevenue,
                    totalServices,
                    totalParts,
                    totalProducts,
                    totalDiscounts,
                    servicesProfit,
                    estimatedPartsProfit,
                    productsProfit,
                    totalProfit,
                    estimatedPartsCost,
                    productsCost,
                    totalCosts,
                    servicesCount,
                    partsCount,
                    ordersWithServices,
                    ordersWithParts,
                    totalOrders: filteredOrders.filter(o => o.status !== 'CANCELADA').length,
                    serviceBreakdown: Object.entries(serviceBreakdown)
                        .sort((a, b) => b[1].revenue - a[1].revenue)
                        .slice(0, 10),
                    equipmentBreakdown: Object.entries(equipmentBreakdown)
                        .sort((a, b) => b[1].revenue - a[1].revenue)
                        .slice(0, 5),
                    profitMargin: totalRevenue > 0 ? ((totalProfit / totalRevenue) * 100).toFixed(1) : 0,
                    avgTicket: filteredOrders.filter(o => o.status !== 'CANCELADA').length > 0 
                        ? totalRevenue / filteredOrders.filter(o => o.status !== 'CANCELADA').length 
                        : 0
                };
            }, [filteredOrders]);

            const formatCurrency = (value) => {
                return new Intl.NumberFormat('pt-BR', {
                    style: 'currency',
                    currency: 'BRL'
                }).format(value);
            };

            const periodOptions = [
                { value: 'all', label: 'TODOS OS PERÍODOS' },
                { value: '7days', label: 'ÚLTIMOS 7 DIAS' },
                { value: '30days', label: 'ÚLTIMOS 30 DIAS' },
                { value: '90days', label: 'ÚLTIMOS 90 DIAS' },
                { value: 'thisMonth', label: 'ESTE MÊS' },
                { value: 'lastMonth', label: 'MÊS PASSADO' },
                { value: 'thisYear', label: 'ESTE ANO' },
                { value: 'custom', label: 'PERÍODO PERSONALIZADO' }
            ];

            return (
                <div className="space-y-6 animate-fadeIn pb-10">
                    {/* Header */}
                    <div className="flex items-center justify-between border-b border-white/10 pb-4">
                        <button type="button" onClick={onBack} className="btn-icon text-[#d4af37]">
                            <i data-lucide="arrow-left" className="w-5 h-5"></i>
                        </button>
                        <h2 className="font-usarmy text-[#d4af37] text-sm">ANÁLISE DE LUCRATIVIDADE</h2>
                        <div className="w-10"></div>
                    </div>

                    {/* Seletor de Período */}
                    <div className="os-card p-4 rounded-xl space-y-4">
                        <div className="flex items-center gap-2 mb-2">
                            <i data-lucide="calendar" className="w-4 h-4 text-[#d4af37]"></i>
                            <span className="text-[10px] font-usarmy text-gray-500">PERÍODO DE ANÁLISE</span>
                        </div>

                        <select 
                            value={periodFilter}
                            onChange={(e) => setPeriodFilter(e.target.value)}
                            className="w-full p-3 rounded-lg text-sm"
                        >
                            {periodOptions.map(opt => (
                                <option key={opt.value} value={opt.value}>{opt.label}</option>
                            ))}
                        </select>

                        {periodFilter === 'custom' && (
                            <div className="grid grid-cols-2 gap-1.5">
                                <div>
                                    <label className="text-[9px] text-gray-500 block mb-1">DATA INÍCIO</label>
                                    <input 
                                        type="date" 
                                        value={dateRange.start}
                                        onChange={(e) => setDateRange({...dateRange, start: e.target.value})}
                                        className="w-full p-2 rounded-lg text-sm"
                                    />
                                </div>
                                <div>
                                    <label className="text-[9px] text-gray-500 block mb-1">DATA FIM</label>
                                    <input 
                                        type="date" 
                                        value={dateRange.end}
                                        onChange={(e) => setDateRange({...dateRange, end: e.target.value})}
                                        className="w-full p-2 rounded-lg text-sm"
                                    />
                                </div>
                            </div>
                        )}

                        {dateRange.start && dateRange.end && (
                            <p className="text-[10px] text-center text-[#d4af37]">
                                {new Date(`${dateRange.start}T12:00:00`).toLocaleDateString('pt-BR')} até {new Date(`${dateRange.end}T12:00:00`).toLocaleDateString('pt-BR')}
                            </p>
                        )}
                    </div>

                    {/* Tabs de Navegação */}
                    <div className="flex gap-2">
                        <button 
                            onClick={() => setActiveTab('overview')}
                            className={`flex-1 py-3 px-2 rounded-lg text-[10px] font-bold transition-all ${
                                activeTab === 'overview' ? 'tab-active' : 'tab-inactive'
                            }`}
                        >
                            VISÃO GERAL
                        </button>
                        <button 
                            onClick={() => setActiveTab('breakdown')}
                            className={`flex-1 py-3 px-2 rounded-lg text-[10px] font-bold transition-all ${
                                activeTab === 'breakdown' ? 'tab-active' : 'tab-inactive'
                            }`}
                        >
                            DETALHAMENTO
                        </button>
                        <button 
                            onClick={() => setActiveTab('services')}
                            className={`flex-1 py-3 px-2 rounded-lg text-[10px] font-bold transition-all ${
                                activeTab === 'services' ? 'tab-active' : 'tab-inactive'
                            }`}
                        >
                            SERVIÇOS
                        </button>
                    </div>

                    {/* TAB: VISÃO GERAL */}
                    {activeTab === 'overview' && (
                        <div className="space-y-4">
                            {/* Cards Principais */}
                            <div className="grid grid-cols-2 gap-3">
                                <div className="card-lucro p-4 rounded-xl">
                                    <div className="flex items-center gap-2 mb-2">
                                        <i data-lucide="trending-up" className="w-4 h-4 text-green-400"></i>
                                        <p className="text-[9px] text-green-400 font-usarmy">LUCRO TOTAL</p>
                                    </div>
                                    <p className="text-xl font-usarmy text-green-400">
                                        {formatCurrency(financialMetrics.totalProfit)}
                                    </p>
                                    <p className="text-[9px] text-gray-500 mt-1">
                                        Margem: {financialMetrics.profitMargin}%
                                    </p>
                                </div>

                                <div className="card-faturamento p-4 rounded-xl">
                                    <div className="flex items-center gap-2 mb-2">
                                        <i data-lucide="dollar-sign" className="w-4 h-4 text-orange-400"></i>

                                    <p className="text-xl font-usarmy text-orange-400">
                                        {formatCurrency(financialMetrics.totalRevenue)}

                                    <p className="text-[9px] text-gray-500 mt-1">
                                        {financialMetrics.totalOrders} ordens
                                    </p>
                                </div>

                                <div className="card-custos p-4 rounded-xl">

                                        <p className="text-[9px] text-red-400 font-usarmy">CUSTOS ESTIMADOS</p>
                                    </div>
                                    <p className="text-xl font-usarmy text-red-400">
                                        {formatCurrency(financialMetrics.totalCosts)}
                                    </p>
                                    <p className="text-[9px] text-gray-500 mt-1">
                                        Peças + Produtos
                                    </p>

                                <div className="card-missoes p-4 rounded-xl">

                                    </div>
                                    <p className="text-xl font-usarmy text-blue-400">

                                    <p className="text-[9px] text-gray-500 mt-1">
                                        Por ordem
                                    </p>
                                </div>
                            </div>

                            {/* Resumo por Categoria */}
                            <div className="os-card p-5 rounded-xl">
                                <p className="text-[10px] font-usarmy text-[#d4af37] mb-4
                                    text-center">
                                    BREAKDOWN POR CATEGORIA
                                </p>

                                {/* Serviços */}
                                <div className="mb-4">
                                    <div className="flex justify-between items-center mb-2">
                                        <div className="flex items-center gap-2">
                                            <div className="w-3 h-3 rounded-full bg-blue-500"></div>
                                            <span className="text-sm text-white font-bold">Serviços (Mão de Obra)</span>
                                        </div>
                                        <span className="text-[#d4af37] font-bold">{formatCurrency(financialMetrics.totalServices)}</span>
                                    </div>
                                    <div className="profit-bar-container">
                                        <div 
                                            className="profit-bar bg-blue-500"
                                            style={{ width: financialMetrics.totalRevenue > 0 ? `${(financialMetrics.totalServices/financialMetrics.totalRevenue)*100}%` : '0%' }}
                                        ></div>
                                    </div>
                                    <p className="text-[9px] text-green-400 mt-1">
                                        Lucro: {formatCurrency(financialMetrics.servicesProfit)} (100% margem)
                                    </p>
                                </div>

                                {/* Peças */}
                                <div className="mb-4">
                                    <div className="flex justify-between items-center mb-2">
                                        <div className="flex items-center gap-2">
                                            <div className="w-3 h-3 rounded-full bg-yellow-500"></div>
                                            <span className="text-sm text-white font-bold">Peças</span>
                                        </div>
                                        <span className="text-[#d4af37] font-bold">{formatCurrency(financialMetrics.totalParts)}</span>
                                    </div>
                                    <div className="profit-bar-container">
                                        <div 
                                            className="profit-bar bg-yellow-500"
                                            style={{ width: financialMetrics.totalRevenue > 0 ? `${(financialMetrics.totalParts/financialMetrics.totalRevenue)*100}%` : '0%' }}
                                        ></div>
                                    </div>
                                    <div className="flex justify-between text-[9px] mt-1">
                                        <span className="text-red-400">Custo est.: {formatCurrency(financialMetrics.estimatedPartsCost)}</span>
                                        <span className="text-green-400">Lucro est.: {formatCurrency(financialMetrics.estimatedPartsProfit)}</span>
                                    </div>
                                </div>

                                {/* Produtos */}
                                <div>
                                    <div className="flex justify-between items-center mb-2">
                                        <div className="flex items-center gap-2">
                                            <div className="w-3 h-3 rounded-full bg-green-500"></div>
                                            <span className="text-sm text-white font-bold">Produtos</span>
                                        </div>
                                        <span className="text-[#d4af37] font-bold">{formatCurrency(financialMetrics.totalProducts)}</span>
                                    </div>
                                    <div className="profit-bar-container">
                                        <div 
                                            className="profit-bar bg-green-500"
                                            style={{ width: financialMetrics.totalRevenue > 0 ? `${(financialMetrics.totalProducts/financialMetrics.totalRevenue)*100}%` : '0%' }}
                                        ></div>
                                    </div>
                                    <div className="flex justify-between text-[9px] mt-1">
                                        <span className="text-red-400">Custo est.: {formatCurrency(financialMetrics.productsCost)}</span>
                                        <span className="text-green-400">Lucro est.: {formatCurrency(financialMetrics.productsProfit)}</span>
                                    </div>
                                </div>
                            </div>

                            {/* Indicadores de Performance */}
                            <div className="os-card p-5 rounded-xl">
                                <p className="text-[10px] font-usarmy text-[#d4af37] mb-4
                                    text-center">
                                     INDICADORES DE PERFORMANCE
                                </p>

                                <div className="grid grid-cols-2 gap-4">
                                    <div className="text-center p-3 bg-black/20 rounded-lg">
                                        <p className="text-2xl font-usarmy text-white">{financialMetrics.totalOrders}</p>
                                        <p className="text-[9px] text-gray-500">Total de Ordens</p>
                                    </div>
                                    <div className="text-center p-3 bg-black/20 rounded-lg">
                                        <p className="text-2xl font-usarmy text-white">{financialMetrics.ordersWithServices}</p>
                                        <p className="text-[9px] text-gray-500">Com Serviços</p>
                                    </div>
                                    <div className="text-center p-3 bg-black/20 rounded-lg">
                                        <p className="text-2xl font-usarmy text-white">{financialMetrics.servicesCount}</p>
                                        <p className="text-[9px] text-gray-500">Serviços Realizados</p>
                                    </div>
                                    <div className="text-center p-3 bg-black/20 rounded-lg">
                                        <p className="text-2xl font-usarmy text-white">{financialMetrics.partsCount}</p>
                                        <p className="text-[9px] text-gray-500">Peças Utilizadas</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TAB: DETALHAMENTO */}
                    {activeTab === 'breakdown' && (
                        <div className="space-y-4">
                            {/* Análise de Custos vs Receitas */}
                            <div className="os-card p-5 rounded-xl">
                                <p className="text-[10px] font-usarmy text-[#d4af37] mb-4
                                    text-center">
                                   ANÁLISE DE CUSTOS VS RECEITAS
                                </p>

                                <div className="space-y-4">

                                        <div className="flex justify-between items-center mb-2">

                                        <div className="profit-bar-container">

                                        </div>
                                    </div>

                                    <div className="breakdown-item p-3 rounded-lg">
                                        <div className="flex justify-between items-center mb-2">

                                                -{formatCurrency(financialMetrics.totalDiscounts)}
                                            </span>

                                            <div 
                                                className="profit-bar bg-red-500" 
                                                style={{ width: financialMetrics.totalRevenue > 0 ? `${(financialMetrics.totalDiscounts/(financialMetrics.totalRevenue + financialMetrics.totalDiscounts))*100}%` : '0%' }}

            const [pecas, setPecas] = useState(() => {
                try { return JSON.parse(SafeStorage.getItem('gf_pecas')) || []; } 
                catch(e) { return []; }
            });
            const [margemPadrao, setMargemPadrao] = useState(() => {
                try { 
                    const saved = SafeStorage.getItem('gf_margem');
                    return saved ? parseInt(saved) : 60; 
                }
                catch(e) { return 60; }
            });

            useEffect(() => {
                SafeStorage.setItem('gf_fornecedores', JSON.stringify(fornecedores));
            }, [fornecedores]);

            useEffect(() => {
                SafeStorage.setItem('gf_pecas', JSON.stringify(pecas));
            }, [pecas]);

            useEffect(() => {
                SafeStorage.setItem('gf_margem', margemPadrao.toString());
            }, [margemPadrao]);

            const calcularPrecoVenda = useCallback((preco, margem) => {
                let m;
                if (margem === undefined || margem === null || margem === '') {
                    m = margemPadrao;
                } else {
                    m = parseFloat(margem);
                    if (isNaN(m)) m = margemPadrao;
                }

                const p = parseFloat(preco);
                if (isNaN(p) || p <= 0) return '0.00';
                return (p * (1 + m / 100)).toFixed(2);
            }, [margemPadrao]);

            return {
                fornecedores, setFornecedores,
                pecas, setPecas,
                margemPadrao, setMargemPadrao,
                calcularPrecoVenda
            };

            const margem = parseFloat(calcMargem) || 0;
