            const lucro = venda - preco;

            return (
                <div className="space-y-6 animate-fadeIn pb-10">
                    <div className="flex items-center justify-between border-b border-white/10 pb-4">
                        <button type="button" onClick={onBack} className="btn-icon text-[#d4af37]">
                            <i data-lucide="arrow-left" className="w-5 h-5"></i>
                        </button>
                        <h2 className="font-usarmy text-[#d4af37] text-sm">CALCULADORA</h2>
                        <button onClick={onHome} className="btn-icon text-[#d4af37]">
                            <i data-lucide="home" className="w-5 h-5"></i>
                        </button>
                    </div>

                    <div className="os-card p-8 rounded-2xl border-2 border-[#d4af37]/30 text-center">
                        <p className="text-[10px] text-gray-500 font-usarmy mb-2">PREÇO DE VENDA</p>
                        <p className="text-4xl font-usarmy text-[#d4af37]">R$ {venda.toFixed(2).replace('.', ',')}</p>
                    </div>

                    <div className="os-card p-5 space-y-4">
                        <div className="flex justify-between items-center py-2 border-b border-white/5">
                            <span className="text-gray-400 text-sm">Preço de Compra</span>
                            <span className="text-red-400 font-bold">R$ {preco.toFixed(2).replace('.', ',')}</span>
                        </div>
                        <div className="flex justify-between items-center py-2 border-b border-white/5">
                            <span className="text-gray-400 text-sm">Lucro Estimado</span>
                            <span className="text-green-400 font-bold">R$ {lucro.toFixed(2).replace('.', ',')}</span>
                        </div>
                        <div className="flex justify-between items-center py-2">
                            <span className="text-gray-400 text-sm">Margem Aplicada</span>
                            <span className="text-[#d4af37] font-bold">{margem}%</span>
                        </div>
                    </div>

                    <div className="os-card p-5 space-y-4">
                        <div>
                            <label className="text-[10px] font-usarmy text-gray-500 mb-2 block">PREÇO DE COMPRA (R$)</label>
                            <input 
                                type="number" 
                                step="0.01"
                                placeholder="0,00" 
                                value={calcCompra}
                                onChange={e => setCalcCompra(e.target.value)}
                                className="w-full"
                            />
                        </div>
                        <div>
                            <label className="text-[10px] font-usarmy text-gray-500 mb-2 block">MARGEM DE LUCRO (%)</label>
                            <input 
                                type="number" 
                                placeholder="60" 
                                value={calcMargem}
                                onChange={e => setCalcMargem(e.target.value)}
                                className="w-full"
                            />
                        </div>
                    </div>
                </div>
            );
        };

        const GestaoFornecedores = ({ onBack, onHome }) => {
            const { fornecedores, setFornecedores, pecas } = useGestaoData();
            const { confirm, modal: confirmModal } = useConfirm();
            const [form, setForm] = useState({ nome: '', telefone: '', email: '' });
            const [editando, setEditando] = useState(null);
            const [busca, setBusca] = useState('');

            const fornecedoresFiltrados = useMemo(() => 
                fornecedores.filter(f => {
                    const termo = busca.toLowerCase();
                    return f.nome.toLowerCase().includes(termo) || (f.telefone && f.telefone.includes(busca));
                }), [fornecedores, busca]);

            const adicionar = () => {
                if (!form.nome.trim()) {
                    showToast('Digite o nome do fornecedor');
                    return;
                }
                const fornecedor = {
                    id: Date.now().toString(),
                    ...form,
                    dataCadastro: new Date().toLocaleDateString('pt-BR')
                };
                setFornecedores(prev => [...prev, fornecedor]);
                setForm({ nome: '', telefone: '', email: '' });
                showToast('Fornecedor adicionado!');
            };

            const atualizar = () => {
                if (!editando || !editando.nome.trim()) return;
                setFornecedores(prev => prev.map(f => f.id === editando.id ? editando : f));
                setEditando(null);
                showToast('Fornecedor atualizado!');
            };

            const excluir = (id) => {
                if (confirm('Tem certeza que deseja excluir este fornecedor?')) {
                    setFornecedores(prev => prev.filter(f => f.id !== id));
                    showToast('Fornecedor excluído!');
                }
            };

            return (
                <div className="space-y-6 animate-fadeIn pb-10">
                    <div className="flex items-center justify-between border-b border-white/10 pb-4">
                        <button type="button" onClick={onBack} className="btn-icon text-[#d4af37]">
                            <i data-lucide="arrow-left" className="w-5 h-5"></i>
                        </button>
                        <h2 className="font-usarmy text-[#d4af37] text-sm">FORNECEDORES</h2>
                        <button onClick={onHome} className="btn-icon text-[#d4af37]">
                            <i data-lucide="home" className="w-5 h-5"></i>
                        </button>
                    </div>

                    <div className="os-card p-5 space-y-4">
                        <p className="text-[10px] font-usarmy text-[#d4af37] mb-2">{editando ? 'EDITAR FORNECEDOR' : 'NOVO FORNECEDOR'}</p>

                        {editando ? (
                            <>
                                <input placeholder="Nome" value={editando.nome} onChange={e => setEditando({...editando, nome: e.target.value})} />
                                <input placeholder="Telefone" value={editando.telefone} onChange={e => setEditando({...editando, telefone: e.target.value})} />
                                <input placeholder="Email" value={editando.email} onChange={e => setEditando({...editando, email: e.target.value})} />
                                <div className="flex gap-2">
                                    <button onClick={atualizar} className="flex-1 gold-gradient p-3 rounded-xl font-usarmy text-xs">SALVAR</button>
                                    <button onClick={() => setEditando(null)} className="flex-1 border border-white/10 p-3 rounded-xl text-gray-400 font-usarmy text-xs">CANCELAR</button>
                                </div>
                            </>
                        ) : (
                            <>
                                <input placeholder="Nome *" value={form.nome} onChange={e => setForm({...form, nome: e.target.value})} />
                                <input placeholder="Telefone" value={form.telefone} onChange={e => setForm({...form, telefone: e.target.value})} />
                                <input placeholder="Email" value={form.email} onChange={e => setForm({...form, email: e.target.value})} />
                                <button onClick={adicionar} className="w-full gold-gradient p-4 rounded-xl font-usarmy text-sm">+ ADICIONAR</button>
                            </>
                        )}
                    </div>

                    <div className="relative">
                        <i data-lucide="search" className="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
                        <input 
                            type="text"
                            placeholder="Buscar fornecedor..."
                            className="w-full pl-12"
                            value={busca}
                            onChange={e => setBusca(e.target.value)}
                        />
                    </div>

                    <div className="space-y-3">
                        {fornecedoresFiltrados.length === 0 ? (
                            <div className="text-center py-12 text-gray-600">
                                <i data-lucide="store" className="w-12 h-12 mx-auto mb-4 opacity-50"></i>
                                <p className="font-usarmy text-xs">Nenhum fornecedor cadastrado</p>
                            </div>
                        ) : (
                            fornecedoresFiltrados.map(f => {
                                const qtd = pecas.filter(p => p.fornecedorId === f.id).length;
                                return (
                                    <div key={f.id} className="os-card p-4 rounded-xl border-l-2 border-[#d4af37]/40">
                                        <div className="flex justify-between items-start">
                                            <div className="flex-1">
                                                <p className="text-white font-bold">{f.nome}</p>
                                                <p className="text-xs text-gray-500 mt-1">{f.telefone || 'Sem telefone'} • {qtd} peças</p>
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={() => setEditando(f)} className="btn-icon text-[#d4af37] w-8 h-8">
                                                    <i data-lucide="edit" className="w-4 h-4"></i>
                                                </button>
                                                <button onClick={() => excluir(f.id)} className="btn-icon text-red-500 w-8 h-8">
                                                    <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })
                        )}
                    </div>
                </div>
            );
        };

        const GestaoPecas = ({ onBack, onHome }) => {
            const { pecas, setPecas, fornecedores, margemPadrao, setMargemPadrao, calcularPrecoVenda } = useGestaoData();
            const { confirm, modal: confirmModal } = useConfirm();
            const [form, setForm] = useState({ nome: '', fornecedorId: '', precoCompra: '', codigo: '', margem: '' });
            const [editando, setEditando] = useState(null);
            const [busca, setBusca] = useState('');

            const pecasFiltradas = useMemo(() => 
                pecas.filter(p => {
                    const termo = busca.toLowerCase();
                    const fornecedor = fornecedores.find(f => f.id === p.fornecedorId);
                    return p.nome.toLowerCase().includes(termo) || 
                           (p.codigo && p.codigo.toLowerCase().includes(termo)) ||
                           (fornecedor && fornecedor.nome.toLowerCase().includes(termo));
                }), [pecas, fornecedores, busca]);

            const adicionar = () => {
                if (!form.nome.trim() || !form.fornecedorId || !form.precoCompra) {
                    showToast('Preencha todos os campos obrigatórios');
                    return;
                }
                const preco = parseFloat(form.precoCompra);
                if (isNaN(preco) || preco <= 0) {
                    showToast('Preço inválido');
                    return;
                }
                const margemPeca = form.margem !== '' && form.margem !== undefined ? parseInt(form.margem) : undefined;
                const peca = {
                    id: Date.now().toString(),
                    nome: form.nome.trim(),
                    fornecedorId: form.fornecedorId,
                    precoCompra: preco,
                    codigo: form.codigo ? form.codigo.trim() : '',
                    margem: margemPeca,
                    dataCadastro: new Date().toLocaleDateString('pt-BR')
                };
                setPecas(prev => [...prev, peca]);
                setForm({ nome: '', fornecedorId: '', precoCompra: '', codigo: '', margem: '' });
                showToast('Peça adicionada!');
            };

            const atualizar = () => {
                if (!editando || !editando.nome.trim()) return;
                const preco = parseFloat(editando.precoCompra);
                if (isNaN(preco) || preco <= 0) {
                    showToast('Preço inválido');
                    return;
                }
                let margemIndividual;
                if (editando.margem === '' || editando.margem === undefined || editando.margem === null) {
                    margemIndividual = undefined;
                } else {
                    margemIndividual = parseInt(editando.margem);
                    if (isNaN(margemIndividual)) margemIndividual = undefined;
                }

                setPecas(prev => prev.map(p => p.id === editando.id ? {
                    ...editando, 
                    precoCompra: preco, 
                    margem: margemIndividual
                } : p));
                setEditando(null);
                showToast('Peça atualizada!');
            };

            const excluir = async (id) => {
                const ok = await confirm({
                    message: 'EXCLUIR PEÇA?',
                    confirmLabel: 'EXCLUIR',
                    confirmClass: 'bg-red-600 text-white',
                    icon: 'trash-2'
                });
                if (ok) {
                    setPecas(prev => prev.filter(p => p.id !== id));
                    showToast('Peça excluída!');
                }
            };

            const copiar = (peca) => {
                const precoVenda = calcularPrecoVenda(peca.precoCompra, peca.margem);
                const texto = `${peca.nome}: R$ ${precoVenda.replace('.', ',')} (custo: R$ ${peca.precoCompra.toFixed(2).replace('.', ',')})`;
                navigator.clipboard?.writeText(texto).then(() => showToast('Preço copiado!'));
            };

            const iniciarEdicao = (peca) => {
                setEditando({
                    ...peca,
                    margem: peca.margem !== undefined && peca.margem !== null ? peca.margem : ''
                });
            };

            return (
                <div className="space-y-6 animate-fadeIn pb-10">
                    {confirmModal}
                    <div className="flex items-center justify-between border-b border-white/10 pb-4">
                        <button type="button" onClick={onBack} className="btn-icon text-[#d4af37]">
                            <i data-lucide="arrow-left" className="w-5 h-5"></i>
                        </button>
                        <h2 className="font-usarmy text-[#d4af37] text-sm">CATÁLOGO DE PEÇAS</h2>
                        <button onClick={onHome} className="btn-icon text-[#d4af37]">
                            <i data-lucide="home" className="w-5 h-5"></i>
                        </button>
                    </div>

                    <div className="os-card p-5 space-y-4">
                        <p className="text-[10px] font-usarmy text-gray-500">MARGEM PADRÃO: {margemPadrao}%</p>
                        <input 
                            type="number" 
                            value={margemPadrao} 
                            onChange={e => setMargemPadrao(Math.max(0, parseInt(e.target.value) || 0))}
                            className="w-full"
                        />
                    </div>

                    <div className="os-card p-5 space-y-4">
                        <p className="text-[10px] font-usarmy text-[#d4af37] mb-2">{editando ? 'EDITAR PEÇA' : 'NOVA PEÇA'}</p>

                        {editando ? (
                            <>
                                <input placeholder="Nome" value={editando.nome} onChange={e => setEditando({...editando, nome: e.target.value})} />
                                <input placeholder="Código" value={editando.codigo || ''} onChange={e => setEditando({...editando, codigo: e.target.value})} />
                                <select value={editando.fornecedorId} onChange={e => setEditando({...editando, fornecedorId: e.target.value})}>
                                    <option value="">Selecione...</option>
                                    {fornecedores.map(f => <option key={f.id} value={f.id}>{f.nome}</option>)}
                                </select>
                                <input type="number" step="0.01" placeholder="Preço de compra" value={editando.precoCompra} onChange={e => setEditando({...editando, precoCompra: e.target.value})} />
                                <div className="relative">
                                    <input
                                        type="number"
                                        min="0"
                                        max="999"
                                        placeholder={`Margem % (padrão: ${margemPadrao}%)`}
                                        value={editando.margem !== undefined ? editando.margem : ''}
                                        onChange={e => setEditando({...editando, margem: e.target.value === '' ? '' : parseInt(e.target.value) || 0})}
                                    />
                                    <span className="absolute right-4 top-1/2 -translate-y-1/2 text-[#d4af37] text-xs font-usarmy">%</span>
                                </div>
                                <p className="text-[10px] text-gray-500">Deixe vazio para usar a margem padrão ({margemPadrao}%)</p>
                                <div className="flex gap-2">
                                    <button onClick={atualizar} className="flex-1 gold-gradient p-3 rounded-xl font-usarmy text-xs">SALVAR</button>
                                    <button onClick={() => setEditando(null)} className="flex-1 border border-white/10 p-3 rounded-xl text-gray-400 font-usarmy text-xs">CANCELAR</button>
                                </div>
                            </>
                        ) : (
                            <>
                                <input placeholder="Nome da peça *" value={form.nome} onChange={e => setForm({...form, nome: e.target.value})} />
                                <input placeholder="Código/SKU" value={form.codigo} onChange={e => setForm({...form, codigo: e.target.value})} />
                                <select value={form.fornecedorId} onChange={e => setForm({...form, fornecedorId: e.target.value})}>
                                    <option value="">Selecione fornecedor...</option>
                                    {fornecedores.map(f => <option key={f.id} value={f.id}>{f.nome}</option>)}
                                </select>
                                <input type="number" step="0.01" placeholder="Preço de compra R$ *" value={form.precoCompra} onChange={e => setForm({...form, precoCompra: e.target.value})} />
                                <div className="relative">
                                    <input
                                        type="number"
                                        min="0"
                                        max="999"
                                        placeholder={`Margem % (padrão: ${margemPadrao}%)`}
                                        value={form.margem}
                                        onChange={e => setForm({...form, margem: e.target.value})}
                                    />
                                    <span className="absolute right-4 top-1/2 -translate-y-1/2 text-[#d4af37] text-xs font-usarmy">%</span>
                                </div>
                                <p className="text-[10px] text-gray-500">Deixe vazio para usar a margem padrão ({margemPadrao}%)</p>
                                <button onClick={adicionar} className="w-full gold-gradient p-4 rounded-xl font-usarmy text-sm">+ ADICIONAR PEÇA</button>
                            </>
                        )}
                    </div>

                    <div className="relative">
                        <i data-lucide="search" className="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
                        <input 
                            type="text"
                            placeholder="Buscar peças..."
                            className="w-full pl-12"
                            value={busca}
                            onChange={e => setBusca(e.target.value)}
                        />
                    </div>

                    <div className="space-y-3">
                        {pecasFiltradas.length === 0 ? (
                            <div className="text-center py-12 text-gray-600">
                                <i data-lucide="package" className="w-12 h-12 mx-auto mb-4 opacity-50"></i>
                                <p className="font-usarmy text-xs">Nenhuma peça cadastrada</p>
                            </div>
                        ) : (
                            pecasFiltradas.map(p => {
                                const f = fornecedores.find(x => x.id === p.fornecedorId);
                                const margemEfetiva = p.margem !== undefined && p.margem !== null ? p.margem : margemPadrao;
                                const precoVenda = calcularPrecoVenda(p.precoCompra, p.margem);
                                const lucro = parseFloat(precoVenda) - p.precoCompra;

                                return (
                                    <div key={p.id} className="os-card p-4 rounded-xl border-l-2 border-[#d4af37]/40">
                                        <div className="flex justify-between items-start mb-3">
                                            <div className="flex-1">
                                                <p className="text-white font-bold">{p.nome}</p>
                                                <p className="text-xs text-gray-500">{f ? f.nome : 'Fornecedor removido'}{p.codigo ? ` • Cód: ${p.codigo}` : ''}</p>
                                            </div>
                                        </div>

                                        <div className="flex justify-between items-center border-t border-white/5 pt-3">
                                            <div className="flex gap-4 text-sm">
                                                <span className="text-red-400">R$ {p.precoCompra.toFixed(2)}</span>
                                                <span className="text-[#d4af37] font-bold">R$ {precoVenda}</span>
                                                <span className="text-green-400">+R$ {lucro.toFixed(2)}</span>
                                                {p.margem !== undefined && p.margem !== null && <span className="text-xs text-blue-400 font-usarmy">{p.margem}%</span>}
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={() => copiar(p)} className="btn-icon text-[#d4af37] w-8 h-8">
                                                    <i data-lucide="copy" className="w-4 h-4"></i>
                                                </button>
                                                <button onClick={() => iniciarEdicao(p)} className="btn-icon text-[#d4af37] w-8 h-8">
                                                    <i data-lucide="edit" className="w-4 h-4"></i>
                                                </button>
                                                <button onClick={() => excluir(p.id)} className="btn-icon text-red-500 w-8 h-8">
                                                    <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })
                        )}
                    </div>
                </div>
            );
        };

        const GestaoFerramentas = ({ onBack, onHome }) => {
            const { fornecedores, pecas, margemPadrao, setFornecedores, setPecas, setMargemPadrao } = useGestaoData();

            const exportar = () => {
                const dados = { 
                    fornecedores, 
                    pecas, 
                    margemPadrao, 
                    exportadoEm: new Date().toISOString() 
                };
                const json = JSON.stringify(dados, null, 2);
                navigator.clipboard?.writeText(json).then(() => showToast('📋 Dados de gestão copiados!'));
            };

            const importar = () => {
                const json = prompt('Cole o JSON de backup da gestão:');
                if (!json) return;
                try {
                    const dados = JSON.parse(json);
                    if (dados.fornecedores) setFornecedores(dados.fornecedores);
                    if (dados.pecas) setPecas(dados.pecas);
                    if (dados.margemPadrao) setMargemPadrao(dados.margemPadrao);
                    showToast('✅ Dados da gestão importados com sucesso!');
                } catch(e) {
                    showToast('❌ Erro ao importar dados da gestão!');
                }
            };

            return (
                <div className="space-y-6 animate-fadeIn pb-10">
                    <div className="flex items-center justify-between border-b border-white/10 pb-4">
                        <button type="button" onClick={onBack} className="btn-icon text-[#d4af37]">
                            <i data-lucide="arrow-left" className="w-5 h-5"></i>
                        </button>
                        <h2 className="font-usarmy text-[#d4af37] text-sm">FERRAMENTAS TÁTICAS</h2>
                        <button onClick={onHome} className="btn-icon text-[#d4af37]">
                            <i data-lucide="home" className="w-5 h-5"></i>
                        </button>
                    </div>

                    <div className="os-card p-6">
                        <div className="flex items-start gap-4">
                            <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-[#d4af37]/20 to-[#d4af37]/5 border border-[#d4af37]/30 flex items-center justify-center shrink-0">
                                <i data-lucide="shield-check" className="w-7 h-7 text-[#d4af37]"></i>
                            </div>
                            <div className="flex-1 min-w-0">
                                <p className="text-[10px] font-usarmy text-gray-400 tracking-[1px] mb-2">PAINEL DE APOIO</p>
                                <h3 className="font-usarmy text-[#d4af37] text-base mb-2">GESTÃO DE FORNECEDORES E PEÇAS</h3>
                                <p className="text-gray-400 text-sm leading-relaxed">Aqui ficam as utilidades rápidas da área técnica. O backup total do sistema continua centralizado em Ferramentas do menu principal.</p>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-3 gap-3">
                        <div className="os-card p-4 text-center">
                            <p className="text-[9px] text-gray-500 font-usarmy mb-1">FORNECEDORES</p>
                            <p className="font-usarmy text-[#d4af37] text-lg">{fornecedores.length}</p>
                        </div>
                        <div className="os-card p-4 text-center">
                            <p className="text-[9px] text-gray-500 font-usarmy mb-1">PEÇAS</p>
                            <p className="font-usarmy text-[#d4af37] text-lg">{pecas.length}</p>
                        </div>
                        <div className="os-card p-4 text-center">
                            <p className="text-[9px] text-gray-500 font-usarmy mb-1">MARGEM</p>
                            <p className="font-usarmy text-[#d4af37] text-lg">{parseFloat(margemPadrao || 0).toFixed(0)}%</p>
                        </div>
                    </div>

                    <div className="os-card p-5">
                        <div className="flex items-center gap-3 mb-4">
                            <div className="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center">
                                <i data-lucide="clipboard-list" className="w-5 h-5 text-cyan-300"></i>
                            </div>
                            <div>
                                <h4 className="font-usarmy text-cyan-300 text-sm">UTILIDADES RÁPIDAS</h4>

                    const raw = await file.text();
                    const parsed = JSON.parse(raw);
                    if (parsed && parsed.mode === 'full_system_backup') {
                        const localSnapshot = parsed.localSnapshot && typeof parsed.localSnapshot === 'object' ? parsed.localSnapshot : {};
                        const rows = Array.isArray(parsed.indexedRows) ? parsed.indexedRows : [];
                        APP_BACKUP_KEYS.forEach(key => {
                            if (!(key in localSnapshot)) {
                                SafeStorage.removeItem(key);
                            }
                        });
                        Object.entries(localSnapshot).forEach(([key, value]) => {
                            if (value === null || value === undefined) SafeStorage.removeItem(key);
                            else SafeStorage.setItem(key, String(value));
                        });
                        if (rows.length) {

        const OrderForm = ({ order, onSave, onBack, onOpenEquipmentHistory }) => {
            const { state, dispatch } = useDb();
            const { confirm, modal: confirmModal } = useConfirm();
            const [isDirty, setIsDirty] = useState(false);
            const [formData, setFormData] = useState(order || {
                id: Date.now().toString(),
                osNumber: (() => {
                    // Será recalculado no useEffect abaixo
                    return '----';
                })(),
                customerName: '',
                customerPhone: '',
                equipment: '',
                status: 'ABERTA',
                operationalStatus: 'ENTRADA',
                paymentStatus: 'PENDENTE',
                parts: [],
                services: [],
                products: [],
                defects: '',
                techReport: '',
                discountType: 'none',
                discountValue: ''
            });

            // IMPORTANTE: não mantenha cópia local do catálogo, senão o select fica desatualizado
            // (ex.: quando você cadastra itens no Catálogo/Produtos em outra tela e volta para a OS)
            const catalog = state.catalog || [];
            const [temp, setTemp] = useState({ name: '', quantity: '', price: '' });
            const [type, setType] = useState('service');
            const [selectedCatalogId, setSelectedCatalogId] = useState('');
            const [customerInternalNote, setCustomerInternalNote] = useState('');
// Geração automática do número da OS (apenas para OS NOVA)
            useEffect(() => {
                if (order) return; // edição: mantém o número existente

                // não sobrescreve caso já tenha sido calculado
                setFormData(prev => {
                    if (prev.osNumber && prev.osNumber !== '----') return prev;

                    const numbers = (state.orders || [])
                        .map(o => parseInt(String(o.osNumber || '').replace(/\D/g, ''), 10))
                        .filter(n => !isNaN(n));

                    const next = (numbers.length ? Math.max(...numbers) : 0) + 1;
                    const nextOsNumber = String(next).padStart(4, '0');
                    const today = new Date().toLocaleDateString('pt-BR');

                    return {
                        ...prev,
                        osNumber: nextOsNumber,
                        date: prev.date || today
                    };
                });
            }, [order, state.orders]);

            useEffect(() => {
                const nextNote = getCustomerHistorySnapshot(state.orders || [], formData.customerName, formData.id).internalNote || '';
                setCustomerInternalNote(prev => prev === nextNote ? prev : nextNote);
            }, [state.orders, formData.customerName, formData.id]);

            const customerHistory = useMemo(() => (
                getCustomerHistorySnapshot(state.orders || [], formData.customerName, formData.id)
            ), [state.orders, formData.customerName, formData.id]);

            const customerOperationalProfile = useMemo(() => (
                getCustomerOperationalProfile(state.orders || [], formData.customerName, formData.id)
            ), [state.orders, formData.customerName, formData.id]);

            const latestCustomerOrder = useMemo(() => (
                getLatestCustomerOrder(state.orders || [], formData.customerName, formData.id)
            ), [state.orders, formData.customerName, formData.id]);

            const updateForm = useCallback((updates) => {

                setIsDirty(true);

                if (!latestCustomerOrder) return;
                updateForm({
                    customerName: latestCustomerOrder.customerName || formData.customerName || '',
                    customerPhone: latestCustomerOrder.customerPhone || '',

            }, [latestCustomerOrder, updateForm, formData.customerName]);

            const handleSelectCatalog = (selectedId) => {
                if (!selectedId) return;

                // 1) Produtos do estoque (ProductsManager)
                if (selectedId.startsWith('prod_')) {
                    const productId = selectedId.replace('prod_', '');
                    const product = (state.products || []).find(p => p.id === productId);

                    if (!product) {
                        showToast("❌ Produto não encontrado", "error");
                        setSelectedCatalogId("");
                        return;

                    const currentStock = parseInt(product.stock || 0);
                    if (currentStock <= 0) {
                        showToast(`⚠️ ${product.name} FORA DE ESTOQUE`, "error");
                        setSelectedCatalogId("");

                    const alreadyAdded = formData.products?.some(p => p.productId === product.id);

                        setSelectedCatalogId("");

                    }

                    const unitPrice = parseFloat(product.price) || 0;
                    const newItem = {
                        id: Date.now() + Math.random(),
                        productId: product.id,
                        name: product.name,
                        quantity: 1,
                        unitPrice,
                        price: unitPrice,
                        type: 'product'
                    };

                    setFormData(prev => ({ ...prev, products: [...(prev.products || []), newItem] }));

                    setSelectedCatalogId("");
                    return;
                }

                // 2) Itens salvos no catálogo (serviço/peça/produto sem estoque)
                // Usamos prefixo para evitar colisão de IDs entre tipos.
                if (selectedId.startsWith('cat_')) {
                    const [, catType, catId] = selectedId.split('_'); // cat_service_123
                    const item = (state.catalog || []).find(i => i.id === catId && i.type === catType);

                    if (!item) {
                        showToast("❌ Item do catálogo não encontrado", "error");
                        setSelectedCatalogId("");
                        return;
                    }

                    const unitPrice = parseFloat(item.price) || 0;
                    const newItem = {
                        id: Date.now() + Math.random(),
                        name: item.name,
                        quantity: 1,
                        unitPrice,
                        price: unitPrice,
                        type: item.type
                    };

                    if (item.type === 'service') {
                        setFormData(prev => ({ ...prev, services: [...(prev.services || []), newItem] }));
                    } else if (item.type === 'part') {
                        setFormData(prev => ({ ...prev, parts: [...(prev.parts || []), newItem] }));
                    } else if (item.type === 'product') {
                        // Produto de catálogo (sem vínculo com estoque)
                        setFormData(prev => ({ ...prev, products: [...(prev.products || []), newItem] }));
                    }

                    setIsDirty(true);
                    setSelectedCatalogId("");
                    return;
                }

                // Fallback (não deveria ocorrer)
                setSelectedCatalogId("");
            };

const handleAddManual = useCallback(() => {
    try {
        if (!temp.name || !temp.price || !temp.quantity) {
            showToast("⚠️ Preencha todos os campos", "warning");
            return;
        }

        const quantity = parseInt(temp.quantity) || 1;
        if (quantity <= 0) {
            showToast("⚠️ Quantidade deve ser maior que zero", "warning");
            return;
        }

        const unitPrice = parseFloat(temp.price);
        if (isNaN(unitPrice) || unitPrice < 0) {
            showToast("⚠️ Preço inválido", "warning");
            return;
        }

        const totalPrice = unitPrice * quantity;

        const item = {
            id: Date.now() + Math.random(),
            name: temp.name.toUpperCase(),
            quantity: quantity,
            unitPrice: unitPrice,
            price: totalPrice,
            type: type
        };

        setFormData(prev => {
            if (type === 'service') {
                return { ...prev, services: [...prev.services, item] };
            } else if (type === 'part') {
                return { ...prev, parts: [...prev.parts, item] };
            } else if (type === 'product') {
                return { ...prev, products: [...prev.products, item] };
            }
            return prev;
        });

        dispatch({
            type: 'SAVE_CATALOG_ITEM',
            item: { name: temp.name.toUpperCase(), price: unitPrice, type }
        });

        setTemp({ name: '', quantity: '', price: '' });
        setSelectedCatalogId('');
        showToast("✅ Item adicionado", "success");
    } catch (err) {
        console.error(err);
        showToast("❌ Erro ao adicionar item", "error");
    }
}, [temp, type, dispatch]);

                    brand: '',
                    model: '',
                    ammoType: '',
                    defect: '',
                    diagnosis: '',
                    classification: 'EM_ANALISE',
                    notes: ''
                });
                setEditingId(null);
            };

            const filteredRecords = useMemo(() => {
                const term = search.trim().toLowerCase();
                if (!term) return records;
                return records.filter(record =>
                    [record.brand, record.model, record.ammoType, record.defect, record.diagnosis, record.notes, record.classification]
                        .some(value => String(value || '').toLowerCase().includes(term))
                );
            }, [records, search]);

            const summary = useMemo(() => getEquipmentHistorySummary(records), [records]);

            const handleSubmit = () => {
                if (!form.brand.trim() || !form.model.trim() || !form.defect.trim()) {
                    showToast('⚠️ Preencha marca, modelo e defeito', 'warning');
                    return;
                }

                const payload = {
                    id: editingId || String(Date.now()),
                    brand: form.brand.trim(),
                    model: form.model.trim(),
                    ammoType: form.ammoType.trim(),
                    defect: form.defect.trim(),
                    diagnosis: form.diagnosis.trim(),
                    classification: form.classification,
                    notes: form.notes.trim(),
                    date: new Date().toLocaleDateString('pt-BR')
                };

                setRecords(prev => editingId
                    ? prev.map(item => item.id === editingId ? payload : item)
                    : [payload, ...prev]
                );

                showToast(editingId ? '✅ Histórico atualizado' : '✅ Histórico de equipamento salvo', 'success');
                resetForm();
            };

            const handleEdit = (record) => {
                setEditingId(record.id);
                setForm({
                    brand: record.brand || '',
                    model: record.model || '',
                    ammoType: record.ammoType || '',
                    defect: record.defect || '',
                    diagnosis: record.diagnosis || '',
                    classification: record.classification || 'EM_ANALISE',
                    notes: record.notes || ''
                });
                try {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } catch (e) {
                    window.scrollTo(0, 0);
                }
            };

            const handleDelete = async (id) => {
                const ok = await confirm({
                    message: 'EXCLUIR REGISTRO?',
                    subMessage: 'Este histórico será removido do banco de equipamentos.',
                    confirmLabel: 'EXCLUIR',
                    confirmClass: 'bg-red-600 text-white',
                    icon: 'trash-2'
                });
                if (!ok) return;
                setRecords(prev => prev.filter(item => item.id !== id));
                showToast('🗑️ Registro removido', 'success');
            };

            return (
                <div className="space-y-6 animate-fadeIn pb-10">
                    {confirmModal}
                    <div className="flex items-center justify-between border-b border-white/10 pb-4">
                        <button type="button" onClick={onBack} className="btn-icon text-[#d4af37]">
                            <i data-lucide="arrow-left" className="w-5 h-5"></i>
                        </button>
                        <h2 className="font-usarmy text-[#d4af37] text-sm">HISTÓRICO DE EQUIPAMENTOS</h2>
                        <div className="w-10"></div>
                    </div>

                    <div className="os-card p-4 rounded-xl space-y-4">
                        <p className="text-[10px] font-usarmy text-[#d4af37] border-b border-white/5 pb-2 text-center">
                            BANCO TÉCNICO DE EQUIPAMENTOS
                        </p>

                        <div className="grid grid-cols-2 gap-3">
                            <input value={form.brand} onChange={e => setForm(prev => ({ ...prev, brand: e.target.value }))} placeholder="Marca *" className="w-full p-3 rounded-xl" />
                            <input value={form.model} onChange={e => setForm(prev => ({ ...prev, model: e.target.value }))} placeholder="Modelo *" className="w-full p-3 rounded-xl" />
                        </div>

                        <div className="grid grid-cols-2 gap-3">
                            <input value={form.ammoType} onChange={e => setForm(prev => ({ ...prev, ammoType: e.target.value }))} placeholder="Tipo de munição" className="w-full p-3 rounded-xl" />
                            <select value={form.classification} onChange={e => setForm(prev => ({ ...prev, classification: e.target.value }))} className="w-full p-3 rounded-xl">
                                <option value="EM_ANALISE">EM ANÁLISE</option>
                                <option value="DEFEITO_RECORRENTE">DEFEITO RECORRENTE</option>
                                <option value="MAU_USO">MAU USO</option>
                                <option value="DEFEITO_DE_FABRICA">DEFEITO DE FÁBRICA</option>
                                <option value="OUTROS">OUTROS</option>
                            </select>
                        </div>

                        <textarea value={form.defect} onChange={e => setForm(prev => ({ ...prev, defect: e.target.value }))} placeholder="Defeito relatado *" className="w-full p-3 rounded-xl h-20 resize-none" />
                        <textarea value={form.diagnosis} onChange={e => setForm(prev => ({ ...prev, diagnosis: e.target.value }))} placeholder="Diagnóstico / causa provável" className="w-full p-3 rounded-xl h-20 resize-none" />
                        <textarea value={form.notes} onChange={e => setForm(prev => ({ ...prev, notes: e.target.value }))} placeholder="Observações técnicas" className="w-full p-3 rounded-xl h-20 resize-none" />

                        <div className="grid grid-cols-2 gap-3">
                            <button type="button" onClick={handleSubmit} className="gold-gradient p-3 rounded-xl font-usarmy text-sm">
                                {editingId ? 'SALVAR EDIÇÃO' : 'SALVAR HISTÓRICO'}
                            </button>
                            <button type="button" onClick={resetForm} className="p-3 rounded-xl font-usarmy text-sm border border-white/10 text-gray-300 bg-black/20">
                                LIMPAR
                            </button>
                        </div>
                    </div>

                    <div className="os-card p-4 rounded-xl space-y-3">
                        <p className="text-[10px] font-usarmy text-[#d4af37] border-b border-white/5 pb-2 text-center">
                            CONSULTA DE RECORRÊNCIA
                        </p>
                        <div className="grid grid-cols-2 gap-3">
                            <div className="bg-black/20 rounded-lg p-3 border border-white/5">
                                <p className="text-[8px] text-gray-500 mb-2">MODELOS RECORRENTES</p>
                                {summary.recurringModels.length === 0 ? (
                                    <p className="text-[9px] text-gray-400">Sem repetição ainda</p>
                                ) : summary.recurringModels.map((item, index) => (
                                    <div key={`model_${index}`} className="flex items-center justify-between gap-3 text-[9px] py-1">
                                        <p className="text-white truncate flex-1">{item.label}</p>
                                        <span className="text-[#d4af37] font-bold">{item.count}x</span>
                                    </div>
                                ))}
                            </div>
                            <div className="bg-black/20 rounded-lg p-3 border border-white/5">
                                <p className="text-[8px] text-gray-500 mb-2">DEFEITOS RECORRENTES</p>
                                {summary.recurringDefects.length === 0 ? (
                                    <p className="text-[9px] text-gray-400">Sem repetição ainda</p>
                                ) : summary.recurringDefects.map((item, index) => (
                                    <div key={`defect_${index}`} className="flex items-center justify-between gap-3 text-[9px] py-1">
                                        <p className="text-white truncate flex-1">{item.label}</p>
                                        <span className="text-[#d4af37] font-bold">{item.count}x</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className="relative">
                        <i data-lucide="search" className="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500 pointer-events-none"></i>
                        <input
                            type="text"
                            placeholder="Buscar marca, modelo, defeito, munição..."
                            className="w-full pl-12 p-3 rounded-xl text-sm"
                            value={search}
                            onChange={e => setSearch(e.target.value)}
                        />
                    </div>

                    <div className="space-y-3">
                        {filteredRecords.length === 0 ? (
                            <div className="text-center py-20">
                                <i data-lucide="database" className="w-16 h-16 text-gray-700 mx-auto mb-4"></i>
                                <p className="text-gray-600 font-usarmy text-xs">NENHUM HISTÓRICO DE EQUIPAMENTO</p>
                            </div>
                        ) : (
                            filteredRecords.map(record => (
                                <div key={record.id} className="os-card p-4 rounded-xl border-l-2 border-[#d4af37]/35">
                                    <div className="flex items-start justify-between gap-3">
                                        <div className="min-w-0 flex-1">
                                            <p className="text-sm text-white font-bold">{record.brand} • {record.model}</p>
                                            <p className="text-[9px] text-gray-500 mt-1">{record.ammoType || 'Munição não informada'} • {record.date}</p>
                                        </div>
                                        <span className="text-[8px] px-2 py-1 rounded-full border border-[#d4af37]/20 bg-[#d4af37]/10 text-[#f2d06a] font-usarmy whitespace-nowrap">
                                            {String(record.classification || 'EM_ANALISE').replaceAll('_', ' ')}
                                        </span>
                                    </div>

                                    <div className="mt-3 space-y-2 text-[10px]">
                                        <div>
                                            <p className="text-gray-500 mb-1">DEFEITO</p>
                                            <p className="text-white leading-tight">{record.defect || '—'}</p>
                                        </div>
                                        <div>
                                            <p className="text-gray-500 mb-1">DIAGNÓSTICO</p>
                                            <p className="text-white leading-tight">{record.diagnosis || '—'}</p>
                                        </div>
                                        {record.notes && (
                                            <div>
                                                <p className="text-gray-500 mb-1">OBSERVAÇÕES</p>
                                                <p className="text-white leading-tight">{record.notes}</p>
                                            </div>
                                        )}
                                    </div>

                                    <div className="mt-3 flex items-center justify-end gap-2">
                                        <button type="button" onClick={() => handleEdit(record)} className="px-3 py-2 rounded-lg border border-white/10 text-gray-200 bg-black/20 text-[9px] font-usarmy">
                                            EDITAR
                                        </button>
                                        <button type="button" onClick={() => handleDelete(record.id)} className="px-3 py-2 rounded-lg border border-red-500/20 text-red-300 bg-red-500/10 text-[9px] font-usarmy">
                                            EXCLUIR
                                        </button>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );
        };

        // ========== RENDERIZAÇÃO ==========
        SafeStorage.ready.finally(() => {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<DbProvider><App /></DbProvider>);
        });
    </script>

    <script>
        // Service Worker para PWA
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'alcantara-v6-3';
                const urlsToCache = [
                    './',
                    'https://cdn.tailwindcss.com',
                    'https://unpkg.com/react@18/umd/react.production.min.js',
                    'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js',
                    'https://unpkg.com/@babel/standalone/babel.min.js',
                    'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
                    'https://unpkg.com/lucide@latest',
                    'https://i.ibb.co/LFtsfFp/logo.jpg'
                ];

                self.addEventListener('install', event => {
                    event.waitUntil(
                        caches.open(CACHE_NAME)
                            .then(cache => cache.addAll(urlsToCache))
                            .catch(err => console.log('Cache failed:', err))
                    );
                    self.skipWaiting();
                });

                self.addEventListener('fetch', event => {
                    event.respondWith(
                        caches.match(event.request)
                            .then(response => {
                                if (response) {
                                    return response;
                                }
                                return fetch(event.request).catch(() => {
                                    if (event.request.destination === 'image') {
                                        return new Response('Offline', { status: 503 });
                                    }
                                });
                            })
                    );
                });

                self.addEventListener('activate', event => {
                    event.waitUntil(
                        caches.keys().then(cacheNames => {
                            return Promise.all(
                                cacheNames.map(cacheName => {
                                    if (cacheName !== CACHE_NAME) {
                                        return caches.delete(cacheName);
                                    }
                                })
                            );
                        })
                    );
                    self.clients.claim();
                });
            `;

            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);

            navigator.serviceWorker.register(swUrl)
                .then(registration => {
                    console.log('Service Worker registrado:', registration.scope);
                })
                .catch(error => {
                    console.log('Falha ao registrar Service Worker:', error);
                });
        }

        // Inicializa ícones Lucide
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (typeof lucide !== 'undefined') {
                    try {
                        lucide.createIcons();
                    } catch (e) {
                        console.log('Erro ao criar ícones iniciais:', e);
                    }
                }
            }, 500);
        });
    </script>
